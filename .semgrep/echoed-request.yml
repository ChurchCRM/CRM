# Derived from the Semgrep Registry rule below, retrieved 2026-10-17:
# https://semgrep.dev/r/php.lang.security.injection.echoed-request.echoed-request
# Original registry ID: php.lang.security.injection.echoed-request.echoed-request
# The registry rule is excluded from the CI scan so that this taint rule,
# with the project's confirmed HTML sanitizers, is its replacement.
rules:
  - id: churchcrm.php.echoed-request
    languages: [php]
    mode: taint
    severity: ERROR
    message: Echoing unescaped request input may cause cross-site scripting (XSS).
    pattern-sources:
      - pattern: $_REQUEST
      - pattern: $_GET
      - pattern: $_POST
    pattern-sinks:
      - pattern: echo $...VARS;
    pattern-sanitizers:
      - pattern: htmlentities(...)
      - pattern: htmlspecialchars(...)
      - pattern: strip_tags(...)
      - pattern: isset(...)
      - pattern: empty(...)
      - pattern: esc_html(...)
      - pattern: esc_attr(...)
      - pattern: wp_kses(...)
      - pattern: e(...)
      - pattern: twig_escape_filter(...)
      - pattern: xss_clean(...)
      - pattern: html_escape(...)
      - pattern: Html::escape(...)
      - pattern: Xss::filter(...)
      - pattern: escapeHtml(...)
      - pattern: escapeHtmlAttr(...)
      # These helpers call htmlspecialchars(stripslashes($s), ENT_QUOTES, 'UTF-8').
      # Do not add jsonEncodeForScript(): it is for a different output context.
      - pattern: InputUtils::escapeHTML(...)
      - pattern: InputUtils::escapeAttribute(...)
      - pattern: (int) $VAR
    metadata:
      category: security
      cwe: ["CWE-79: Cross-Site Scripting (XSS)"]
      source: https://semgrep.dev/r/php.lang.security.injection.echoed-request.echoed-request
      license: Semgrep Rules License v1.0
