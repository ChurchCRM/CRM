# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm packages in root directory
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "Package Dependencies"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # Pinned: quill 2.0.3 has regressions we don't want to pick up.
      # Remove this entry when a newer 2.x release addresses them.
      - dependency-name: "quill"
        versions: ["2.0.3"]
    groups:
      # UI-critical libraries get their own PR each: a bad patch bump in one of
      # these regresses visible behavior (tables, calendars, page chrome), so
      # each needs its own build/lint/CI verification rather than riding along
      # in the catch-all group below. Groups are matched in order, so these
      # must be declared before npm-minor-patch to take packages out of it.
      tabler:
        patterns:
          - "@tabler/*"
      datatables:
        patterns:
          - "datatables.net*"
      fullcalendar:
        patterns:
          - "fullcalendar"
          - "@fullcalendar/*"
          - "@full-ui/*"
          - "temporal-polyfill"
      # Group all remaining minor/patch updates together
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Group dev dependencies separately
      npm-dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
      # Group TypeScript ecosystem together
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
          - "ts-*"
      # Group testing tools together
      testing:
        patterns:
          - "cypress"
          - "@cypress/*"
          - "jest"
          - "@jest/*"
      # Group build tools together
      build-tools:
        patterns:
          - "webpack"
          - "webpack-*"
          - "babel-*"
          - "@babel/*"
          - "@biomejs/biome"

  # Composer packages in src directory
  - package-ecosystem: "composer"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "Package Dependencies"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # Groups are matched in order. Slim and ORM stay as they were, so they are
      # declared first and take their packages out of the groups below.
      # Group Slim framework packages
      slim:
        patterns:
          - "slim/*"
          - "slim-*"
      # Group Propel/Perpl ORM packages
      orm:
        patterns:
          - "propel/*"
          - "perplorm/*"
      # Dev-only minor/patch updates (phpstan, rector, swagger-php, ...). Kept
      # apart from runtime so a tooling bump never rides in a PR that ships to
      # churches, and so each runtime PR can be reviewed on its own.
      composer-dev:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Runtime minor/patch updates (what ships in the release)
      composer-runtime:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "build"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 3
    groups:
      # Group all actions together into single PR
      actions:
        patterns:
          - "*"
