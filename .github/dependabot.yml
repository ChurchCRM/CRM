# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm packages in root directory
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "Package Dependencies"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # Pinned: quill 2.0.3 has regressions we don't want to pick up.
      # Remove this entry when a newer 2.x release addresses them.
      - dependency-name: "quill"
        versions: ["2.0.3"]
      # Majors of these are planned upgrades on their own branch, because the
      # build and the Cypress suite need changes first. Remove an entry to let
      # Dependabot propose that major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
    groups:
      # Named groups come first; the dev and runtime minor/patch groups take the
      # rest. UI-critical libraries each get their own PR, because a patch bump
      # in one of them changes visible behavior (tables, calendars, page chrome)
      # and needs its own build, lint and CI run.
      tabler:
        patterns:
          - "@tabler/*"
      datatables:
        patterns:
          - "datatables.net*"
      fullcalendar:
        patterns:
          - "fullcalendar"
          - "@fullcalendar/*"
          - "@full-ui/*"
          - "temporal-polyfill"
      # TypeScript ecosystem
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
          - "ts-*"
      # Testing tools
      testing:
        patterns:
          - "cypress"
          - "@cypress/*"
          - "jest"
          - "@jest/*"
      # Build tools
      build-tools:
        patterns:
          - "webpack"
          - "webpack-*"
          - "babel-*"
          - "@babel/*"
          - "@biomejs/biome"
      # Dev-only minor and patch updates, in a PR apart from what ships.
      npm-dev-minor-patch:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Runtime minor and patch updates (what ships in the release)
      npm-runtime-minor-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Composer packages in src directory
  - package-ecosystem: "composer"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "Package Dependencies"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # Named groups come first; the dev and runtime minor/patch groups take the
      # rest.
      # Group Slim framework packages
      slim:
        patterns:
          - "slim/*"
          - "slim-*"
      # Group Propel/Perpl ORM packages
      orm:
        patterns:
          - "propel/*"
          - "perplorm/*"
      # Dev-only minor and patch updates (`require-dev`), in a PR apart from
      # what ships.
      composer-dev:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Runtime minor/patch updates (what ships in the release)
      composer-runtime:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "build"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 3
    groups:
      # Group all actions together into single PR
      actions:
        patterns:
          - "*"
