# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm packages in root directory
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "Package Dependencies"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # Pinned: quill 2.0.3 has regressions we don't want to pick up.
      # Remove this entry when a newer 2.x release addresses them.
      - dependency-name: "quill"
        versions: ["2.0.3"]
      # Major versions of these fail the build or the Cypress suite on arrival
      # (TypeScript 7 breaks `build`; Cypress 16 fails the api and ui shards). The
      # bot re-proposed each one weekly and people closed them, so majors are
      # planned by hand on a branch instead. Remove an entry to let the bot open
      # that major again.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@cypress/*"
        update-types: ["version-update:semver-major"]
    groups:
      # The named groups are listed first, and the dev and runtime minor/patch
      # groups come last. Some packages match two groups (cypress is in testing
      # and is a dev dependency). Which group wins for a minor or patch bump is
      # not verified here: after this merges, check which group a testing
      # package's next minor PR lands in. UI-critical libraries get their own PR:
      # a bad patch bump in one of them regresses visible behavior (tables,
      # calendars, page chrome), so each needs its own build, lint and CI run.
      tabler:
        patterns:
          - "@tabler/*"
      datatables:
        patterns:
          - "datatables.net*"
      fullcalendar:
        patterns:
          - "fullcalendar"
          - "@fullcalendar/*"
          - "@full-ui/*"
          - "temporal-polyfill"
      # TypeScript ecosystem
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
          - "ts-*"
      # Testing tools
      testing:
        patterns:
          - "cypress"
          - "@cypress/*"
          - "jest"
          - "@jest/*"
      # Build tools
      build-tools:
        patterns:
          - "webpack"
          - "webpack-*"
          - "babel-*"
          - "@babel/*"
          - "@biomejs/biome"
      # Dev-only minor and patch updates. Kept apart from runtime so a tooling
      # bump never rides in a PR with a change that ships to churches.
      npm-dev-minor-patch:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Runtime minor and patch updates (what ships in the release)
      npm-runtime-minor-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Composer packages in src directory
  - package-ecosystem: "composer"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "Package Dependencies"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # Groups are matched in order. Slim and ORM stay as they were, so they are
      # declared first and take their packages out of the groups below.
      # Group Slim framework packages
      slim:
        patterns:
          - "slim/*"
          - "slim-*"
      # Group Propel/Perpl ORM packages
      orm:
        patterns:
          - "propel/*"
          - "perplorm/*"
      # Dev-only minor/patch updates (phpstan, rector, swagger-php, ...). Kept
      # apart from runtime so a tooling bump never rides in a PR that ships to
      # churches, and so each runtime PR can be reviewed on its own.
      composer-dev:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Runtime minor/patch updates (what ships in the release)
      composer-runtime:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "build"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 3
    groups:
      # Group all actions together into single PR
      actions:
        patterns:
          - "*"
