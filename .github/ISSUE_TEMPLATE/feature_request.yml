name: ✨ Feature request
description: Share an idea to make ChurchCRM better
title: "Feature: "
type: Feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! 💡 Want to talk it through first? [Join Discord](https://discord.gg/tuWyFzj3Nj).

  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Why does it matter? (optional)
      description: What problem would it solve for you or your church?

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Mockups, screenshots, or workarounds you use today.
