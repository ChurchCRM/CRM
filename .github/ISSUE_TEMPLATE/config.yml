blank_issues_enabled: false
contact_links:
  - name: 🐛 Report Bug via ChurchCRM App (Recommended)
    url: https://docs.churchcrm.io/administration/reporting-issues
    about: Use Support → Report an Issue in your ChurchCRM installation for automatic system info capture — it files a GitHub issue for you
  - name: 📚 Documentation
    url: https://docs.churchcrm.io
    about: Check our documentation for answers to common questions before opening an issue
  - name: 💬 Discord — talk it through
    url: https://discord.gg/tuWyFzj3Nj
    about: Live help and conversation. Use Discord when you want support or to chat, instead of only opening a GitHub issue
  - name: 🔒 Report a Security Vulnerability (Private)
    url: https://github.com/ChurchCRM/CRM/security/advisories/new
    about: Never file security issues publicly — use a private security advisory
