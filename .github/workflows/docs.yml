name: Documentation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
    paths:
      - 'src/api/routes/**'
      - 'src/admin/routes/api/**'
      - 'docs/openapi/**'
      - '!docs/openapi/generated/**'
      - 'src/kiosk/routes/api/**'
      - 'src/plugins/routes/api/**'
  pull_request:
    paths:
      - 'src/api/routes/**'
      - 'src/admin/routes/api/**'
      - 'docs/openapi/**'
      - '!docs/openapi/generated/**'
      - 'src/kiosk/routes/api/**'
      - 'src/plugins/routes/api/**'

permissions:
  contents: write
  actions: read

jobs:
  validate:
    if: github.ref != 'refs/heads/master'
    name: Generate and validate OpenAPI specs
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout CRM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/composer-install
        with:
          no-dev: 'false'
      - name: Generate Public API spec
        run: cd src && composer run openapi:public
      - name: Generate Private API spec
        run: cd src && composer run openapi:private
      - name: Upload generated specs as artifacts
        uses: ./.github/actions/upload-artifact
        with:
          name: openapi-specs-${{ github.run_id }}
          path: docs/openapi/generated/*.yaml
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    name: Generate, validate, and publish OpenAPI specs
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout CRM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/composer-install
        with:
          no-dev: 'false'
      - name: Generate Public API spec
        run: cd src && composer run openapi:public
      - name: Generate Private API spec
        run: cd src && composer run openapi:private
      - name: Check for changes
        id: changes
        run: |
          if git status --porcelain -- docs/openapi/generated/ | grep -q .; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push generated specs
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/openapi/generated/
          git commit -m "docs: update OpenAPI specifications"
          git push origin master
      - name: Upload generated specs as artifacts
        uses: ./.github/actions/upload-artifact
        with:
          name: openapi-specs-${{ github.run_id }}
          path: docs/openapi/generated/*.yaml
          retention-days: 7
