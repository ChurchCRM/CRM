name: Release & Start Next

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# End-of-cycle one-click flow:
#
#   1. publish    — finds the latest successful master Build/Test/Package run
#                   whose package.json version matches the expected version,
#                   downloads its ChurchCRM-<version>.zip, and creates a
#                   GitHub Release (draft by default). The tag is auto-
#                   detected from package.json on that build's commit, so you
#                   don't retype the version.
#
#   2. start_next — chains into release-prepare.yml (reusable) to bump master
#                   to the version you typed in `next_version` and open the
#                   "Start <next> release" PR.
#
# Review the draft release + the bump PR. If happy, click "Publish release"
# on GitHub and merge the PR.
#
# For mid-cycle re-bumps (e.g. patch → minor because a feature landed) run
# the standalone "Start New Release" workflow directly — it remains the
# right tool for that scope change.

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Next version to start AFTER this release (e.g. 7.2.4 patch, 7.3.0 minor, 8.0.0 major). The current version being released is auto-detected from package.json on master.'
        required: true
        type: string
      prerelease:
        description: 'Mark the release being published as pre-release (RCs / betas)'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft so you can review before publishing'
        required: false
        type: boolean
        default: true
      run_id:
        description: 'Optional: specific Build/Test/Package run ID to release from. Leave blank for the latest successful master build matching the expected version.'
        required: false
        type: string
      release_version_override:
        description: 'Optional: override the auto-detected release tag. Leave blank to use package.json on the source build commit. Note: providing this bypasses the version guard introduced in this workflow — use only as an explicit escape hatch.'
        required: false
        type: string
      expected_version:
        description: 'Optional: the version you expect to release (e.g. 7.6.3). Leave blank to derive from package.json on the dispatch commit (master HEAD). Used to reject a build whose package.json version does not match.'
        required: false
        type: string

jobs:
  # ───────────────────────────────────────────────────────────────────
  # Publish the CURRENT version as a GitHub Release.
  # ───────────────────────────────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      # gh CLI needs to know the repo to query since we don't check out the
      # working tree — without this, commands like `gh run download` fail with
      # "fatal: not a git repository".
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
      release_url: ${{ steps.release.outputs.release_url }}
    steps:
      - name: Determine expected version
        id: expected
        env:
          INPUT_EXPECTED: ${{ inputs.expected_version }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_EXPECTED" ]; then
            expected="$INPUT_EXPECTED"
            if ! [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::expected_version '$expected' does not look like a semantic version (expected X.Y.Z…). Fix the input."
              exit 1
            fi
            echo "Using explicit expected_version=$expected from workflow input."
          else
            pkg_b64=$(gh api "repos/$GH_REPO/contents/package.json?ref=$HEAD_SHA" --jq '.content')
            expected=$(echo "$pkg_b64" | base64 -d | jq -r '.version' 2>/dev/null) || expected=""
            if [ -z "$expected" ] || [ "$expected" = "null" ]; then
              echo "::error::Could not read version from package.json at HEAD ($HEAD_SHA). Pass expected_version explicitly."
              exit 1
            fi
            echo "Derived expected version $expected from package.json at HEAD ($HEAD_SHA)."
          fi
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - name: Resolve source build run
        id: run
        env:
          INPUT_RUN_ID: ${{ inputs.run_id }}
          EXPECTED: ${{ steps.expected.outputs.expected }}
        run: |
          set -euo pipefail

          # Helper: read the package.json version at a given commit SHA.
          # Returns empty string on any error so the caller can handle it.
          pkg_version() {
            local sha="$1"
            gh api "repos/$GH_REPO/contents/package.json?ref=$sha" \
              --jq '.content' 2>/dev/null \
              | base64 -d \
              | jq -r '.version' 2>/dev/null \
              || echo ""
          }

          if [ -n "$INPUT_RUN_ID" ]; then
            run_id="$INPUT_RUN_ID"
            echo "Using explicit run_id=$run_id from workflow input."
          else
            echo "Auto-resolving latest successful master build for version $EXPECTED..."

            # Belt-and-suspenders: EXPECTED should always be set here because
            # the Determine expected version step exits non-zero when it cannot
            # produce a version, which skips all later steps. Guard anyway so
            # an empty EXPECTED never silently matches an unreadable build.
            if [ -z "$EXPECTED" ]; then
              echo "::error::BUG: EXPECTED is empty; Determine expected version step should have caught this."
              exit 1
            fi

            # Fetch the N most recent successful push-to-master builds and scan
            # them newest-first, stopping at the first whose package.json version
            # matches EXPECTED. This avoids silently picking a stale run that
            # happened to be the only one with status=success at query time.
            # 20 covers many release cycles of typical build cadence; raise
            # this limit if your team ships more frequently.
            candidates_json=$(gh run list \
              --workflow=build-test-package.yml \
              --branch=master \
              --event=push \
              --status=success \
              --limit=20 \
              --json databaseId,headSha,createdAt)

            if [ "$(echo "$candidates_json" | jq 'length')" -eq 0 ]; then
              echo "::error::No successful master builds found. Merge to master and wait for a green build, or pass a run_id explicitly."
              exit 1
            fi

            run_id=""
            selected_created_at=""

            echo "Scanning up to 20 recent candidates for version $EXPECTED:"
            while IFS=$'\t' read -r candidate_id candidate_sha candidate_created; do
              candidate_ver=$(pkg_version "$candidate_sha")
              echo "  run #$candidate_id  commit ${candidate_sha:0:12}  created $candidate_created  version=${candidate_ver:-<unreadable>}"
              if [ "$candidate_ver" = "$EXPECTED" ]; then
                run_id="$candidate_id"
                selected_created_at="$candidate_created"
                echo "  ✓ Matched: run #$run_id (version $candidate_ver)"
                break
              fi
            done < <(echo "$candidates_json" | jq -r '.[] | "\(.databaseId)\t\(.headSha)\t\(.createdAt)"')

            if [ -z "$run_id" ]; then
              echo "::error::No successful master build found with package.json version $EXPECTED in the last 20 runs. Either push a build that bumps package.json to $EXPECTED, pass an explicit run_id, or pass expected_version to override the version guard."
              exit 1
            fi

            # Warn operators when the winning build is unexpectedly old.
            MAX_AGE_DAYS=30
            run_age_days=$(( ( $(date -u +%s) - $(date -u -d "$selected_created_at" +%s) ) / 86400 ))
            if [ "$run_age_days" -gt "$MAX_AGE_DAYS" ]; then
              echo "::warning::Selected build run #$run_id is $run_age_days days old (threshold: $MAX_AGE_DAYS days). Consider passing an explicit run_id from a more recent build to avoid releasing from a stale artifact."
            fi
          fi

          commit=$(gh run view "$run_id" --json headSha --jq .headSha)
          run_url=$(gh run view "$run_id" --json url --jq .url)

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

          echo "Releasing from run #$run_id (commit $commit)"

      - name: Resolve release tag
        id: tag
        env:
          INPUT_OVERRIDE: ${{ inputs.release_version_override }}
          NEXT_VERSION: ${{ inputs.next_version }}
          COMMIT: ${{ steps.run.outputs.commit }}
          EXPECTED: ${{ steps.expected.outputs.expected }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_OVERRIDE" ]; then
            tag="$INPUT_OVERRIDE"
            echo "Using explicit release_version_override=$tag from workflow input."
          else
            # Read package.json at the source build's commit. Avoids checking
            # out the whole tree just to inspect one file.
            pkg_b64=$(gh api "repos/$GH_REPO/contents/package.json?ref=$COMMIT" --jq '.content')
            tag=$(echo "$pkg_b64" | base64 -d | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
            if [ -z "$tag" ]; then
              echo "::error::Could not auto-detect version from package.json at $COMMIT. Pass release_version_override explicitly."
              exit 1
            fi
            echo "Auto-detected tag=$tag from package.json at $COMMIT."

            # Guard: the resolved build must carry the expected version.
            # This catches silent mismatches (e.g. stale build run picked up by
            # auto-resolve, or an explicit run_id pointing at the wrong release).
            if [ "$tag" != "$EXPECTED" ]; then
              echo "::error::Version mismatch: package.json at build commit $COMMIT contains version '$tag', but expected '$EXPECTED' (derived from master HEAD or expected_version input). The selected build run does not match the current release. Pass an explicit run_id for the correct build, or pass release_version_override to force a tag."
              exit 1
            fi
          fi

          # Sanity: next_version must differ from the tag we're about to release.
          if [ "$tag" = "$NEXT_VERSION" ]; then
            echo "::error::next_version ($NEXT_VERSION) matches the version being released ($tag). Pick a higher version for next_version."
            exit 1
          fi

          # Suggestion table (visibility for patch/minor/major decision).
          BASE="${tag%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEXT_PATCH="$MAJOR.$MINOR.$((PATCH+1))"
          NEXT_MINOR="$MAJOR.$((MINOR+1)).0"
          NEXT_MAJOR="$((MAJOR+1)).0.0"

          {
            echo "## Version check"
            echo ""
            echo "| Role | Version |"
            echo "|---|---|"
            echo "| Releasing now           | \`$tag\` |"
            echo "| Next version (typed)    | \`$NEXT_VERSION\` |"
            echo "| Suggested next patch    | \`$NEXT_PATCH\` |"
            echo "| Suggested next minor    | \`$NEXT_MINOR\` |"
            echo "| Suggested next major    | \`$NEXT_MAJOR\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release artifact
        id: artifact
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-download
          # gh run download unwraps the upload-artifact outer zip, so we end up
          # with the real ChurchCRM-<version>.zip on disk (no double-unzip).
          gh run download "$RUN_ID" \
            --pattern 'ChurchCRM-*' \
            --dir release-download

          zip_path=$(find release-download -type f -name 'ChurchCRM-*.zip' | head -n 1)
          if [ -z "$zip_path" ]; then
            echo "::error::No ChurchCRM-*.zip found in artifacts for run $RUN_ID"
            find release-download -maxdepth 3 -print
            exit 1
          fi

          mv "$zip_path" ./
          zip_name=$(basename "$zip_path")
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "Found release asset: $zip_name"

      - name: Create GitHub Release (delete and recreate if exists)
        id: release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET_COMMIT: ${{ steps.run.outputs.commit }}
          ZIP_NAME: ${{ steps.artifact.outputs.zip_name }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # Check if release exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — deleting it and recreating from scratch."
            gh release delete "$TAG" --yes || {
              echo "::warning::Failed to delete release $TAG, attempting with --force flag"
              gh release delete "$TAG" --yes --force || true
            }
            echo "Waiting 2 seconds for GitHub to finalize deletion..."
            sleep 2
          fi

          # Delete the git tag if it exists (GitHub usually deletes it automatically)
          echo "Checking for git tag $TAG..."
          if gh api "repos/$GH_REPO/git/refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Git tag $TAG exists — deleting via API."
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" || {
              echo "::warning::Failed to delete git tag via API, it may have been auto-deleted"
              true
            }
            echo "Waiting 2 seconds for tag deletion to propagate..."
            sleep 2
          else
            echo "Git tag $TAG does not exist or already deleted."
          fi

          echo "Creating fresh release $TAG targeting $TARGET_COMMIT."
          gh release create "$TAG" "$ZIP_NAME" \
            --title "$TAG" \
            --target "$TARGET_COMMIT" \
            --generate-notes \
            --draft="$IS_DRAFT" \
            --prerelease="$IS_PRERELEASE" || {
            echo "::error::Failed to create release. Check token permissions and ensure tag $TAG is fully deleted."
            exit 1
          }

          release_url=$(gh release view "$TAG" --json url --jq .url)
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
          COMMIT: ${{ steps.run.outputs.commit }}
          ZIP_NAME: ${{ steps.artifact.outputs.zip_name }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- **Tag:** \`$TAG\`"
            echo "- **Draft:** $IS_DRAFT"
            echo "- **Pre-release:** $IS_PRERELEASE"
            echo "- **Source build:** [run #$RUN_ID]($RUN_URL)"
            echo "- **Commit:** \`$COMMIT\`"
            if [ -n "${ZIP_NAME:-}" ]; then
              echo "- **Asset:** \`$ZIP_NAME\`"
            fi
            if [ -n "${RELEASE_URL:-}" ]; then
              echo ""
              echo "### [Open release page]($RELEASE_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────
  # Bump master to the next version + open "Start <next> release" PR.
  # Reuses release-prepare.yml so the bump logic lives in one place.
  # ───────────────────────────────────────────────────────────────────
  start_next:
    needs: publish
    if: success()
    uses: ./.github/workflows/release-prepare.yml
    with:
      version: ${{ inputs.next_version }}
    permissions:
      contents: write
      pull-requests: write
