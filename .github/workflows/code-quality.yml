name: CI — Typecheck, Lint & Format

on:
  push:
    branches:
      - master
      - develop
      - 'hotfix/**'
    paths-ignore:
      # App lint/typecheck is unnecessary when a PR changes documentation only.
      - '**/*.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      # App lint/typecheck is unnecessary when a PR changes documentation only.
      - '**/*.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Use Node.js (from .nvmrc)
        uses: ./.github/actions/setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint (typecheck, Biome, UI, icon, Cypress, SQL, and locale script checks)
        run: npm run lint
