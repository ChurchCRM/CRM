name: CI — Typecheck, Lint & Format

on:
  push:
    branches:
      - master
      - develop
      - 'hotfix/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.ddev/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.ddev/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc)
        run: npx tsc --noEmit --pretty
      - name: Format check (biome)
        run: npx biome format .
      - name: Lint check (biome)
        run: npx biome check webpack/
      - name: Seed schema charset check
        run: npm run validate:seed-charsets
      - name: MySQL upgrade script syntax check (no MariaDB-only column IF EXISTS)
        run: npm run validate:mysql-upgrade-syntax
      - name: Icon library check (no Tabler icon classes)
        run: node scripts/validate-no-tabler-icons.js
      - name: Icon existence check (no Pro-only Font Awesome classes)
        run: node scripts/validate-fa-icons-exist.js
      - name: Cypress API keys match seeded users
        run: npm run lint:cypress-api-keys
      - name: Cypress command declarations in sync
        run: npm run lint:cypress-commands
      - name: Cypress spec coverage (every spec is reachable by a config)
        run: npm run lint:cypress-spec-coverage
