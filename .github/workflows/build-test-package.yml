name: Build, Test and Package

concurrency:
  # PRs: de-dup by PR number (cancel superseded runs).
  # Pushes: per-commit group so back-to-back master/branch pushes all run
  # concurrently without waiting or cancelling each other.
  # Release upload serialisation is handled at the package job level.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('pr-{0}', github.event.number)
        || format('{0}-{1}', github.workflow, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  actions: read

on:
  pull_request:
    branches:
      - master
      - develop
      - 'hotfix/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.ddev/**'
      - '.githooks/**'
      - '.agents/**'
      - '.claude/**'
      - '.claudecode/**'
      - '.editorconfig'
      - '.codespellrc'
      - '.devskim.json'
      - 'CODEOWNERS'
      - 'locale/terms/**'
      - 'locale/scripts/**'
      - 'locale/messages.po'
      - 'locale/messages.json'
      - '.github/FUNDING.yml'
      - '.github/release.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/issue-comments/**'
  push:
    branches:
      - master
      - develop
      - 'hotfix/**'
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.ddev/**'
      - '.githooks/**'
      - '.agents/**'
      - '.claude/**'
      - '.claudecode/**'
      - '.editorconfig'
      - '.codespellrc'
      - '.devskim.json'
      - 'CODEOWNERS'
      - 'locale/terms/**'
      - 'locale/scripts/**'
      - 'locale/messages.po'
      - 'locale/messages.json'
      - '.github/FUNDING.yml'
      - '.github/release.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/issue-comments/**'
  workflow_dispatch:

jobs:
  # Determine which PHP versions to test based on trigger
  # matrix decision:
  #   workflow_dispatch → ["8.4","8.5"]  (manual full-matrix sweep)
  #   everything else   → ["8.4"]        (push/PR — 8.5 and exhaustive
  #                                        coverage live in build-test-nightly.yml)
  configure:
    runs-on: ubuntu-24.04
    outputs:
      php-versions: ${{ steps.set-matrix.outputs.php-versions }}
    steps:
    - id: set-matrix
      run: |
        case "${{ github.event_name }}" in
          workflow_dispatch) echo 'php-versions=["8.4","8.5"]' >> $GITHUB_OUTPUT ;;
          *)                         echo 'php-versions=["8.4"]'        >> $GITHUB_OUTPUT ;;
        esac

  build:
    needs: configure
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - uses: ./.github/actions/checkout-node-npm

    - name: Declare variables
      id: vars
      shell: bash
      run: |
        branch_name="${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          branch_name="pr-${{ github.event.number }}"
        fi
        safe_branch=$(echo "$branch_name" | sed 's/[\/\\<>:"|?*]/-/g')
        echo "branch=$branch_name" >> $GITHUB_OUTPUT
        echo "safe_branch=$safe_branch" >> $GITHUB_OUTPUT

    - name: Get package version
      id: package-version
      run: echo "current-version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

    - uses: ./.github/actions/composer-install

    - name: Build app
      run: npm run package

    - name: Validate PHP syntax
      run: npm run build:php:validate:all

    - name: Run PHP error-redaction tests
      run: npm run test:php

    - name: Build Docker images
      run: |
        PHP_VERSIONS='${{ needs.configure.outputs.php-versions }}'
        for version in $(echo "$PHP_VERSIONS" | jq -r '.[]'); do
          echo "Building Docker image for PHP $version..."
          docker build --target test \
            --build-arg PHP_VERSION=$version \
            -t churchcrm/crm:php${version}-test \
            -f docker/Dockerfile.churchcrm-apache-php8 docker/
          docker save churchcrm/crm:php${version}-test | gzip > temp/docker-image-${version}.tar.gz
          echo "Saved: $(du -h temp/docker-image-${version}.tar.gz | cut -f1)"
        done

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ github.run_id }}
        path: |
          src/
          temp/
          !src/logs
        retention-days: 1

  test-root:
    needs: [configure, build]
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.configure.outputs.php-versions) }}
        test-type:
          - name: api
            spec: "cypress/e2e/api/**/*.spec.js"
            config: "cypress/configs/docker.config.ts"
          - name: admin-ui
            spec: "cypress/e2e/ui-admin/**/*.spec.js"
            config: "cypress/configs/docker-admin.config.ts"
        include:
          # ui specs sharded 3× (PHP 8.4 only; 8.5 ui covered by build-test-nightly.yml)
          # split-index values are strings to avoid JS falsy coercion of 0
          - php-version: "8.4"
            test-type: { name: ui-shard-0, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "0"
            shard-total: 3
          - php-version: "8.4"
            test-type: { name: ui-shard-1, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "1"
            shard-total: 3
          - php-version: "8.4"
            test-type: { name: ui-shard-2, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "2"
            shard-total: 3
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - uses: ./.github/actions/checkout-node-npm
      with:
        cache-cypress: 'true'

    - name: Download build artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: build-${{ github.run_id }}
        path: .

    - name: Load Docker image
      run: |
        docker load < temp/docker-image-${{ matrix.php-version }}.tar.gz
        docker tag churchcrm/crm:php${{ matrix.php-version }}-test churchcrm/crm:php8-debian

    - name: Start Docker (root path)
      run: |
        cp docker/Config.root.php src/Include/Config.php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root up -d

    - name: Wait for server (root path)
      uses: ./.github/actions/wait-for-server
      with:
        url: 'http://127.0.0.1/api/public/echo'
        docker-compose-profile: 'ci-root'
        docker-compose-files: 'docker/docker-compose.yaml,docker/docker-compose.parallel.yaml'

    - name: Run Cypress ${{ matrix.test-type.name }} tests (root, PHP ${{ matrix.php-version }})
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: ${{ matrix.test-type.config }}
        spec: ${{ matrix.test-type.spec }}
        test-name: ${{ matrix.test-type.name }}
        php-version: ${{ matrix.php-version }}
        deployment: root
        # api uses docker.config.ts, whose specPattern also matches ui/**
        # specs (see cypress/configs/docker.config.ts). Forcing SPLIT via the
        # default shard-total fallback would make cypress-split discover and
        # run every matching spec (api + ui) in this single job instead of
        # just the api ones, so api keeps shard-total empty and relies on the
        # explicit --spec filter in run-cypress-tests/action.yml instead.
        # NOTE: written as `name != 'api' && (...) || ''`, not
        # `name == 'api' && '' || (...)` — with GitHub Actions' left-to-right
        # &&/|| evaluation, `true && ''` is itself falsy, so an `== 'api'`
        # form would fall through to the `|| (matrix.shard-total || 1)`
        # fallback instead of returning ''.
        shard-total: ${{ matrix.test-type.name != 'api' && (matrix.shard-total || 1) || '' }}
        shard-index: ${{ matrix.split-index || '0' }}
        docker-compose-profile: ci-root
      env:
        # Test-database drift guard (#9769): the ci-root database is published on
        # 3306 (docker-compose.parallel.yaml). Required, so a guard that cannot
        # reach the database fails the job instead of silently switching off.
        ROW_GUARD_DB_PORT: "3306"
        ROW_GUARD_REQUIRED: "1"

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:root:down

  test-subdir:
    needs: [configure, build]
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.configure.outputs.php-versions) }}
        test-type:
          - name: api
            spec: "cypress/e2e/api/**/*.spec.js"
            config: "cypress/configs/docker.config.ts"
          - name: admin-ui
            spec: "cypress/e2e/ui-admin/**/*.spec.js"
            config: "cypress/configs/docker-admin.config.ts"
        include:
          # ui specs sharded 3× (PHP 8.4 only; 8.5 ui covered by build-test-nightly.yml)
          # split-index values are strings to avoid JS falsy coercion of 0
          - php-version: "8.4"
            test-type: { name: ui-shard-0, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "0"
            shard-total: 3
          - php-version: "8.4"
            test-type: { name: ui-shard-1, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "1"
            shard-total: 3
          - php-version: "8.4"
            test-type: { name: ui-shard-2, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "2"
            shard-total: 3
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - uses: ./.github/actions/checkout-node-npm
      with:
        cache-cypress: 'true'

    - name: Download build artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: build-${{ github.run_id }}
        path: .

    - name: Load Docker image
      run: |
        docker load < temp/docker-image-${{ matrix.php-version }}.tar.gz
        docker tag churchcrm/crm:php${{ matrix.php-version }}-test churchcrm/crm:php8-debian

    - name: Start Docker (subdirectory path)
      run: |
        cp docker/Config.parallel.subdir.php src/Include/Config.php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir up -d

    - name: Wait for server (subdirectory path)
      uses: ./.github/actions/wait-for-server
      with:
        url: 'http://127.0.0.1:8080/churchcrm/api/public/echo'
        docker-compose-profile: 'ci-subdir'

    - name: Run Cypress ${{ matrix.test-type.name }} tests (subdir, PHP ${{ matrix.php-version }})
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: ${{ matrix.test-type.config }}
        spec: ${{ matrix.test-type.spec }}
        test-name: ${{ matrix.test-type.name }}
        php-version: ${{ matrix.php-version }}
        deployment: subdir
        # api uses docker.config.ts, whose specPattern also matches ui/**
        # specs (see cypress/configs/docker.config.ts). Forcing SPLIT via the
        # default shard-total fallback would make cypress-split discover and
        # run every matching spec (api + ui) in this single job instead of
        # just the api ones, so api keeps shard-total empty and relies on the
        # explicit --spec filter in run-cypress-tests/action.yml instead.
        # NOTE: written as `name != 'api' && (...) || ''`, not
        # `name == 'api' && '' || (...)` — with GitHub Actions' left-to-right
        # &&/|| evaluation, `true && ''` is itself falsy, so an `== 'api'`
        # form would fall through to the `|| (matrix.shard-total || 1)`
        # fallback instead of returning ''.
        shard-total: ${{ matrix.test-type.name != 'api' && (matrix.shard-total || 1) || '' }}
        shard-index: ${{ matrix.split-index || '0' }}
        base-url: http://127.0.0.1:8080/churchcrm/
        docker-compose-profile: ci-subdir
      env:
        # Test-database drift guard (#9769): the ci-subdir database is published on
        # DATABASE_SUBDIR_PORT (3307), not the 3306 default the guard would try.
        ROW_GUARD_DB_PORT: "3307"
        ROW_GUARD_REQUIRED: "1"

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:subdir:down

  test-new-system:
    needs: [configure, build]
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.configure.outputs.php-versions) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - uses: ./.github/actions/checkout-node-npm
      with:
        cache-cypress: 'true'

    - name: Download build artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: build-${{ github.run_id }}
        path: .

    - name: Load Docker image
      run: |
        docker load < temp/docker-image-${{ matrix.php-version }}.tar.gz
        docker tag churchcrm/crm:php${{ matrix.php-version }}-test churchcrm/crm:php8-debian

    - name: Generate file signatures
      run: node scripts/generate-signatures-node.js

    - name: Remove Config.php for fresh install test
      run: rm -f src/Include/Config.php

    - name: Start Docker (new system)
      run: docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-new-system up -d

    - name: Wait for server (new system)
      uses: ./.github/actions/wait-for-server
      with:
        url: 'http://127.0.0.1:8081/'
        docker-compose-profile: 'ci-new-system'

    - name: Run Cypress tests (setup wizard, PHP ${{ matrix.php-version }})
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: cypress/configs/new-system.config.ts
        spec: cypress/e2e/new-system/**/*.spec.js
        test-name: setup
        php-version: ${{ matrix.php-version }}
        deployment: new-system
        shard-total: 1
        shard-index: '0'
        docker-compose-profile: ci-new-system

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:new-system:down

  test-new-system-subdir:
    needs: [configure, build]
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.configure.outputs.php-versions) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - uses: ./.github/actions/checkout-node-npm
      with:
        cache-cypress: 'true'

    - name: Download build artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: build-${{ github.run_id }}
        path: .

    - name: Load Docker image
      run: |
        docker load < temp/docker-image-${{ matrix.php-version }}.tar.gz
        docker tag churchcrm/crm:php${{ matrix.php-version }}-test churchcrm/crm:php8-debian

    - name: Generate file signatures
      run: node scripts/generate-signatures-node.js

    - name: Remove Config.php for fresh install test
      run: rm -f src/Include/Config.php

    - name: Start Docker (new system subdirectory)
      run: npm run docker:ci:new-system:subdir:start

    - name: Wait for server (new system subdirectory)
      uses: ./.github/actions/wait-for-server
      with:
        url: 'http://127.0.0.1:8081/churchcrm/'
        docker-compose-profile: 'ci-new-system'
        docker-compose-files: 'docker/docker-compose.yaml,docker/docker-compose.parallel.yaml,docker/docker-compose.subdir.yaml'

    - name: Run Cypress tests (setup wizard subdir, PHP ${{ matrix.php-version }})
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: cypress/configs/new-system.config.ts
        spec: cypress/e2e/new-system/**/*.spec.js
        test-name: setup
        php-version: ${{ matrix.php-version }}
        deployment: new-system-subdir
        shard-total: 1
        shard-index: '0'
        base-url: http://127.0.0.1:8081/churchcrm/
        docker-compose-profile: ci-new-system
        docker-compose-files: 'docker/docker-compose.yaml,docker/docker-compose.parallel.yaml,docker/docker-compose.subdir.yaml'

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:new-system:subdir:down

  package:
    needs: [build, test-root, test-subdir, test-new-system, test-new-system-subdir]
    # Serialize release uploads per branch so concurrent master builds
    # don't race on gh release upload.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    # Package only after the normal integration suite succeeds. Heavy exhaustive
    # sweeps (incl. the full locale sweep) belong in the nightly workflow, not
    # in the push/PR critical path. build-test-nightly.yml also triggers on
    # every push to release/**, so release-branch commits still get an
    # automatic full-locale run — it just doesn't block this package job.
    if: ${{ needs.build.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - uses: ./.github/actions/checkout-node-npm

    - name: Declare variables
      id: vars
      shell: bash
      run: |
        branch_name="${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          branch_name="pr-${{ github.event.number }}"
        fi
        safe_branch=$(echo "$branch_name" | sed 's/[\/\\<>:"|?*]/-/g')
        echo "branch=$branch_name" >> $GITHUB_OUTPUT
        echo "safe_branch=$safe_branch" >> $GITHUB_OUTPUT

    - name: Get package version
      id: package-version
      run: echo "current-version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

    - name: Download build artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: build-${{ github.run_id }}
        path: .

    - name: Upload release artifact
      uses: actions/upload-artifact@v7
      with:
        name: >-
          ${{ github.ref == 'refs/heads/master' &&
              format('ChurchCRM-{0}', steps.package-version.outputs.current-version) ||
              (github.event_name == 'pull_request' &&
               format('ChurchCRM-{0}-PR{1}', steps.package-version.outputs.current-version, github.event.number) ||
               format('ChurchCRM-{0}-{1}', steps.package-version.outputs.current-version, steps.vars.outputs.safe_branch)) }}
        path: temp/ChurchCRM-*.zip
        retention-days: 90
        if-no-files-found: error

    - name: Build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.package-version.outputs.current-version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ steps.vars.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tests:**" >> $GITHUB_STEP_SUMMARY
        echo "- Root path (API + UI)" >> $GITHUB_STEP_SUMMARY
        echo "- Subdirectory (API + UI)" >> $GITHUB_STEP_SUMMARY
        echo "- New system setup wizard (root + subdirectory)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -d "temp" ]; then
          echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
          for file in temp/ChurchCRM-*.zip; do
            [ -f "$file" ] && echo "- \`$(basename "$file")\` ($(du -h "$file" | cut -f1))" >> $GITHUB_STEP_SUMMARY
          done
        fi
