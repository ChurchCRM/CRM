name: Build & Push Docker Images

on:
  release:
    types: [published]

env:
  REGISTRY: docker.io
  IMAGE_NAME: churchcrm/crm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile.churchcrm-fpm-php8
            tag-suffix: php8-fpm
            platforms: linux/amd64,linux/arm64

          - dockerfile: docker/Dockerfile.churchcrm-apache-php8
            tag-suffix: php8-apache
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout Dockerfiles
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker

      - name: Get version from release tag
        id: version
        run: |
          VERSION="${{ github.ref }}"
          VERSION="${VERSION#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build-context
          cd build-context
          gh release download --repo ${{ github.repository }} --pattern 'ChurchCRM-*.zip'
          unzip -q ChurchCRM-*.zip
          rm ChurchCRM-*.zip
          if [[ $(ls -1 | wc -l) -eq 1 && -d $(ls -1) ]]; then
            mv $(ls -1)/* . && rmdir $(ls -1 -d */)
          fi

      - name: Add Apache config to build context
        run: |
          mkdir -p build-context/apache
          cp docker/apache/default.conf build-context/apache/default.conf

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: build-context
          file: ${{ matrix.dockerfile }}
          target: prod
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.tag-suffix }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.tag-suffix }}
