name: "Marketing: capture screenshots & videos"

# Manually run the marketing screenshot/video pipeline end-to-end against a
# chosen branch, verify every capture it claims to have produced is a real,
# non-empty file (npm run marketing:check), and upload the result as a run
# artifact. On the default branch (master) the fresh visuals are also pushed
# to ChurchCRM/ChurchCRM.io, which hosts the screenshots and videos, and a PR
# is opened there with only the files that visibly changed. Nothing is
# committed to this repo.
#
# Stages (each its own job, so the Actions UI shows exactly which locale or
# stage is running or failed):
#   1. capture   — one job per locale, in parallel. Each installs the
#                  toolchain, starts its own CI docker stack, runs the setup
#                  wizard + demo import, and captures that locale's
#                  screenshots (scripts/capture-all-locales.sh <locale>).
#                  Locales can't share one instance in parallel: the locale
#                  is a DB setting on the shared admin user. Only 'en' also
#                  records and publishes the videos.
#   2. merge     — combines every locale's output, re-runs the capture check
#                  and regenerates the manifest.
#   3. publish   — only on the default branch: copies new and visibly changed
#                  visuals into ChurchCRM.io and opens a PR there (needs
#                  DOCS_RELEASE_TOKEN with contents and pull-requests write
#                  on that repo).
#
# Trigger this from the Actions tab: pick the branch, click "Run workflow".

on:
  workflow_dispatch:

concurrency:
  group: marketing-capture-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: "1 — Capture (${{ matrix.locale }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        locale: [en, es, pt, zh, fr, ru, de, ar]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mysqli, gd, zip, gettext, iconv, mbstring, xml, curl, fileinfo, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          cd src
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: ./.github/actions/cache
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Playwright browsers
        uses: ./.github/actions/cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npm run marketing:install

      - name: Capture ${{ matrix.locale }}
        run: ./scripts/capture-all-locales.sh "${{ matrix.locale }}"

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-new-system logs --no-color || true

      - name: Tear down Docker stack
        if: always()
        run: npm run docker:ci:new-system:down

      - name: Upload ${{ matrix.locale }} captures
        uses: ./.github/actions/upload-artifact
        with:
          name: marketing-locale-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            playwright/artifacts/screenshots
            playwright/artifacts/metadata
            playwright/artifacts/videos
          retention-days: 1
          if-no-files-found: error

      - name: Upload failure output
        if: failure()
        uses: ./.github/actions/upload-artifact
        with:
          name: marketing-failure-${{ matrix.locale }}-${{ github.run_id }}
          path: playwright/.playwright-output/
          # Dot-directory: actions/upload-artifact drops it unless told otherwise.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  merge:
    name: "2 — Merge & check"
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version-file: '.nvmrc'

      - name: Clear committed artifacts
        run: rm -rf playwright/artifacts/

      - name: Download every locale's captures
        uses: ./.github/actions/download-artifact
        with:
          pattern: marketing-locale-*-${{ github.run_id }}
          path: playwright/artifacts
          merge-multiple: true

      - name: Validate captures
        run: npm run marketing:check

      - name: Regenerate manifest.json
        run: npm run marketing:manifest

      - name: Upload marketing visuals
        uses: ./.github/actions/upload-artifact
        with:
          name: marketing-visuals-${{ github.run_id }}
          path: playwright/artifacts/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: "3 — Open website PR"
    needs: merge
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChurchCRM/ChurchCRM.io
          token: ${{ secrets.DOCS_RELEASE_TOKEN }}

      - name: Download the merged visuals
        uses: ./.github/actions/download-artifact
        with:
          name: marketing-visuals-${{ github.run_id }}
          path: ${{ runner.temp }}/visuals

      # Re-captures are never byte-identical (anti-aliasing, PNG encoding, video
      # encoding), so copying everything would put every file in the PR. Copy a
      # file only when it is new or the picture visibly changed (more than
      # 200 pixels differ after a 2% fuzz). Videos are only added, never replaced.
      - name: Copy new and visibly changed visuals into the website
        env:
          VISUALS: ${{ runner.temp }}/visuals
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends imagemagick > /dev/null
          copy_changed() {
            local src="$1" dst="$2" f target px
            while IFS= read -r -d '' f; do
              target="$dst/${f#"$src"/}"
              if [ -f "$target" ]; then
                [[ "$f" == *.png ]] || continue
                px="$(compare -metric AE -fuzz 2% "$f" "$target" null: 2>&1 || true)"
                px="${px%% *}"
                if [[ "$px" =~ ^[0-9]+$ ]] && [ "$px" -le 200 ]; then continue; fi
              fi
              mkdir -p "$(dirname "$target")"
              cp "$f" "$target"
            done < <(find "$src" -type f -print0)
          }
          copy_changed "$VISUALS/screenshots" static/images/screenshots
          copy_changed "$VISUALS/videos" static/images/videos

          # commit/timestamp/sizeBytes change every run; publish the manifest
          # only when captures are added, removed or retitled.
          stable='[.[] | del(.commit, .timestamp, .sizeBytes)]'
          if ! diff <(jq -S "$stable" data/manifest.json) <(jq -S "$stable" "$VISUALS/manifest.json") > /dev/null; then
            cp "$VISUALS/manifest.json" data/manifest.json
          fi

      - name: Create Pull Request with updated visuals
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.DOCS_RELEASE_TOKEN }}
          branch: marketing/update-visuals
          delete-branch: true
          add-paths: |
            static/images/screenshots
            static/images/videos
            data/manifest.json
          commit-message: |
            chore: update product screenshots and videos

            Captured by ChurchCRM/CRM marketing-capture-assets run
            ${{ github.run_id }}.
          title: "chore: update product screenshots and videos"
          body: |
            New and visibly changed screenshots and videos from the
            ChurchCRM/CRM marketing pipeline.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
