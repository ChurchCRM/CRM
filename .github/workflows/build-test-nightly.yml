name: Build, Test and Package (Nightly)

# Consolidated nightly workflow covering all test types that are too heavy or
# slow to run on every push/PR. This workflow supersedes upgrade-tests.yml
# (which is deleted). The on-release trigger for upgrade tests is now
# included in this file's on: block below. It also runs on every push to a
# release/** branch, since build-test-package.yml no longer runs the full
# locale sweep for those pushes (PR #10103) — this is the automatic
# full-locale gate for release-branch commits.
#
# What this workflow covers
# ─────────────────────────
# Stage 0 – changes
#   • A scheduled run asks scripts/nightly-needed.js whether anything the suite tests or ships
#     changed since the last successful run. If not, the run ends green without the test jobs.
#     Manual, release and release-branch runs always run.
#
# Stage 1 – build
#   • Builds the PHP 8.4 and 8.5 images. The app suite below uses 8.5.
#     The pull-request workflow tests the app on 8.4. Nightly uses 8.4
#     only for the upgrade jobs.
#
# Stage 2a – PHP 8.5 full test suite (all jobs run in parallel)
#   • test-root:             api (2 shards), admin-ui (3), ui (4) — root install path
#   • test-subdir:           api (2 shards), admin-ui (3), ui (4) — subdirectory path
#   • test-new-system:       setup-wizard (root path)
#   • test-new-system-subdir setup-wizard (subdir path)
#   • test-locale-root:      full locale sweep (root)
#   • test-locale-subdir:    full locale sweep (subdir)
#
# Stage 2b – Upgrade tests, one job per database engine
#   • upgrade-mysql:    MySQL 8.4 LTS (the supported floor) × PHP 8.4 and 8.5 × ChurchInfo 1.3.1 and ChurchCRM 6.0.0,
#                       plus mysql:lts (newest LTS) and mysql:latest (early warning, may fail) on PHP 8.4 × ChurchInfo 1.3.1
#   • upgrade-mariadb:  MariaDB 10.11 LTS (the supported floor) × PHP 8.4 and 8.5 × ChurchInfo 1.3.1 and ChurchCRM 6.0.0
#
# Stage 3 – Summary
#   • nightly-summary: always() — job results plus Cypress artifact names
#
# Concurrency: a new run cancels any in-progress nightly run (safe for
# scheduled/dispatch/release-publish triggers — you always want the latest
# code). Release-branch pushes use their own concurrency group below so a
# rapid string of pushes to release/** doesn't get cancelled mid-sweep by the
# unrelated nightly schedule.

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  actions: read

on:
  schedule:
    # Three slots a day. A slot with no testable change since the last green run costs one short job.
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:
  release:
    types: [published]
  push:
    # Release branches get the exhaustive suite (incl. full locale sweep) on
    # every push, not just nightly/dispatch/publish — build-test-package.yml
    # no longer runs a full-locale job on these pushes (PR #10103), so this is
    # the only automatic full-locale validation a release/** commit gets
    # before it can be selected for release-publish.yml.
    branches:
      - 'release/**'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 0 — Changes
  # A scheduled run skips the suite when nothing it tests changed since the last green run.
  # ═══════════════════════════════════════════════════════════════════════════
  changes:
    name: Changes since the last green run
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Decide
      id: decide
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        SHA: ${{ github.sha }}
        BRANCH: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: node scripts/nightly-needed.js

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1 — Build
  # Build the app and the PHP 8.4 and 8.5 images; upload them as one artifact.
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: PHP 8.4 and 8.5 images
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 40
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/checkout-node-npm

    - uses: ./.github/actions/composer-install

    - name: Build app
      run: npm run package

    - name: Validate PHP syntax
      run: npm run build:php:validate:all

    - name: Build Docker images (PHP 8.4 and 8.5)
      run: |
        for version in 8.4 8.5; do
          echo "Building Docker image for PHP $version..."
          docker build --target test \
            --build-arg PHP_VERSION=$version \
            -t churchcrm/crm:php${version}-test \
            -f docker/Dockerfile.churchcrm-apache-php8 docker/
          docker save churchcrm/crm:php${version}-test | gzip > temp/docker-image-${version}.tar.gz
          echo "Saved: $(du -h temp/docker-image-${version}.tar.gz | cut -f1)"
        done

    - name: Upload build artifact
      uses: ./.github/actions/upload-artifact
      with:
        name: nightly-build-${{ github.run_id }}
        path: |
          src/
          temp/
          !src/logs
        retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2a — PHP 8.5 full test suite
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Root-path tests: api (2), admin-ui (3) and ui (4 shards) ──────────────────
  test-root:
    name: PHP 8.5 / root / ${{ matrix.test-type.name }}
    needs: build
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test-type:
          - name: api-shard-0
            spec: "cypress/e2e/api/**/*.spec.js"
            config: "cypress/configs/docker-api.config.ts"
            split-index: "0"
            shard-total: 2
        include:
          # api, admin-ui and ui specs sharded by recorded duration (cypress/split-timings.json)
          # split-index values are strings to avoid JS falsy coercion of 0
          - test-type: { name: api-shard-1, config: "cypress/configs/docker-api.config.ts", spec: "cypress/e2e/api/**/*.spec.js" }
            split-index: "1"
            shard-total: 2
          - test-type: { name: admin-ui-shard-0, config: "cypress/configs/docker-admin.config.ts", spec: "cypress/e2e/ui-admin/**/*.spec.js" }
            split-index: "0"
            shard-total: 3
          - test-type: { name: admin-ui-shard-1, config: "cypress/configs/docker-admin.config.ts", spec: "cypress/e2e/ui-admin/**/*.spec.js" }
            split-index: "1"
            shard-total: 3
          - test-type: { name: admin-ui-shard-2, config: "cypress/configs/docker-admin.config.ts", spec: "cypress/e2e/ui-admin/**/*.spec.js" }
            split-index: "2"
            shard-total: 3
          - test-type: { name: ui-shard-0, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "0"
            shard-total: 4
          - test-type: { name: ui-shard-1, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "1"
            shard-total: 4
          - test-type: { name: ui-shard-2, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "2"
            shard-total: 4
          - test-type: { name: ui-shard-3, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "3"
            shard-total: 4
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/checkout-node-npm
      with:
        cache-cypress: 'true'

    - name: Download build artifact
      uses: ./.github/actions/download-artifact
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image (PHP 8.5)
      run: |
        docker load < temp/docker-image-8.5.tar.gz
        docker tag churchcrm/crm:php8.5-test churchcrm/crm:php8-debian

    - name: Start Docker (root path)
      run: |
        cp docker/Config.root.php src/Include/Config.php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root up -d

    - name: Wait for server (root path)
      run: |
        max_attempts=12
        attempt=1
        until curl -sf http://127.0.0.1/api/public/echo; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run Cypress ${{ matrix.test-type.name }} tests (root, PHP 8.5)
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: ${{ matrix.test-type.config }}
        spec: ${{ matrix.test-type.spec }}
        test-name: ${{ matrix.test-type.name }}
        php-version: '8.5'
        deployment: root
        shard-total: ${{ matrix.test-type.shard-total || matrix.shard-total || '' }}
        shard-index: ${{ matrix.test-type.split-index || matrix.split-index || '0' }}
        docker-compose-profile: ci-root
        extra-env: |
          ROW_GUARD_DB_PORT=3306
          ROW_GUARD_REQUIRED=1

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:root:down

  # ── Subdirectory-path tests: api (2), admin-ui (3) and ui (4 shards) ─────────────
  test-subdir:
    name: PHP 8.5 / subdir / ${{ matrix.test-type.name }}
    needs: build
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test-type:
          - name: api-shard-0
            spec: "cypress/e2e/api/**/*.spec.js"
            config: "cypress/configs/docker-api.config.ts"
            split-index: "0"
            shard-total: 2
        include:
          # api, admin-ui and ui specs sharded by recorded duration (cypress/split-timings.json)
          # split-index values are strings to avoid JS falsy coercion of 0
          - test-type: { name: api-shard-1, config: "cypress/configs/docker-api.config.ts", spec: "cypress/e2e/api/**/*.spec.js" }
            split-index: "1"
            shard-total: 2
          - test-type: { name: admin-ui-shard-0, config: "cypress/configs/docker-admin.config.ts", spec: "cypress/e2e/ui-admin/**/*.spec.js" }
            split-index: "0"
            shard-total: 3
          - test-type: { name: admin-ui-shard-1, config: "cypress/configs/docker-admin.config.ts", spec: "cypress/e2e/ui-admin/**/*.spec.js" }
            split-index: "1"
            shard-total: 3
          - test-type: { name: admin-ui-shard-2, config: "cypress/configs/docker-admin.config.ts", spec: "cypress/e2e/ui-admin/**/*.spec.js" }
            split-index: "2"
            shard-total: 3
          - test-type: { name: ui-shard-0, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "0"
            shard-total: 4
          - test-type: { name: ui-shard-1, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "1"
            shard-total: 4
          - test-type: { name: ui-shard-2, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "2"
            shard-total: 4
          - test-type: { name: ui-shard-3, config: "cypress/configs/docker-ui.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "3"
            shard-total: 4
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/checkout-node-npm
      with:
        cache-cypress: 'true'

    - name: Download build artifact
      uses: ./.github/actions/download-artifact
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image (PHP 8.5)
      run: |
        docker load < temp/docker-image-8.5.tar.gz
        docker tag churchcrm/crm:php8.5-test churchcrm/crm:php8-debian

    - name: Start Docker (subdirectory path)
      run: |
        cp docker/Config.parallel.subdir.php src/Include/Config.php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir up -d

    - name: Wait for server (subdirectory path)
      run: |
        max_attempts=12
        attempt=1
        until curl -sf http://127.0.0.1:8080/churchcrm/api/public/echo; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run Cypress ${{ matrix.test-type.name }} tests (subdir, PHP 8.5)
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: ${{ matrix.test-type.config }}
        spec: ${{ matrix.test-type.spec }}
        test-name: ${{ matrix.test-type.name }}
        php-version: '8.5'
        deployment: subdir
        shard-total: ${{ matrix.test-type.shard-total || matrix.shard-total || '' }}
        shard-index: ${{ matrix.test-type.split-index || matrix.split-index || '0' }}
        base-url: http://127.0.0.1:8080/churchcrm/
        docker-compose-profile: ci-subdir
        extra-env: |
          DATABASE_PORT=3307
          ROW_GUARD_DB_PORT=3307
          ROW_GUARD_REQUIRED=1

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:subdir:down

  # ── New system setup wizard — root path (PHP 8.5) ────────────────────────
  test-new-system:
    name: PHP 8.5 / setup / root
    needs: build
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/checkout-node-npm

    - name: Download build artifact
      uses: ./.github/actions/download-artifact
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image (PHP 8.5)
      run: |
        docker load < temp/docker-image-8.5.tar.gz
        docker tag churchcrm/crm:php8.5-test churchcrm/crm:php8-debian

    - name: Generate file signatures
      run: node scripts/generate-signatures-node.js

    - name: Remove Config.php for fresh install test
      run: rm -f src/Include/Config.php

    - name: Start Docker (new system)
      run: docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-new-system up -d

    - name: Wait for server (new system)
      run: |
        max_attempts=12
        attempt=1
        until curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/ | grep -q "302\|200"; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-new-system ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-new-system logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run Cypress tests (setup wizard, PHP 8.5)
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: cypress/configs/new-system.config.ts
        spec: cypress/e2e/new-system/**/*.spec.js
        test-name: setup
        php-version: '8.5'
        deployment: new-system
        shard-total: '1'
        shard-index: '0'
        docker-compose-profile: ci-new-system

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:new-system:down

  # ── New system setup wizard — subdirectory path (PHP 8.5) ────────────────
  test-new-system-subdir:
    name: PHP 8.5 / setup / subdir
    needs: build
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/checkout-node-npm

    - name: Download build artifact
      uses: ./.github/actions/download-artifact
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image (PHP 8.5)
      run: |
        docker load < temp/docker-image-8.5.tar.gz
        docker tag churchcrm/crm:php8.5-test churchcrm/crm:php8-debian

    - name: Generate file signatures
      run: node scripts/generate-signatures-node.js

    - name: Remove Config.php for fresh install test
      run: rm -f src/Include/Config.php

    - name: Start Docker (new system subdirectory)
      run: npm run docker:ci:new-system:subdir:start

    - name: Wait for server (new system subdirectory)
      run: |
        max_attempts=12
        attempt=1
        until curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/churchcrm/ | grep -q "302\|200"; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml -f docker/docker-compose.subdir.yaml --profile ci-new-system ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml -f docker/docker-compose.subdir.yaml --profile ci-new-system logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run Cypress tests (setup wizard subdir, PHP 8.5)
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: cypress/configs/new-system.config.ts
        spec: cypress/e2e/new-system/**/*.spec.js
        test-name: setup
        php-version: '8.5'
        deployment: new-system-subdir
        shard-total: '1'
        shard-index: '0'
        base-url: http://127.0.0.1:8081/churchcrm/
        docker-compose-profile: ci-new-system
        docker-compose-files: 'docker/docker-compose.yaml,docker/docker-compose.parallel.yaml,docker/docker-compose.subdir.yaml'

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:new-system:subdir:down

  # ── Full locale sweep — root path (PHP 8.5) ─────────────────────────────
  test-locale-root:
    name: PHP 8.5 / locale / root
    needs: build
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: ./.github/actions/setup-node
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Cache Cypress binary
      uses: ./.github/actions/cache
      with:
        path: ~/.cache/Cypress
        key: ${{ runner.os }}-cypress-${{ hashFiles('**/package-lock.json') }}
        restore-keys: ${{ runner.os }}-cypress-

    - name: Install npm dependencies
      run: npm ci

    - name: Download build artifact
      uses: ./.github/actions/download-artifact
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image (PHP 8.5)
      run: |
        docker load < temp/docker-image-8.5.tar.gz
        docker tag churchcrm/crm:php8.5-test churchcrm/crm:php8-debian

    - name: Start Docker (root path)
      run: |
        cp docker/Config.root.php src/Include/Config.php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root up -d

    - name: Wait for server (root path)
      run: |
        max_attempts=12
        attempt=1
        until curl -sf http://127.0.0.1/api/public/echo; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run full locale sweep (root, PHP 8.5)
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: cypress/configs/locale.config.ts
        spec: cypress/e2e/locale/**/*.spec.ts
        test-name: locale
        php-version: '8.5'
        deployment: root
        cypress-env: LOCALE_TIER=full
        docker-compose-profile: ci-root

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:root:down

  # ── Full locale sweep — subdirectory path (PHP 8.5) ─────────────────────
  test-locale-subdir:
    name: PHP 8.5 / locale / subdir
    needs: build
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: ./.github/actions/setup-node
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Cache Cypress binary
      uses: ./.github/actions/cache
      with:
        path: ~/.cache/Cypress
        key: ${{ runner.os }}-cypress-${{ hashFiles('**/package-lock.json') }}
        restore-keys: ${{ runner.os }}-cypress-

    - name: Install npm dependencies
      run: npm ci

    - name: Download build artifact
      uses: ./.github/actions/download-artifact
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image (PHP 8.5)
      run: |
        docker load < temp/docker-image-8.5.tar.gz
        docker tag churchcrm/crm:php8.5-test churchcrm/crm:php8-debian

    - name: Start Docker (subdirectory path)
      run: |
        cp docker/Config.parallel.subdir.php src/Include/Config.php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir up -d

    - name: Wait for server (subdirectory path)
      run: |
        max_attempts=12
        attempt=1
        until curl -sf http://127.0.0.1:8080/churchcrm/api/public/echo; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run full locale sweep (subdir, PHP 8.5)
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: cypress/configs/locale.config.ts
        spec: cypress/e2e/locale/**/*.spec.ts
        test-name: locale
        php-version: '8.5'
        deployment: subdir
        base-url: http://127.0.0.1:8080/churchcrm/
        cypress-env: LOCALE_TIER=full
        docker-compose-profile: ci-subdir

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:subdir:down

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2b — Upgrade tests
  # Engine is the job. PHP version and starting schema are the matrix.
  # The app suite above stays on PHP 8.5.
  # ═══════════════════════════════════════════════════════════════════════════
  upgrade-mysql:
    needs: build
    name: MySQL upgrade / ${{ matrix.db_image }} / PHP ${{ matrix.php }} / ${{ matrix.schema.label }}
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      MYSQL_IMAGE: ${{ matrix.db_image }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        db_image: ["mysql:8.4"]
        schema:
          - label: ChurchInfo 1.3.1
            slug: churchinfo-1.3.1
            sql_file: cypress/fixtures/upgrade/churchinfo-1.3.1.sql
            admin_user: Admin
            admin_pass: churchinfoadmin
            force_password_change: 'true'
          - label: ChurchCRM 6.0.0
            slug: churchcrm-6.0.0
            sql_file: cypress/fixtures/upgrade/churchcrm-6.0.0.sql
            admin_user: Admin
            admin_pass: changeme
            force_password_change: ''
        include:
          # Newest LTS (floats to the next one), on the oldest schema, to catch breakage before hosts move to it.
          - php: "8.4"
            db_image: mysql:lts
            schema:
              label: ChurchInfo 1.3.1
              slug: churchinfo-1.3.1
              sql_file: cypress/fixtures/upgrade/churchinfo-1.3.1.sql
              admin_user: Admin
              admin_pass: churchinfoadmin
              force_password_change: 'true'
          # Newest release, any track. Early warning only: a failure here does not fail the nightly.
          - php: "8.4"
            db_image: mysql:latest
            experimental: true
            schema:
              label: ChurchInfo 1.3.1
              slug: churchinfo-1.3.1
              sql_file: cypress/fixtures/upgrade/churchinfo-1.3.1.sql
              admin_user: Admin
              admin_pass: churchinfoadmin
              force_password_change: 'true'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: ./.github/actions/setup-node
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Download build artifact
      uses: ./.github/actions/download-artifact
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image
      run: |
        docker load < temp/docker-image-${{ matrix.php }}.tar.gz
        docker tag churchcrm/crm:php${{ matrix.php }}-test churchcrm/crm:php8-debian

    - name: Generate file signatures
      run: node scripts/generate-signatures-node.js

    - name: Remove Config.php for fresh install
      run: rm -f src/Include/Config.php

    - name: Start Docker (MySQL)
      run: docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml -f docker/docker-compose.mysql.yaml --profile ci-new-system up -d

    - name: Wait for server
      run: |
        max_attempts=12
        attempt=1
        until curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/ | grep -q "302\|200"; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml -f docker/docker-compose.mysql.yaml --profile ci-new-system ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml -f docker/docker-compose.mysql.yaml --profile ci-new-system logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run Cypress upgrade test (MySQL, ${{ matrix.schema.label }})
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: cypress/configs/upgrade.config.ts
        spec: cypress/e2e/upgrade/**/*.spec.js
        test-name: ${{ matrix.schema.slug }}
        php-version: ${{ matrix.php }}
        deployment: mysql
        docker-compose-profile: ci-new-system
        docker-compose-files: 'docker/docker-compose.yaml,docker/docker-compose.parallel.yaml,docker/docker-compose.mysql.yaml'
        extra-env: |
          CYPRESS_UPGRADE_SQL_FILE=${{ matrix.schema.sql_file }}
          CYPRESS_UPGRADE_ADMIN_USER=${{ matrix.schema.admin_user }}
          CYPRESS_UPGRADE_ADMIN_PASS=${{ matrix.schema.admin_pass }}
          CYPRESS_UPGRADE_FORCE_PASSWORD_CHANGE=${{ matrix.schema.force_password_change }}

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:new-system:down

  upgrade-mariadb:
    needs: build
    name: MariaDB upgrade / PHP ${{ matrix.php }} / ${{ matrix.schema.label }}
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        schema:
          - label: ChurchInfo 1.3.1
            slug: churchinfo-1.3.1
            sql_file: cypress/fixtures/upgrade/churchinfo-1.3.1.sql
            admin_user: Admin
            admin_pass: churchinfoadmin
            force_password_change: 'true'
          - label: ChurchCRM 6.0.0
            slug: churchcrm-6.0.0
            sql_file: cypress/fixtures/upgrade/churchcrm-6.0.0.sql
            admin_user: Admin
            admin_pass: changeme
            force_password_change: ''
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: ./.github/actions/setup-node
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Download build artifact
      uses: ./.github/actions/download-artifact
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image
      run: |
        docker load < temp/docker-image-${{ matrix.php }}.tar.gz
        docker tag churchcrm/crm:php${{ matrix.php }}-test churchcrm/crm:php8-debian

    - name: Generate file signatures
      run: node scripts/generate-signatures-node.js

    - name: Remove Config.php for fresh install
      run: rm -f src/Include/Config.php

    - name: Start Docker (MariaDB)
      run: docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-new-system up -d

    - name: Wait for server
      run: |
        max_attempts=12
        attempt=1
        until curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/ | grep -q "302\|200"; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-new-system ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-new-system logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run Cypress upgrade test (MariaDB, ${{ matrix.schema.label }})
      uses: ./.github/actions/run-cypress-tests
      with:
        config-file: cypress/configs/upgrade.config.ts
        spec: cypress/e2e/upgrade/**/*.spec.js
        test-name: ${{ matrix.schema.slug }}
        php-version: ${{ matrix.php }}
        deployment: mariadb
        docker-compose-profile: ci-new-system
        extra-env: |
          CYPRESS_UPGRADE_SQL_FILE=${{ matrix.schema.sql_file }}
          CYPRESS_UPGRADE_ADMIN_USER=${{ matrix.schema.admin_user }}
          CYPRESS_UPGRADE_ADMIN_PASS=${{ matrix.schema.admin_pass }}
          CYPRESS_UPGRADE_FORCE_PASSWORD_CHANGE=${{ matrix.schema.force_password_change }}

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:new-system:down

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3 — Nightly summary
  # Runs after all test jobs (always) and writes the job and artifact overview.
  # ═══════════════════════════════════════════════════════════════════════════
  nightly-summary:
    needs:
      - changes
      - build
      - test-root
      - test-subdir
      - test-new-system
      - test-new-system-subdir
      - test-locale-root
      - test-locale-subdir
      - upgrade-mysql
      - upgrade-mariadb
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Test overview
      uses: ./.github/actions/test-run-summary

    - name: Fail the run when a group did not pass
      env:
        CHANGES_REASON: ${{ needs.changes.outputs.reason }}
      run: |
        if [[ "${{ needs.changes.outputs.run }}" == "false" ]]; then
          echo "**Overall: ✅ NOTHING TO TEST**" >> $GITHUB_STEP_SUMMARY
          echo "${CHANGES_REASON}. The last green run still covers this commit." >> $GITHUB_STEP_SUMMARY
          exit 0
        fi
        # Non-success includes skipped and cancelled, such as when build fails.
        if [[ "${{ needs.build.result }}" != "success" || \
              "${{ needs.test-root.result }}" != "success" || \
              "${{ needs.test-subdir.result }}" != "success" || \
              "${{ needs.test-new-system.result }}" != "success" || \
              "${{ needs.test-new-system-subdir.result }}" != "success" || \
              "${{ needs.test-locale-root.result }}" != "success" || \
              "${{ needs.test-locale-subdir.result }}" != "success" || \
              "${{ needs.upgrade-mysql.result }}" != "success" || \
              "${{ needs.upgrade-mariadb.result }}" != "success" ]]; then
          echo "**Overall: ❌ FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "One or more test groups failed, were skipped, or were cancelled — check individual job logs above." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "**Overall: ✅ PASSED**" >> $GITHUB_STEP_SUMMARY
        fi
