name: "Security: CodeQL"

on:
  push:
    branches: [master, develop]
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sql'
  pull_request:
    branches: [master]
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sql'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: 'CodeQL (JS/TS)'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: 'true'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.0
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.0
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.0
        with:
          category: "/language:javascript-typescript"

  semgrep-analysis:
    name: 'Semgrep (PHP/JS/Config)'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/php \
            --sarif \
            --output semgrep.sarif \
            --error
        continue-on-error: true
      - name: Upload Semgrep results to GitHub Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          wait-for-processing: true
