name: 'Security Analysis'

on:
  push:
    branches: [master, develop]
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sql'
  pull_request:
    branches: [master]
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sql'
  schedule:
    # Run weekly on Mondays at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # CodeQL: Semantic analysis for JavaScript/TypeScript
  # Understands data flow, tracks tainted input through function calls
  codeql-analysis:
    name: 'CodeQL (JS/TS)'
    runs-on: ubuntu-latest
    env:
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: 'true'
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: javascript-typescript
          # Use security-extended for more comprehensive scanning
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:javascript-typescript"

  # Semgrep: Pattern-based scanning for PHP, JavaScript, and config files
  # Detects security vulnerabilities and code quality issues
  semgrep-analysis:
    name: 'Semgrep (PHP/JS/Config)'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/php \
            --sarif \
            --output semgrep.sarif \
            --error
        continue-on-error: true

      - name: Upload Semgrep results to GitHub Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          wait-for-processing: true
