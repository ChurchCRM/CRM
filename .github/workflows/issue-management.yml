name: "Issues: hygiene"

concurrency:
  group: ${{ github.event_name == 'issues' && format('issue-{0}', github.event.issue.number) || github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'issues' }}

# ==============================================================================
# PURPOSE: Deterministic issue hygiene — the parts that must fire even when
# the community agent is down, rate-limited, or out of budget.
#
#   1. Security guard on newly opened issues
#   2. Normalize bug issue types when "bug" label is applied
#   3. Mark stale inactive issues
#   4. Review closed stale issues that have no linked PR
# ==============================================================================

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: false
        type: choice
        options:
          - 'triage-only'
          - 'review-stale-only'
          - 'all'
        default: 'all'
      dry_run:
        description: 'Dry run - only log what would be done'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  security-guard:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    name: Security guard on new issues
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Redirect vulnerability reports to private disclosure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.payload.issue || {};
            const login = (issue.user && issue.user.login) || '';
            if ((issue.user && issue.user.type) === 'Bot' || /\[bot\]$/.test(login)) {
              console.log(`Author ${login} is a bot — skipping.`);
              return;
            }
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association)) {
              console.log(`Author ${login} is ${issue.author_association} — maintainers handle their own security issues.`);
              return;
            }

            const text = `${issue.title || ''}\n${issue.body || ''}`;
            const hasCVE = /cve-\d{4}-\d+/i.test(text) || /ghsa-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}/i.test(text);
            const looksSecurity = /\b(vulnerabilit(y|ies)|exploit|xss|cross-site scripting|sql injection|sqli|csrf|remote code execution|rce|privilege escalation|authentication bypass|path traversal)\b/i.test(text);
            const ref = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };

            if (hasCVE) {
              const body = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, '.github/issue-comments/security.md'), 'utf8');
              await github.rest.issues.createComment({ ...ref, body });
              await github.rest.issues.addLabels({ ...ref, labels: ['Security', 'security-delete-required'] });
              await github.rest.issues.update({ ...ref, state: 'closed', state_reason: 'not_planned' });
              console.log('CVE/GHSA reference: template posted, labelled, closed.');
              return;
            }
            if (looksSecurity) {
              await github.rest.issues.addLabels({ ...ref, labels: ['Security'] });
              console.log('Vulnerability-shaped wording: labelled security.');
              return;
            }
            console.log('Nothing security-shaped.');

  ensure-bug-type:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'bug'
    name: Normalize bug issue type
    timeout-minutes: 5
    runs-on: ubuntu-24.04

    steps:
      - name: Ensure Issue Type is "Bug"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issue = context.payload.issue || {};
            if (!issue.node_id) {
              console.log('No issue payload — skip');
              return;
            }
            const currentType = issue.type?.name || null;
            if (currentType === 'Bug') {
              console.log('Issue type is already Bug');
              return;
            }
            try {
              const result = await github.graphql(`
                mutation($issueId:ID!, $issueType:IssueType!) {
                  updateIssue(input: {id: $issueId, issueType: $issueType}) {
                    issue { type }
                  }
                }
              `, {
                issueId: issue.node_id,
                issueType: 'BUG'
              });
              console.log('Updated issue type to Bug:', result);
            } catch (e) {
              console.log('Could not update issue type:', e.message);
            }

  mark-stale:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.operation == 'all' || inputs.operation == 'review-stale-only'))
    name: Mark stale inactive issues
    timeout-minutes: 5
    runs-on: ubuntu-24.04

    steps:
      - name: Mark stale issues
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # A reply keeps it open. Silence means we close it. The wording stays welcoming on purpose.
          stale-issue-message: |
            Thanks for taking the time to report this. Reports like this are how the ChurchCRM community keeps moving.

            We have not heard anything here for 45 days, and we need a reply from you to keep going. Please comment if this is still happening, if you are working on it, or if you can help someone else pick it up. A short comment is enough, and it keeps the issue open.

            If you would rather talk it through than write it all here, come to Discord: https://discord.gg/tuWyFzj3Nj

            If we do not hear back, we will close it in 14 days. No reply means this is no longer a concern we can act on. You are welcome to reopen it any time with a new comment.
          stale-pr-message: |
            Thanks for putting this pull request together. Contributor work is how ChurchCRM moves, and we want yours.

            We have not heard anything here for 45 days. If you are still working on it, or you want a review, please reply and we will keep it open. If you are stuck, say so and we will help.

            If you would rather talk it through than write it all here, come to Discord: https://discord.gg/tuWyFzj3Nj

            If we do not hear back, we will close it in 14 days so the queue stays honest for the rest of the community. You are welcome to reopen it any time and we will pick it back up.
          days-before-stale: 45
          days-before-close: 14
          days-before-pr-close: 14
          # Cap each Monday so a backlog does not get a wall of comments in one night.
          operations-per-run: 30
          stale-issue-label: Stale
          stale-pr-label: Stale
          # Kept open on purpose: security, work we already accepted, parent epics, and beginner tasks.
          # Everything else, including enhancements, goes stale when the reporter goes quiet.
          exempt-issue-labels: 'Security,security-delete-required,accepted,Epic,good first issue'
          exempt-pr-labels: 'Security,security-delete-required,dependencies'
          remove-stale-when-updated: true
          remove-stale-when-commented: true

  review-closed-issues:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.operation == 'review-stale-only' || inputs.operation == 'all'))
    name: Review closed stale issues without PRs
    timeout-minutes: 10
    runs-on: ubuntu-24.04

    steps:
      - name: Review closed stale issues without PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const dryRun = ${{ inputs.dry_run || false }};
            console.log('Review closed stale issues (issues only, not PRs)');
            console.log('Dry run:', dryRun);

            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:closed label:stale`;
            const issues = await github.paginate(
              github.rest.search.issuesAndPullRequests,
              { q, per_page: 100 }
            );
            console.log(`Closed issues with stale: ${issues.length}`);

            const needsReview = [];
            for (const issue of issues) {
              const labels = (issue.labels || []).map((l) => (typeof l === 'string' ? l : l.name));
              if (labels.includes('needs-manual-review')) {
                continue;
              }
              const timeline = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, per_page: 100 }
              );
              const linkedPRs = timeline.filter((event) =>
                event.event === 'cross-referenced' &&
                event.source &&
                event.source.issue &&
                event.source.issue.pull_request
              );
              if (linkedPRs.length === 0) {
                needsReview.push(issue);
              }
            }

            console.log(`Closed stale issues with no linked PR: ${needsReview.length}`);

            let tagged = 0;
            for (const issue of needsReview) {
              if (dryRun) {
                console.log(`[DRY RUN] would tag #${issue.number} ${issue.title}`);
                continue;
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-manual-review'],
              });
              tagged += 1;
              console.log(`Tagged #${issue.number}: ${issue.title}`);
            }

            console.log('Counts');
            console.log(`  closed+stale issues: ${issues.length}`);
            console.log(`  no linked PR: ${needsReview.length}`);
            console.log(`  tagged: ${tagged}`);
