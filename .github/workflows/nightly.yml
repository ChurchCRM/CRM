        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Download build artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image (PHP 8.5)
      run: |
        docker load < temp/docker-image-8.5.tar.gz
        docker tag churchcrm/crm:php8.5-test churchcrm/crm:php8-debian

    - name: Generate file signatures
      run: node scripts/generate-signatures-node.js

    - name: Remove Config.php for fresh install test
      run: rm -f src/Include/Config.php

    - name: Start Docker (new system subdirectory)
      run: npm run docker:ci:new-system:subdir:start

    - name: Wait for server (new system subdirectory)
