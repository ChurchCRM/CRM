    - name: Load Docker image (PHP 8.5)
      run: |
        docker load < temp/docker-image-8.5.tar.gz
        docker tag churchcrm/crm:php8.5-test churchcrm/crm:php8-debian

    - name: Start Docker (subdirectory path)
      run: |
        cp docker/Config.parallel.subdir.php src/Include/Config.php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir up -d

    - name: Wait for server (subdirectory path)
      run: |
        max_attempts=12
        attempt=1
        until curl -sf http://127.0.0.1:8080/churchcrm/api/public/echo; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run Cypress ${{ matrix.test-type.name }} tests (subdir, PHP 8.5)
      run: npx cypress run --config-file "${{ matrix.test-type.config }}" --spec "${{ matrix.test-type.spec }}" --headless --browser electron --reporter junit --reporter-options mochaFile=cypress/reports/junit-php8.5-subdir-${{ matrix.test-type.name }}-[suiteName]-[hash].xml
      env:
        CYPRESS_BASE_URL: http://127.0.0.1:8080/churchcrm/
        SPLIT: ${{ matrix.shard-total || '' }}
        SPLIT_INDEX: ${{ matrix.split-index }}

    - name: Collect Docker logs on failure
      if: failure()
      run: |
        mkdir -p cypress/logs/docker cypress/logs/php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir logs > cypress/logs/docker/docker-compose-php8.5-subdir-${{ matrix.test-type.name }}.log 2>&1 || true
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir ps -a >> cypress/logs/docker/docker-compose-php8.5-subdir-${{ matrix.test-type.name }}.log 2>&1 || true
        [ -d src/logs ] && cp -r src/logs cypress/logs/php/ || true

    - name: Upload debug artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: cypress-artifacts-php8.5-subdir-${{ matrix.test-type.name }}-${{ github.run_id }}
        path: |
          cypress/logs
          cypress/screenshots
          cypress/videos
        retention-days: 15
        if-no-files-found: ignore

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: 'PHP 8.5: Subdirectory (${{ matrix.test-type.name }})'
        path: cypress/reports/junit-php8.5-subdir-${{ matrix.test-type.name }}-*.xml
        reporter: java-junit
        fail-on-error: true
        fail-on-empty: false
        list-suites: all
        list-tests: failed
        max-annotations: 50
        use-actions-summary: true

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:subdir:down

  # ── New system setup wizard — root path (PHP 8.5) ────────────────────────
  test-new-system:
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
