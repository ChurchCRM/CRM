    - name: Run locale smoke tests (root, PHP 8.5)
      run: npx cypress run --config-file cypress/configs/locale.config.ts --headless --browser electron --reporter junit --reporter-options mochaFile=cypress/reports/junit-php8.5-root-locale-[hash].xml

    - name: Collect Docker logs on failure
      if: failure()
      run: |
        mkdir -p cypress/logs/docker cypress/logs/php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root logs > cypress/logs/docker/docker-compose-php8.5-root-locale.log 2>&1 || true
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root ps -a >> cypress/logs/docker/docker-compose-php8.5-root-locale.log 2>&1 || true
        [ -d src/logs ] && cp -r src/logs cypress/logs/php/ || true

    - name: Upload debug artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: cypress-artifacts-php8.5-root-locale-${{ github.run_id }}
        path: |
          cypress/logs
          cypress/screenshots
          cypress/videos
        retention-days: 15
        if-no-files-found: ignore

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: 'PHP 8.5: Root (locale)'
        path: cypress/reports/junit-php8.5-root-locale-*.xml
        reporter: java-junit
        fail-on-error: true
        fail-on-empty: false
        list-suites: all
        list-tests: failed
        max-annotations: 50
        use-actions-summary: true

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:root:down

  # ── Locale smoke tests — subdirectory path (PHP 8.5) ─────────────────────
  test-locale-subdir:
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Cache Cypress binary
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: ${{ runner.os }}-cypress-${{ hashFiles('**/package-lock.json') }}
        restore-keys: ${{ runner.os }}-cypress-

    - name: Install npm dependencies
      run: npm ci

    - name: Download build artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image (PHP 8.5)
      run: |
        docker load < temp/docker-image-8.5.tar.gz
        docker tag churchcrm/crm:php8.5-test churchcrm/crm:php8-debian

    - name: Start Docker (subdirectory path)
      run: |
        cp docker/Config.parallel.subdir.php src/Include/Config.php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir up -d

    - name: Wait for server (subdirectory path)
      run: |
        max_attempts=12
        attempt=1
        until curl -sf http://127.0.0.1:8080/churchcrm/api/public/echo; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run locale smoke tests (subdir, PHP 8.5)
      run: npx cypress run --config-file cypress/configs/locale.config.ts --headless --browser electron --reporter junit --reporter-options mochaFile=cypress/reports/junit-php8.5-subdir-locale-[hash].xml
      env:
        CYPRESS_BASE_URL: http://127.0.0.1:8080/churchcrm/

    - name: Collect Docker logs on failure
      if: failure()
      run: |
        mkdir -p cypress/logs/docker cypress/logs/php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir logs > cypress/logs/docker/docker-compose-php8.5-subdir-locale.log 2>&1 || true
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-subdir ps -a >> cypress/logs/docker/docker-compose-php8.5-subdir-locale.log 2>&1 || true
        [ -d src/logs ] && cp -r src/logs cypress/logs/php/ || true

    - name: Upload debug artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: cypress-artifacts-php8.5-subdir-locale-${{ github.run_id }}
        path: |
          cypress/logs
          cypress/screenshots
          cypress/videos
        retention-days: 15
        if-no-files-found: ignore

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: 'PHP 8.5: Subdirectory (locale)'
        path: cypress/reports/junit-php8.5-subdir-locale-*.xml
        reporter: java-junit
        fail-on-error: true
        fail-on-empty: false
        list-suites: all
        list-tests: failed
        max-annotations: 50
        use-actions-summary: true

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:subdir:down

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2b — Upgrade tests
  # Mirrors upgrade-tests.yml faithfully; runs PHP 8.4 AND 8.5 × 4 DB groups.
  # Runs in parallel with Stage 2a — both stages fan out from the same build.
  # ═══════════════════════════════════════════════════════════════════════════
  test-upgrade:
    needs: build
    name: ${{ matrix.group.name }} / PHP ${{ matrix.php-version }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    env:
      COMPOSE_MYSQL: ${{ matrix.group.database == 'mysql' && '-f docker/docker-compose.mysql.yaml' || '' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
        group:
          - name: churchcrm-mysql
            database: mysql
            sql_file: cypress/fixtures/upgrade/churchinfo-1.3.1.sql
            admin_user: Admin
            admin_pass: churchinfoadmin
            force_password_change: 'true'
            label: 'ChurchInfo 1.3.1'
          - name: churchcrm-mariadb
            database: mariadb
            sql_file: cypress/fixtures/upgrade/churchinfo-1.3.1.sql
            admin_user: Admin
            admin_pass: churchinfoadmin
            force_password_change: 'true'
            label: 'ChurchInfo 1.3.1'
          - name: v6-mysql
            database: mysql
            sql_file: cypress/fixtures/upgrade/churchcrm-6.0.0.sql
            admin_user: Admin
            admin_pass: changeme
            force_password_change: ''
            label: '6.0.0'
          - name: v6-mariadb
            database: mariadb
            sql_file: cypress/fixtures/upgrade/churchcrm-6.0.0.sql
            admin_user: Admin
            admin_pass: changeme
            force_password_change: ''
            label: '6.0.0'
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Download build artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image
      run: |
        docker load < temp/docker-image-${{ matrix.php-version }}.tar.gz
        docker tag churchcrm/crm:php${{ matrix.php-version }}-test churchcrm/crm:php8-debian

    - name: Generate file signatures
      run: node scripts/generate-signatures-node.js

    - name: Remove Config.php for fresh install
      run: rm -f src/Include/Config.php

    - name: Start Docker (${{ matrix.group.name }})
      run: docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml $COMPOSE_MYSQL --profile ci-new-system up -d

    - name: Wait for server
      run: |
        max_attempts=12
        attempt=1
        until curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/ | grep -q "302\|200"; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml $COMPOSE_MYSQL --profile ci-new-system ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml $COMPOSE_MYSQL --profile ci-new-system logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run Cypress upgrade test (${{ matrix.group.name }}, PHP ${{ matrix.php-version }})
      uses: cypress-io/github-action@v7
      with:
        command: npx cypress run --config-file cypress/configs/upgrade.config.ts --headless --browser electron --reporter junit --reporter-options mochaFile=cypress/reports/junit-php${{ matrix.php-version }}-${{ matrix.group.name }}-[hash].xml
      env:
        CYPRESS_UPGRADE_SQL_FILE: ${{ matrix.group.sql_file }}
        CYPRESS_UPGRADE_ADMIN_USER: ${{ matrix.group.admin_user }}
        CYPRESS_UPGRADE_ADMIN_PASS: ${{ matrix.group.admin_pass }}
        CYPRESS_UPGRADE_FORCE_PASSWORD_CHANGE: ${{ matrix.group.force_password_change }}

    - name: Collect Docker logs on failure
      if: failure()
      run: |
        mkdir -p cypress/logs/docker cypress/logs/php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml $COMPOSE_MYSQL --profile ci-new-system logs > cypress/logs/docker/docker-compose-php${{ matrix.php-version }}-${{ matrix.group.name }}.log 2>&1 || true
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml $COMPOSE_MYSQL --profile ci-new-system ps -a >> cypress/logs/docker/docker-compose-php${{ matrix.php-version }}-${{ matrix.group.name }}.log 2>&1 || true
        [ -d src/logs ] && cp -r src/logs cypress/logs/php/ || true

    - name: Upload debug artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: cypress-artifacts-php${{ matrix.php-version }}-${{ matrix.group.name }}-${{ github.run_id }}
        path: |
          cypress/logs
          cypress/screenshots
          cypress/videos
        retention-days: 15
        if-no-files-found: ignore

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: 'PHP ${{ matrix.php-version }} / ${{ matrix.group.name }}: Upgrade from ${{ matrix.group.label }}'
        path: cypress/reports/junit-php${{ matrix.php-version }}-${{ matrix.group.name }}-*.xml
        reporter: java-junit
        fail-on-error: true
        fail-on-empty: false
        list-suites: all
        list-tests: failed
        max-annotations: 50
        use-actions-summary: true

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:new-system:down

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3 — Nightly summary
  # Runs after all test jobs (always) and writes a pass/fail table to the
  # workflow step summary.
  # ═══════════════════════════════════════════════════════════════════════════
  nightly-summary:
    needs:
      - build
      - test-root
      - test-subdir
      - test-new-system
      - test-new-system-subdir
      - test-locale-root
      - test-locale-subdir
      - test-upgrade
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Write summary
      run: |
        echo "## Nightly Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job group | Result |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Build (PHP 8.4 + 8.5 images) | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| PHP 8.5 root (api / admin-ui / ui ×3) | ${{ needs.test-root.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| PHP 8.5 subdir (api / admin-ui / ui ×3) | ${{ needs.test-subdir.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| PHP 8.5 new-system setup (root) | ${{ needs.test-new-system.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| PHP 8.5 new-system setup (subdir) | ${{ needs.test-new-system-subdir.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| PHP 8.5 locale smoke (root) | ${{ needs.test-locale-root.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| PHP 8.5 locale smoke (subdir) | ${{ needs.test-locale-subdir.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Upgrade tests (8.4+8.5 × 4 groups) | ${{ needs.test-upgrade.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        # Determine overall status — check for non-success so skipped/cancelled
        # jobs (e.g. when build fails) are also reported as failures.
        if [[ "${{ needs.build.result }}" != "success" || \
              "${{ needs.test-root.result }}" != "success" || \
              "${{ needs.test-subdir.result }}" != "success" || \
              "${{ needs.test-new-system.result }}" != "success" || \
              "${{ needs.test-new-system-subdir.result }}" != "success" || \
              "${{ needs.test-locale-root.result }}" != "success" || \
              "${{ needs.test-locale-subdir.result }}" != "success" || \
              "${{ needs.test-upgrade.result }}" != "success" ]]; then
          echo "**Overall: ❌ FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "One or more test groups failed, were skipped, or were cancelled — check individual job logs above." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "**Overall: ✅ PASSED**" >> $GITHUB_STEP_SUMMARY
        fi
