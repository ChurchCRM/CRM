name: Nightly Tests

# Consolidated nightly workflow covering all test types that are too heavy or
# slow to run on every push/PR. This workflow supersedes upgrade-tests.yml
# (which is deleted). The on-release trigger for upgrade tests is now
# included in this file's on: block below.
#
# What this workflow covers
# ─────────────────────────
# Stage 1 – build
#   • Builds PHP 8.4 and 8.5 Docker images and uploads them as a shared
#     workflow artifact.
#
# Stage 2a – PHP 8.5 full test suite (all jobs run in parallel)
#   • test-root:             api, admin-ui, ui (3 shards) — root install path
#   • test-subdir:           api, admin-ui, ui (3 shards) — subdirectory path
#   • test-new-system:       setup-wizard (root path)
#   • test-new-system-subdir setup-wizard (subdir path)
#   • test-locale-root:      locale smoke tests (root)
#   • test-locale-subdir:    locale smoke tests (subdir)
#
# Stage 2b – Upgrade tests (PHP 8.4 × PHP 8.5, 4 DB groups — parallel with 2a)
#   • test-upgrade:  churchcrm-mysql | churchcrm-mariadb | v6-mysql | v6-mariadb
#                    × PHP 8.4 and 8.5
#
# Stage 3 – Summary
#   • nightly-summary: always() — reports pass/fail counts to the step summary
#
# Concurrency: a new run cancels any in-progress nightly run (safe for both
# scheduled and manual dispatch triggers — you always want the latest code).

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  actions: read

on:
  schedule:
    - cron: '0 3 * * *'  # offset from build-test-package.yml (0 2) to avoid runner contention
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1 — Build
  # Build the app + PHP 8.4 and 8.5 Docker images; upload as a shared artifact.
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Set up PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: pdo_mysql, mysqli, gd, zip, gettext, iconv, mbstring, xml, curl, fileinfo, bcmath
        coverage: none

    - name: Get Composer cache directory
      id: composer-cache
      run: |
        cd src
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer packages
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      env:
        COMPOSER_MEMORY_LIMIT: -1
      run: |
        cd src
        composer install --no-dev --no-interaction --prefer-dist

    - name: Build app
      run: npm run package

    - name: Validate PHP syntax
      run: npm run build:php:validate:all

    - name: Build Docker images (PHP 8.4 and 8.5)
      run: |
        for version in 8.4 8.5; do
          echo "Building Docker image for PHP $version..."
          docker build --target test \
            --build-arg PHP_VERSION=$version \
            -t churchcrm/crm:php${version}-test \
            -f docker/Dockerfile.churchcrm-apache-php8 docker/
          docker save churchcrm/crm:php${version}-test | gzip > temp/docker-image-${version}.tar.gz
          echo "Saved: $(du -h temp/docker-image-${version}.tar.gz | cut -f1)"
        done

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: nightly-build-${{ github.run_id }}
        path: |
          src/
          temp/
          !src/logs
        retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2a — PHP 8.5 full test suite
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Root-path tests: api, admin-ui, and ui (3 shards) ───────────────────
  test-root:
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-type:
          - name: api
            spec: "cypress/e2e/api/**/*.spec.js"
            config: "cypress/configs/docker.config.ts"
          - name: admin-ui
            spec: "cypress/e2e/ui-admin/**/*.spec.js"
            config: "cypress/configs/docker-admin.config.ts"
        include:
          # ui specs sharded 3× — cypress-split balances by spec file
          # split-index values are strings to avoid JS falsy coercion of 0
          - test-type: { name: ui-shard-0, config: "cypress/configs/docker.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "0"
            shard-total: 3
          - test-type: { name: ui-shard-1, config: "cypress/configs/docker.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "1"
            shard-total: 3
          - test-type: { name: ui-shard-2, config: "cypress/configs/docker.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "2"
            shard-total: 3
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Cache Cypress binary
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: ${{ runner.os }}-cypress-${{ hashFiles('**/package-lock.json') }}
        restore-keys: ${{ runner.os }}-cypress-

    - name: Install npm dependencies
      run: npm ci

    - name: Download build artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: nightly-build-${{ github.run_id }}
        path: .

    - name: Load Docker image (PHP 8.5)
      run: |
        docker load < temp/docker-image-8.5.tar.gz
        docker tag churchcrm/crm:php8.5-test churchcrm/crm:php8-debian

    - name: Start Docker (root path)
      run: |
        cp docker/Config.root.php src/Include/Config.php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root up -d

    - name: Wait for server (root path)
      run: |
        max_attempts=12
        attempt=1
        until curl -sf http://127.0.0.1/api/public/echo; do
          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to respond after $max_attempts attempts"
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root ps -a
            docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root logs
            exit 1
          fi
          echo "Attempt $attempt/$max_attempts — retrying in 5s..."
          sleep 5
          attempt=$((attempt + 1))
        done
        echo "Server ready."

    - name: Run Cypress ${{ matrix.test-type.name }} tests (root, PHP 8.5)
      run: npx cypress run --config-file "${{ matrix.test-type.config }}" --spec "${{ matrix.test-type.spec }}" --headless --browser electron --reporter junit --reporter-options mochaFile=cypress/reports/junit-php8.5-root-${{ matrix.test-type.name }}-[suiteName]-[hash].xml
      env:
        SPLIT: ${{ matrix.shard-total || '' }}
        SPLIT_INDEX: ${{ matrix.split-index }}

    - name: Collect Docker logs on failure
      if: failure()
      run: |
        mkdir -p cypress/logs/docker cypress/logs/php
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root logs > cypress/logs/docker/docker-compose-php8.5-root-${{ matrix.test-type.name }}.log 2>&1 || true
        docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-root ps -a >> cypress/logs/docker/docker-compose-php8.5-root-${{ matrix.test-type.name }}.log 2>&1 || true
        [ -d src/logs ] && cp -r src/logs cypress/logs/php/ || true

    - name: Upload debug artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: cypress-artifacts-php8.5-root-${{ matrix.test-type.name }}-${{ github.run_id }}
        path: |
          cypress/logs
          cypress/screenshots
          cypress/videos
        retention-days: 15
        if-no-files-found: ignore

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: 'PHP 8.5: Root (${{ matrix.test-type.name }})'
        path: cypress/reports/junit-php8.5-root-${{ matrix.test-type.name }}-*.xml
        reporter: java-junit
        fail-on-error: true
        fail-on-empty: false
        list-suites: all
        list-tests: failed
        max-annotations: 50
        use-actions-summary: true

    - name: Stop Docker
      if: always()
      run: npm run docker:ci:root:down

  # ── Subdirectory-path tests: api, admin-ui, and ui (3 shards) ────────────
  test-subdir:
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-type:
          - name: api
            spec: "cypress/e2e/api/**/*.spec.js"
            config: "cypress/configs/docker.config.ts"
          - name: admin-ui
            spec: "cypress/e2e/ui-admin/**/*.spec.js"
            config: "cypress/configs/docker-admin.config.ts"
        include:
          # split-index values are strings to avoid JS falsy coercion of 0
          - test-type: { name: ui-shard-0, config: "cypress/configs/docker.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "0"
            shard-total: 3
          - test-type: { name: ui-shard-1, config: "cypress/configs/docker.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "1"
            shard-total: 3
          - test-type: { name: ui-shard-2, config: "cypress/configs/docker.config.ts", spec: "cypress/e2e/ui/**/*.spec.js" }
            split-index: "2"
            shard-total: 3
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Cache Cypress binary
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
