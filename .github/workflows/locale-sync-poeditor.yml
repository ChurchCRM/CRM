name: "Locale: sync"

# Upload terms, then download (docs/locale-pipeline.md). No translation happens here:
#   1. upload terms   locale/messages.po -> POEditor, deleting terms that are no longer in the file
#   2. download       POEditor -> src/locale + locale/terms/missing, opened as a PR on branch
#                     locale/download/<version>
#
# Two flows end here:
#   terms flow      merged terms PR -> (30 minute settle) -> upload terms -> download
#   translate flow  translation agent -> Locale: upload translations -> download only
#                   (dispatched with upload_terms=false)
#
# Every step is idempotent, so the trigger only decides when the run happens, not what it does:
#   - push to master touching locale/messages.po (a merged terms PR, branch locale/terms/*).
#     It first waits 30 minutes (job `settle`); a newer push cancels the wait and starts it again,
#     so a burst of terms merges becomes one upload and one download
#   - locale-upload-missing.yml dispatches it with upload_terms=false after a translate branch uploads (no wait)
#   - daily schedule and manual run (no wait)
# The sync PR itself never retriggers this workflow: it does not touch locale/messages.po.
permissions:
  contents: read

on:
  push:
    branches:
      - master
    paths:
      - 'locale/messages.po'
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Allow manual triggering from GitHub UI
    inputs:
      operation_mode:
        description: 'Operation to perform'
        required: false
        type: choice
        options:
          - 'download-and-audit'
          - 'audit-only'
        default: 'download-and-audit'
      skip_audit:
        description: 'Skip locale audit step for faster execution (ignored if audit-only mode)'
        required: false
        type: boolean
        default: false
      upload_terms:
        description: 'Upload locale/messages.po to POEditor before downloading'
        required: false
        type: boolean
        default: true
      max_term_deletions:
        description: 'Let the terms upload delete up to this many POEditor terms (blank = default guard)'
        required: false
        type: string
        default: ''

# Concurrency is per job, not per workflow: `settle` (first job) restarts its wait on every new push, and `download`
# queues so a manual, scheduled or dispatched run never overlaps a settled push run.

jobs:
  settle:
    # Merge-storm guard, first so a newer push cancels the run before it does any work
    if: github.event_name == 'push'
    concurrency:
      group: locale-sync-settle
      cancel-in-progress: true
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
    - name: Wait 30 minutes for more terms merges
      run: sleep 1800

  setup:
    needs: settle
    if: ${{ !cancelled() && (needs.settle.result == 'success' || needs.settle.result == 'skipped') }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package-version.outputs.current-version }}
      date: ${{ steps.date.outputs.date }}
      trigger: ${{ steps.trigger.outputs.trigger }}
    env:
      POEDITOR_TOKEN: ${{ secrets.POEDITOR_TOKEN }}
    steps:
    - name: Require master
      # sync_terms deletes POEditor terms that are missing from locale/messages.po, so an older branch or
      # tag must never be the source of that file
      if: github.ref != 'refs/heads/master'
      run: |
        echo "::error::Locale: sync must run from master (this run is on $GITHUB_REF)"
        exit 1

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: master

    - name: Display operation mode
      run: |
        echo "🔧 **Operation Mode**: ${{ inputs.operation_mode || 'download-and-audit' }}"
        echo "📋 Audit will be ${{ inputs.operation_mode == 'audit-only' && 'the only step' || inputs.skip_audit == true && 'skipped' || 'included' }}"

    - name: Get package version
      id: package-version
      run: echo "current-version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Describe trigger
      id: trigger
      env:
        EVENT: ${{ github.event_name }}
      run: |
        case "$EVENT" in
          push) echo "trigger=Merged terms PR (locale/messages.po changed on master, after a 30 minute settle)" >> $GITHUB_OUTPUT ;;
          workflow_dispatch) echo "trigger=Manual or dispatched run" >> $GITHUB_OUTPUT ;;
          *) echo "trigger=Scheduled daily run" >> $GITHUB_OUTPUT ;;
        esac

    - name: Check POEditor Token
      run: |
        if [ -z "$POEDITOR_TOKEN" ]; then
          echo "❌ POEDITOR_TOKEN secret is not set"
          echo "Set this secret in Settings → Secrets and variables → Actions with a valid POEditor API token."
          exit 1
        fi
        echo "✅ POEditor token is configured"

  download:
    needs: setup
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    concurrency:
      group: locale-sync-work
      cancel-in-progress: false
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      ref_sha: ${{ steps.snapshot.outputs.sha }}
      downloaded_at: ${{ steps.snapshot.outputs.at }}
    env:
      POEDITOR_TOKEN: ${{ secrets.POEDITOR_TOKEN }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # the newest master once this job holds the work lock, not the commit that started the run
        ref: master
        # regression check compares against HEAD~1
        fetch-depth: 2

    - name: Record the master commit and time this sync is based on
      id: snapshot
      run: |
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

    - uses: ./.github/actions/checkout-node-npm

    - name: "1. Upload terms to POEditor"
      if: inputs.operation_mode != 'audit-only' && (github.event_name != 'workflow_dispatch' || inputs.upload_terms)
      env:
        MAX_TERM_DELETIONS: ${{ inputs.max_term_deletions }}
      run: |
        if [ -n "$MAX_TERM_DELETIONS" ]; then
          [[ "$MAX_TERM_DELETIONS" =~ ^[0-9]+$ ]] || { echo "::error::max_term_deletions must be a whole number"; exit 1; }
          node locale/scripts/poeditor-upload-terms.js --max-deletions "$MAX_TERM_DELETIONS"
        else
          node locale/scripts/poeditor-upload-terms.js
        fi

    - name: "2. Download locales from POEditor"
      if: inputs.operation_mode != 'audit-only'
      run: npm run locale:download

    - name: Validate locale download integrity
      if: inputs.operation_mode != 'audit-only'
      run: |
        echo "🔍 Validating locale download integrity..."
        
        # Check if any JSON files were created
        json_count=$(find src/locale/i18n -name "*.json" -type f | wc -l)
        echo "Found $json_count JSON locale files"
        
        if [ "$json_count" -eq 0 ]; then
          echo "❌ ERROR: No JSON locale files found after download!"
          exit 1
        fi
        
        # Check for completely empty JSON files (which shouldn't exist)
        # Exclude en_US.json as it's the base locale and will always be empty
        empty_files=$(find src/locale/i18n -name "*.json" -type f -empty ! -name "en_US.json")
        if [ -n "$empty_files" ]; then
          echo "❌ ERROR: Found empty JSON locale files:"
          echo "$empty_files"
          echo "This indicates a download failure for these locales."
          exit 1
        fi
        
        # Check for JSON files that only contain whitespace or are malformed
        # Exclude en_US.json as it's the base locale
        invalid_files=""
        for json_file in src/locale/i18n/*.json; do
          # Skip en_US.json (base locale, expected to be empty)
          if [ "$(basename "$json_file")" = "en_US.json" ]; then
            continue
          fi
          
          if [ -f "$json_file" ]; then
            # Check if file contains valid JSON (at minimum empty object {})
            if ! python3 -m json.tool "$json_file" > /dev/null 2>&1; then
              # If not valid JSON, check if it's just empty/whitespace
              if [ ! -s "$json_file" ] || [ "$(cat "$json_file" | tr -d '[:space:]')" = "" ]; then
                invalid_files="$invalid_files\n$(basename "$json_file")"
              fi
            fi
          fi
        done
        
        if [ -n "$invalid_files" ]; then
          echo "❌ ERROR: Found invalid/empty JSON locale files:"
          echo -e "$invalid_files"
          echo "This indicates POEditor download failures. Failing the job."
          exit 1
        fi
        
        echo "✅ Locale download integrity validation passed"

    - name: Check for locale regressions
      if: inputs.operation_mode != 'audit-only'
      run: |
        echo "🔍 Checking for locale regressions (files that lost content)..."
        
        # Get list of files that were deleted or significantly reduced
        regression_files=""
        
        # Check git diff for files that went from having content to being empty
        deleted_content=$(git diff --name-only --diff-filter=M | grep "src/locale/i18n/.*\.json$" || true)
        
        if [ -n "$deleted_content" ]; then
          for file in $deleted_content; do
            # Check if file exists and is now empty/small but was larger before
            if [ -f "$file" ]; then
              current_size=$(wc -c < "$file" 2>/dev/null || echo "0")
              # Get the size of the file in the previous commit
              previous_size=$(git show HEAD~1:"$file" 2>/dev/null | wc -c || echo "0")
              
              # If current file is empty or very small (< 50 bytes) but previous was substantial (> 500 bytes)
              if [ "$current_size" -lt 50 ] && [ "$previous_size" -gt 500 ]; then
                regression_files="$regression_files\n  - $file (was ${previous_size} bytes, now ${current_size} bytes)"
              fi
            fi
          done
        fi
        
        if [ -n "$regression_files" ]; then
          echo "❌ ERROR: Detected locale regression - files lost substantial content:"
          echo -e "$regression_files"
          echo ""
          echo "This suggests POEditor download failed for these locales."
          echo "The job will fail to prevent loss of existing translations."
          exit 1
        fi
        
        echo "✅ No locale regressions detected"

    - name: Show download summary
      if: inputs.operation_mode != 'audit-only'
      run: |
        echo "📊 Download Summary:"
        echo "Total JSON files: $(find src/locale/i18n -name "*.json" -type f | wc -l)"
        echo "Non-empty JSON files: $(find src/locale/i18n -name "*.json" -type f ! -empty | wc -l)"
        echo "Files with substantial content (>100 bytes): $(find src/locale/i18n -name "*.json" -type f -exec wc -c {} \; | awk '$1 > 100' | wc -l)"
        echo ""
        echo "Git status after download:"
        git status --porcelain src/locale/i18n/

    - name: Check for changes
      if: inputs.operation_mode != 'audit-only'
      id: changes
      run: |
        if [ -z "$(git status --porcelain -- src/locale/i18n src/locale/textdomain locale/terms/missing)" ]; then
          echo "No locale changes detected"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Locale changes detected"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Changed files:"
          git status --porcelain -- src/locale/i18n src/locale/textdomain locale/terms/missing
        fi

    - name: Upload locale changes
      if: steps.changes.outputs.has_changes == 'true'
      uses: ./.github/actions/upload-artifact
      with:
        name: locale-changes
        path: |
          src/locale/i18n
          src/locale/textdomain
          locale/terms/missing
        if-no-files-found: error

    - name: Run locale audit
      if: inputs.operation_mode == 'audit-only' || inputs.skip_audit != true
      run: npm run locale:audit

  pull-request:
    needs: [setup, download]
    # audit failure after the artifact upload must not block the PR
    if: ${{ !cancelled() && needs.download.outputs.has_changes == 'true' }}
    # One publisher at a time. This job is kept separate from `download` so the write token never reaches the
    # POEditor token or npm; the freshness step below keeps an older snapshot from replacing a newer one.
    concurrency:
      group: locale-sync-publish
      cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # the master commit the download was based on
        ref: ${{ needs.download.outputs.ref_sha }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Skip when a newer sync already published
      id: fresh
      env:
        VERSION: ${{ needs.setup.outputs.version }}
        DOWNLOADED_AT: ${{ needs.download.outputs.downloaded_at }}
      run: |
        published=""
        if git fetch --depth=1 origin "locale/download/$VERSION" 2>/dev/null; then
          published=$(git log -1 --format=%B FETCH_HEAD | sed -n 's/^Downloaded-at: //p' | head -n 1)
        fi
        if [[ "$published" =~ ^[0-9]+$ ]] && [ "$published" -gt "$DOWNLOADED_AT" ]; then
          echo "The branch already holds a newer download ($published > $DOWNLOADED_AT); not replacing it with an older one"
          echo "stale=true" >> "$GITHUB_OUTPUT"
        else
          echo "stale=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Replace locale files with downloaded changes
      if: steps.fresh.outputs.stale != 'true'
      run: rm -rf src/locale/i18n src/locale/textdomain locale/terms/missing

    - name: Download locale changes
      if: steps.fresh.outputs.stale != 'true'
      uses: ./.github/actions/download-artifact
      with:
        name: locale-changes

    - name: Create Pull Request
      if: steps.fresh.outputs.stale != 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        base: master
        branch: 'locale/download/${{ needs.setup.outputs.version }}'
        delete-branch: true
        labels: |
          localization
        milestone: ${{ needs.setup.outputs.version }}
        title: "locale: update translations from POEditor - ${{ needs.setup.outputs.date }}"
        commit-message: |
          🌍 Locale update from POEditor on ${{ needs.setup.outputs.date }}
          
          - Updated translations from POEditor
          - Version: ${{ needs.setup.outputs.version }}
          - Triggered: ${{ needs.setup.outputs.trigger }}

          Downloaded-at: ${{ needs.download.outputs.downloaded_at }}
        body: |
          ## 🌍 Automatic Locale Update
          
          This PR contains updated translations downloaded from POEditor and missing term reports for all locales.
          
          **Details:**
          - 📅 **Date**: ${{ needs.setup.outputs.date }}
          - 🏷️ **Version**: ${{ needs.setup.outputs.version }}
          - 🚀 **Trigger**: ${{ needs.setup.outputs.trigger }}
          
          **What's included:**
          - Updated translation files from POEditor
          - Generated locale JSON files
          - 📊 Missing terms for all locales (in `locale/terms/missing/`)
          - Locale audit results
          
          **Missing Terms Reports:**
          For each incomplete locale, batch files under `locale/terms/missing/{locale}/` contain all untranslated terms downloaded directly from POEditor. These can be used with `/locale-translate` or uploaded directly to POEditor.
          
          This PR was automatically created by the POEditor workflow.
          
          ---
          
          **Manual Run Options:**
          ${{ inputs.skip_audit == true && '- ⏩ Audit skipped' || '- 🔍 Full download and audit' }}
