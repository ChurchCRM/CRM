name: "Locale: sync POEditor"
run-name: >-
  ${{ github.event_name == 'push' && 'Locale sync: upload terms + download translations (terms PR merged)'
  || github.event_name == 'schedule' && 'Locale sync: daily upload terms + download translations'
  || inputs.operation_mode == 'audit-only' && 'Locale sync: audit only (manual)'
  || inputs.upload_terms == false && 'Locale sync: download translations only (after a translation upload)'
  || 'Locale sync: upload terms + download translations (manual)' }}

# RETIRED (#11416): translations now live in the repo (npm run locale:missing / locale:apply), so this
# workflow no longer starts by itself. A manual run would overwrite src/locale with POEditor's copy, so
# only run it for a final download before the repo-only flow takes over. The follow-up PR deletes it.
#
# Stage 2, in plain words. No translating happens here:
#   1. upload terms   locale/messages.po -> POEditor (sync_terms: deletes terms no longer in the file,
#                     with a guard against large deletions)
#   2. download       POEditor -> src/locale + locale/terms/missing
#   3. download PR    "locale: download translations from POEditor - <date>" on locale/download/<version>,
#                     left open for a person (it no longer merges itself, #11416).
#
# What starts it (every step is idempotent, so the trigger only decides when, not what):
#   - a merged terms PR (push to master touching locale/messages.po): runs at once. The wait for a burst
#     of merges happens before the terms PR exists (Locale: extract terms), so there is no second wait here
#   - Locale: upload translations, after a translation branch uploads: download only (upload_terms=false)
#   - daily at 00:00 UTC, or by hand (release: run it by hand, or npm run locale:release)
# The download PR never starts this workflow again: it does not touch locale/messages.po, and its
# GITHUB_TOKEN merge fires no push.
permissions:
  contents: read

on:
  # push (terms PR merged) and the daily schedule were removed with #11416; manual runs only.
  workflow_dispatch:
    # Allow manual triggering from GitHub UI
    inputs:
      operation_mode:
        description: 'Operation to perform'
        required: false
        type: choice
        options:
          - 'download-and-audit'
          - 'audit-only'
        default: 'download-and-audit'
      skip_audit:
        description: 'Skip locale audit step for faster execution (ignored if audit-only mode)'
        required: false
        type: boolean
        default: false
      upload_terms:
        description: 'Upload locale/messages.po to POEditor before downloading'
        required: false
        type: boolean
        default: true
      max_term_deletions:
        description: 'Let the terms upload delete up to this many POEditor terms (blank = default guard)'
        required: false
        type: string
        default: ''

# Concurrency is per job: `download` queues so two syncs never overlap, and `pull-request` publishes one at a time.

jobs:
  setup:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package-version.outputs.current-version }}
      date: ${{ steps.date.outputs.date }}
      trigger: ${{ steps.trigger.outputs.trigger }}
    env:
      POEDITOR_TOKEN: ${{ secrets.POEDITOR_TOKEN }}
    steps:
    - name: Require master
      # sync_terms deletes POEditor terms that are missing from locale/messages.po, so an older branch or
      # tag must never be the source of that file
      if: github.ref != 'refs/heads/master'
      run: |
        echo "::error::Locale: sync must run from master (this run is on $GITHUB_REF)"
        exit 1

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: master

    - name: Display operation mode
      run: |
        echo "🔧 **Operation Mode**: ${{ inputs.operation_mode || 'download-and-audit' }}"
        echo "📋 Audit will be ${{ inputs.operation_mode == 'audit-only' && 'the only step' || inputs.skip_audit == true && 'skipped' || 'included' }}"

    - name: Get package version
      id: package-version
      run: echo "current-version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Describe trigger
      id: trigger
      env:
        EVENT: ${{ github.event_name }}
      run: |
        case "$EVENT" in
          push) echo "trigger=Merged terms PR (locale/messages.po changed on master)" >> $GITHUB_OUTPUT ;;
          workflow_dispatch) echo "trigger=Manual or dispatched run" >> $GITHUB_OUTPUT ;;
          *) echo "trigger=Scheduled daily run" >> $GITHUB_OUTPUT ;;
        esac

    - name: Check POEditor Token
      run: |
        if [ -z "$POEDITOR_TOKEN" ]; then
          echo "❌ POEDITOR_TOKEN secret is not set"
          echo "Set this secret in Settings → Secrets and variables → Actions with a valid POEditor API token."
          exit 1
        fi
        echo "✅ POEditor token is configured"

  download:
    needs: setup
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    concurrency:
      group: locale-sync-work
      cancel-in-progress: false
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      ref_sha: ${{ steps.snapshot.outputs.sha }}
      downloaded_at: ${{ steps.snapshot.outputs.at }}
    env:
      POEDITOR_TOKEN: ${{ secrets.POEDITOR_TOKEN }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # the newest master once this job holds the work lock, not the commit that started the run
        ref: master
        # regression check compares against HEAD~1
        fetch-depth: 2

    - name: Record the master commit and time this sync is based on
      id: snapshot
      run: |
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

    - uses: ./.github/actions/checkout-node-npm

    - name: "1. Upload terms to POEditor"
      if: inputs.operation_mode != 'audit-only' && (github.event_name != 'workflow_dispatch' || inputs.upload_terms)
      env:
        MAX_TERM_DELETIONS: ${{ inputs.max_term_deletions }}
      run: |
        if [ -n "$MAX_TERM_DELETIONS" ]; then
          [[ "$MAX_TERM_DELETIONS" =~ ^[0-9]+$ ]] || { echo "::error::max_term_deletions must be a whole number"; exit 1; }
          node locale/scripts/poeditor-upload-terms.js --max-deletions "$MAX_TERM_DELETIONS"
        else
          node locale/scripts/poeditor-upload-terms.js
        fi

    - name: "2. Download locales from POEditor"
      if: inputs.operation_mode != 'audit-only'
      run: npm run locale:download

    - name: Validate locale download integrity
      if: inputs.operation_mode != 'audit-only'
      run: node locale/scripts/lib/locale-download-check.js integrity

    - name: Check for locale regressions
      if: inputs.operation_mode != 'audit-only'
      run: node locale/scripts/lib/locale-download-check.js regressions

    - name: Show download summary
      if: inputs.operation_mode != 'audit-only'
      run: |
        echo "📊 Download Summary:"
        echo "Total JSON files: $(find src/locale/i18n -name "*.json" -type f | wc -l)"
        echo "Non-empty JSON files: $(find src/locale/i18n -name "*.json" -type f ! -empty | wc -l)"
        echo "Files with substantial content (>100 bytes): $(find src/locale/i18n -name "*.json" -type f -exec wc -c {} \; | awk '$1 > 100' | wc -l)"
        echo ""
        echo "Git status after download:"
        git status --porcelain src/locale/i18n/

    - name: Check for changes
      if: inputs.operation_mode != 'audit-only'
      id: changes
      run: |
        if [ -z "$(git status --porcelain -- src/locale/i18n src/locale/textdomain locale/terms/missing)" ]; then
          echo "No locale changes detected"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Locale changes detected"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Changed files:"
          git status --porcelain -- src/locale/i18n src/locale/textdomain locale/terms/missing
        fi

    - name: Upload locale changes
      if: steps.changes.outputs.has_changes == 'true'
      uses: ./.github/actions/upload-artifact
      with:
        name: locale-changes
        path: |
          src/locale/i18n
          src/locale/textdomain
          locale/terms/missing
        if-no-files-found: error

    - name: Run locale audit
      if: inputs.operation_mode == 'audit-only' || inputs.skip_audit != true
      run: npm run locale:audit

  pull-request:
    needs: [setup, download]
    # audit failure after the artifact upload must not block the PR
    if: ${{ !cancelled() && needs.download.outputs.has_changes == 'true' }}
    # One publisher at a time. This job is kept separate from `download` so the write token never reaches the
    # POEditor token or npm; the freshness step below keeps an older snapshot from replacing a newer one.
    concurrency:
      group: locale-sync-publish
      cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # the master commit the download was based on
        ref: ${{ needs.download.outputs.ref_sha }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Skip when a newer sync already published
      id: fresh
      env:
        VERSION: ${{ needs.setup.outputs.version }}
        DOWNLOADED_AT: ${{ needs.download.outputs.downloaded_at }}
      run: |
        published=""
        if git fetch --depth=1 origin "locale/download/$VERSION" 2>/dev/null; then
          published=$(git log -1 --format=%B FETCH_HEAD | sed -n 's/^Downloaded-at: //p' | head -n 1)
        fi
        if [[ "$published" =~ ^[0-9]+$ ]] && [ "$published" -gt "$DOWNLOADED_AT" ]; then
          echo "The branch already holds a newer download ($published > $DOWNLOADED_AT); not replacing it with an older one"
          echo "stale=true" >> "$GITHUB_OUTPUT"
        else
          echo "stale=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Replace locale files with downloaded changes
      if: steps.fresh.outputs.stale != 'true'
      run: rm -rf src/locale/i18n src/locale/textdomain locale/terms/missing

    - name: Download locale changes
      if: steps.fresh.outputs.stale != 'true'
      uses: ./.github/actions/download-artifact
      with:
        name: locale-changes

    - name: Decide whether this download can merge
      id: gate
      if: steps.fresh.outputs.stale != 'true'
      run: node locale/scripts/lib/locale-download-gate.js

    - name: Create Pull Request
      id: cpr
      if: steps.fresh.outputs.stale != 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        base: master
        branch: 'locale/download/${{ needs.setup.outputs.version }}'
        delete-branch: true
        add-paths: |
          src/locale/i18n
          src/locale/textdomain
          locale/terms/missing
        labels: |
          localization
        milestone: ${{ needs.setup.outputs.version }}
        title: "locale: download translations from POEditor - ${{ needs.setup.outputs.date }}"
        commit-message: |
          locale: download translations from POEditor - ${{ needs.setup.outputs.date }}
          
          - Updated translations from POEditor
          - Version: ${{ needs.setup.outputs.version }}
          - Triggered: ${{ needs.setup.outputs.trigger }}

          Downloaded-at: ${{ needs.download.outputs.downloaded_at }}
        body: |
          ## 🌍 Translations downloaded from POEditor

          Retired flow (#11416): this PR does not merge itself. The repo holds the translations, so merging it would overwrite translations made there; close it unless you know it only adds work done in POEditor.
          
          **Details:**
          - 📅 **Date**: ${{ needs.setup.outputs.date }}
          - 🏷️ **Version**: ${{ needs.setup.outputs.version }}
          - 🚀 **Trigger**: ${{ needs.setup.outputs.trigger }}
          
          **What's included:**
          - Updated translation files from POEditor
          - Generated locale JSON files
          - 📊 Missing terms for all locales (in `locale/terms/missing/`)
          - Locale audit results
          
          **Missing Terms Reports:**
          For each incomplete locale, batch files under `locale/terms/missing/{locale}/` contain all untranslated terms downloaded directly from POEditor. These can be used with `/locale-translate` or uploaded directly to POEditor.
          
          Created by `Locale: sync POEditor` (locale-sync-poeditor.yml).
          
          ---
          
          **Manual Run Options:**
          ${{ inputs.skip_audit == true && '- ⏩ Audit skipped' || '- 🔍 Full download and audit' }}

    # The download PR no longer merges itself (#11416): the repo holds the translations now, so a
    # POEditor download would overwrite translations made since. A person reviews and closes it.
