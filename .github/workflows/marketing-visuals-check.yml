name: "Marketing: visuals check"

# Manually run the marketing screenshot/video pipeline end-to-end against a
# chosen branch, verify every capture it claims to have produced is a real,
# non-empty file (npm run marketing:check), and compare the result with the
# visuals committed under playwright/artifacts/screenshots and
# playwright/artifacts/videos:
#   - On the default branch (master): if they differ, the fresh visuals are
#     pushed to a branch and a PR is opened for review.
#   - On any other branch: if they differ, the run fails — the branch's
#     checked-in visuals are stale and need regenerating/committing.
# Either way the generated visuals are uploaded as a run artifact.
#
# Stages (each its own job, so the Actions UI shows exactly which locale or
# stage is running or failed):
#   1. capture   — one job per locale, in parallel. Each installs the
#                  toolchain, starts its own CI docker stack, runs the setup
#                  wizard + demo import, and captures that locale's
#                  screenshots (scripts/capture-all-locales.sh <locale>).
#                  Locales can't share one instance in parallel: the locale
#                  is a DB setting on the shared admin user. Only 'en' also
#                  records and publishes the videos.
#   2. merge     — combines every locale's output, re-runs the capture check,
#                  regenerates the manifest, and diffs against what's
#                  committed.
#   3. create-pr — only on the default branch when stage 2 found changes.
#
# Trigger this from the Actions tab: pick the branch, click "Run workflow".

on:
  workflow_dispatch:

concurrency:
  group: marketing-visuals-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: "1 — Capture (${{ matrix.locale }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        locale: [en, es, pt, zh, fr, ru, de, ar]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mysqli, gd, zip, gettext, iconv, mbstring, xml, curl, fileinfo, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          cd src
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npm run marketing:install

      - name: Capture ${{ matrix.locale }}
        run: ./scripts/capture-all-locales.sh "${{ matrix.locale }}"

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-new-system logs --no-color || true

      - name: Tear down Docker stack
        if: always()
        run: npm run docker:ci:new-system:down

      - name: Upload ${{ matrix.locale }} captures
        uses: actions/upload-artifact@v7
        with:
          name: marketing-locale-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            playwright/artifacts/screenshots
            playwright/artifacts/metadata
            playwright/artifacts/videos
          retention-days: 1
          if-no-files-found: error

      - name: Upload failure output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marketing-failure-${{ matrix.locale }}-${{ github.run_id }}
          path: playwright/.playwright-output/
          # Dot-directory: actions/upload-artifact drops it unless told otherwise.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  merge:
    name: "2 — Merge, check & compare"
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # Same starting point as a local `npm run marketing`, which begins by
      # wiping playwright/artifacts/: the working tree then holds only fresh
      # captures while git's index/HEAD holds what was last committed.
      - name: Clear committed artifacts
        run: rm -rf playwright/artifacts/

      - name: Download every locale's captures
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: marketing-locale-*-${{ github.run_id }}
          path: playwright/artifacts
          merge-multiple: true

      - name: Validate captures
        run: npm run marketing:check

      - name: Regenerate manifest.json
        run: npm run marketing:manifest

      - name: Detect changes to committed marketing visuals
        id: changes
        run: |
          git add -A -- playwright/artifacts/screenshots playwright/artifacts/videos
          if git diff --cached --quiet -- playwright/artifacts/screenshots playwright/artifacts/videos; then
            echo "Committed marketing visuals are up to date."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Committed marketing visuals are out of date. Changed files:"
            git diff --cached --stat -- playwright/artifacts/screenshots playwright/artifacts/videos
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail — branch visuals are stale
        if: github.ref_name != github.event.repository.default_branch && steps.changes.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Marketing visuals committed on '$BRANCH_NAME' are out of date with the current code. Run 'npm run marketing' locally and commit the updated files under playwright/artifacts/screenshots and playwright/artifacts/videos."
          exit 1

      # Stage 3 runs on a fresh runner with no access to this working tree,
      # so hand it exactly the changed files as one archive.
      - name: Package updated visuals for the PR-create stage
        if: github.ref_name == github.event.repository.default_branch && steps.changes.outputs.has_changes == 'true'
        run: tar -czf visuals-update.tar.gz playwright/artifacts/screenshots playwright/artifacts/videos

      - name: Upload updated visuals for PR creation
        if: github.ref_name == github.event.repository.default_branch && steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visuals-update-${{ github.run_id }}
          path: visuals-update.tar.gz
          retention-days: 1

      - name: Upload marketing visuals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marketing-visuals-${{ github.run_id }}
          path: playwright/artifacts/
          retention-days: 14
          if-no-files-found: warn

  create-pr:
    name: "3 — Open visuals-update PR"
    needs: merge
    if: github.ref_name == github.event.repository.default_branch && needs.merge.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download updated visuals
        uses: actions/download-artifact@v8.0.1
        with:
          name: visuals-update-${{ github.run_id }}

      - name: Extract updated visuals into the working tree
        run: tar -xzf visuals-update.tar.gz

      - name: Configure git for automated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Pull Request with updated visuals
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: marketing/update-visuals
          delete-branch: true
          add-paths: |
            playwright/artifacts/screenshots
            playwright/artifacts/videos
          commit-message: |
            chore(marketing): update marketing visuals

            Regenerated by the marketing-visuals-check workflow run
            ${{ github.run_id }} against ${{ github.event.repository.default_branch }}.
          title: "chore(marketing): update marketing visuals"
          body: |
            ## 📸 Automatic marketing visuals update

            The `npm run marketing` pipeline produced screenshots/videos that
            differ from what's currently committed on
            `${{ github.event.repository.default_branch }}`.

            - 🚀 **Triggered by**: workflow run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - 📦 **Paths**: `playwright/artifacts/screenshots/`, `playwright/artifacts/videos/`

            Review the diff (or download the run's `marketing-visuals-*`
            artifact) before merging.
