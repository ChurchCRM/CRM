name: "Marketing: generate and publish"

# Manually run the marketing screenshot/video pipeline (npm run marketing)
# end-to-end against a chosen branch — installs its own PHP/Composer and
# Playwright dependencies rather than assuming they're already present
# (see the "why self-contained" note in npm's "marketing" script), builds
# the CI docker stack, captures every screenshot/video, and verifies every
# capture the pipeline claims to have produced is actually a real,
# non-empty file (npm run marketing:check).
#
# playwright/artifacts/screenshots/ and playwright/artifacts/videos/ are
# committed to the repo, so what happens next depends on which ref this
# runs against:
#   - On the default branch (master): if the freshly generated visuals
#     differ from the committed ones, they're pushed to a branch and a PR
#     is opened so a human can review/merge the update.
#   - On any other branch: if the freshly generated visuals differ from
#     what's committed on that branch, the job fails — the branch's
#     checked-in visuals are stale and need regenerating/committing.
# Either way the generated visuals are uploaded as a run artifact so they
# can be reviewed without checking the branch out locally.
#
# Three stages, each its own job so a failure (and its logs) is scoped to
# exactly one part of the pipeline in the Actions UI:
#   1. setup    — install the toolchain (Node/PHP/Composer/Playwright
#                 browser) and warm the caches the next stage restores.
#                 Fails fast, before spending time on the docker/Playwright
#                 run, if the environment itself is broken.
#   2. test     — the actual `npm run marketing` run against a fresh CI
#                 docker stack, plus the stale/changed check.
#   3. create-pr — only runs on the default branch when stage 2 found
#                  changes; opens the update PR from exactly those files.
# Jobs run on separate, fresh runners, so stage 2 repeats stage 1's
# install steps rather than reusing its filesystem — the actions/cache and
# actions/setup-node caches stage 1 warms make that repeat close to free.
#
# Trigger this from the Actions tab: pick the branch, click "Run workflow".

on:
  workflow_dispatch:

concurrency:
  group: marketing-visuals-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: "1 — System setup"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mysqli, gd, zip, gettext, iconv, mbstring, xml, curl, fileinfo, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          cd src
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npm run marketing:install

  test:
    name: "2 — Run marketing pipeline"
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mysqli, gd, zip, gettext, iconv, mbstring, xml, curl, fileinfo, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          cd src
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npm run marketing:install

      - name: Run marketing pipeline end-to-end
        run: npm run marketing

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yaml -f docker/docker-compose.parallel.yaml --profile ci-new-system logs --no-color || true

      - name: Tear down Docker stack
        if: always()
        run: npm run docker:ci:new-system:down

      # npm run marketing starts with `rm -rf playwright/artifacts/`, so by
      # this point the working tree holds freshly generated visuals while
      # git's index/HEAD still holds whatever was last committed on this
      # ref — `git add` + `git diff --cached` is exactly the delta between
      # the two.
      - name: Detect changes to committed marketing visuals and manifest
        id: changes
        run: |
          git add -A -- playwright/artifacts/screenshots playwright/artifacts/videos playwright/artifacts/manifest.json
          if git diff --cached --quiet -- playwright/artifacts/screenshots playwright/artifacts/videos playwright/artifacts/manifest.json; then
            echo "Committed marketing visuals and manifest are up to date."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Committed marketing visuals and manifest are out of date. Changed files:"
            git diff --cached --stat -- playwright/artifacts/screenshots playwright/artifacts/videos playwright/artifacts/manifest.json
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail — branch visuals are stale
        if: github.ref_name != github.event.repository.default_branch && steps.changes.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Marketing visuals and manifest committed on '$BRANCH_NAME' are out of date with the current code. Run 'npm run marketing' locally and commit the updated files under playwright/artifacts/screenshots, playwright/artifacts/videos, and playwright/artifacts/manifest.json."
          exit 1

      # Stage 3 runs on a separate, fresh runner with no access to this
      # job's working tree, so hand it exactly the changed files it needs
      # to open the PR — packaged as one archive to keep the up/download
      # step (and the actions/upload-artifact path-flattening it would
      # otherwise do with two directory inputs) simple.
      - name: Package updated visuals and manifest for the PR-create stage
        if: github.ref_name == github.event.repository.default_branch && steps.changes.outputs.has_changes == 'true'
        run: tar -czf visuals-update.tar.gz playwright/artifacts/screenshots playwright/artifacts/videos playwright/artifacts/manifest.json

      - name: Upload updated visuals for PR creation
        if: github.ref_name == github.event.repository.default_branch && steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visuals-update-${{ github.run_id }}
          path: visuals-update.tar.gz
          retention-days: 1

      - name: Upload marketing visuals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marketing-visuals-${{ github.run_id }}
          path: |
            playwright/artifacts/
            playwright/.playwright-output/
          # playwright/.playwright-output/ is a dot-directory, and
          # actions/upload-artifact silently drops dotfiles/dot-dirs unless
          # told otherwise — without this, failure screenshots/videos/traces
          # never make it into the uploaded artifact.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  create-pr:
    name: "3 — Open visuals-update PR"
    needs: test
    if: github.ref_name == github.event.repository.default_branch && needs.test.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download updated visuals
        uses: actions/download-artifact@v8.0.1
        with:
          name: visuals-update-${{ github.run_id }}

      - name: Extract updated visuals into the working tree
        run: tar -xzf visuals-update.tar.gz

      - name: Configure git for automated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Pull Request with updated visuals
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: marketing/update-visuals
          delete-branch: true
          add-paths: |
            playwright/artifacts/screenshots
            playwright/artifacts/videos
            playwright/artifacts/manifest.json
          commit-message: |
            chore(marketing): update marketing visuals

            Regenerated by the marketing-visuals-check workflow run
            ${{ github.run_id }} against ${{ github.event.repository.default_branch }}.
          title: "chore(marketing): update marketing visuals"
          body: |
            ## 📸 Automatic marketing visuals update

            The `npm run marketing` pipeline produced screenshots/videos that
            differ from what's currently committed on
            `${{ github.event.repository.default_branch }}`.

            - 🚀 **Triggered by**: workflow run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - 📦 **Paths**: `playwright/artifacts/screenshots/`, `playwright/artifacts/videos/`

            Review the diff (or download the run's `marketing-visuals-*`
            artifact) before merging.
