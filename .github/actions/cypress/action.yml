name: 'Cypress run'
description: 'Single SHA pin for cypress-io/github-action. Run actions/checkout and checkout-node-npm first.'

inputs:
  command:
    description: 'Command to run Cypress'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
      with:
        command: ${{ inputs.command }}
