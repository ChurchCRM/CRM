name: 'Download artifact'
description: 'Single SHA pin for actions/download-artifact. Run actions/checkout first.'

inputs:
  name:
    description: 'Artifact name'
    required: false
    default: ''
  pattern:
    description: 'Glob of artifact names (instead of name)'
    required: false
    default: ''
  path:
    description: 'Destination path'
    required: false
    default: ''
  merge-multiple:
    description: 'Merge pattern matches into one directory'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
