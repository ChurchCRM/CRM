name: 'Node.js + npm install'
description: 'Setup Node.js from .nvmrc, cache npm, run npm ci. Run actions/checkout before this action.'

inputs:
  cache-cypress:
    description: 'Also cache Cypress binary'
    required: false
    default: 'false'

outputs:
  node-version:
    description: 'Node version installed'
    value: ${{ steps.setup-node.outputs.node-version }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      id: setup-node
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Cache Cypress (optional)
      if: ${{ inputs.cache-cypress == 'true' }}
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: ${{ runner.os }}-cypress-${{ hashFiles('**/package-lock.json') }}
        restore-keys: ${{ runner.os }}-cypress-

    - name: Install npm dependencies
      run: npm ci
      shell: bash
