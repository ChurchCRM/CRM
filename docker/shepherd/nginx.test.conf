server {
    listen 80;
    resolver 127.0.0.11 ipv6=off;
    location / {
        set $app app:8080;
        proxy_pass http://$app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
    }
    location /_preview-mail/ {
        set $mail mailpit:8025;
        rewrite ^/_preview-mail/(.*) /$1 break;
        proxy_pass http://$mail;
    }
}
