services:
  database:
    profiles: [test, ci]
    image: mariadb:10.11
    ports:
      - ${DOCKER_BIND_ADDRESS:-127.0.0.1}:${DATABASE_PORT:-3306}:3306
    env_file:
      - .env
    volumes:
      - ../src/mysql/install/Install.sql:/docker-entrypoint-initdb.d/00-install.sql:ro
      - ../cypress/data/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    hostname: crm-database
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 20s
      retries: 10

  mailserver:
    # Also part of the CI profiles: the seeded SMTP host is mailserver:1025, so without it
    # every send in CI fails and nothing can assert delivery. Specs read the sink at :8025.
    # The marketing captures (ci-new-system) read member sign-in codes from it.
    profiles: [test, ci-root, ci-subdir, ci-new-system]
    image: axllent/mailpit:v1
    environment:
      # Lets a spec make the SMTP server refuse mail (PUT /api/v1/chaos); off until a spec asks.
      MP_ENABLE_CHAOS: "true"
    ports:
      - ${DOCKER_BIND_ADDRESS:-127.0.0.1}:${MAILSERVER_PORT:-1025}:1025
      - ${DOCKER_BIND_ADDRESS:-127.0.0.1}:${MAILSERVER_GUI_PORT:-8025}:8025
    hostname: crm-mailserver

  webserver:
    profiles: [test, ci]
    build:
      context: .
      dockerfile: Dockerfile.churchcrm-apache-php8
      target: test
    image: churchcrm/crm:php8-debian
    ports:
      - ${DOCKER_BIND_ADDRESS:-127.0.0.1}:${WEBSERVER_PORT:-80}:80
    volumes:
      - ../src:/var/www/html
      - ..:/home/ChurchCRM
      - ../cypress/data/images/people:/var/www/html/Images/Person
      - ../cypress/data/images/family:/var/www/html/Images/Family
    hostname: crm-webserver
    env_file:
      - .env
    environment:
      CHURCHCRM_PLUGIN_FIXTURES: /home/ChurchCRM/cypress/fixtures/plugin-registry
    depends_on:
      database:
        condition: service_healthy
