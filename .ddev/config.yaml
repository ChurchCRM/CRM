name: churchcrm
type: php
docroot: src
php_version: "8.4"
webserver_type: apache-fpm
database:
  type: mariadb
  version: "10.11"
nodejs_version: "24"
ddev_version_constraint: ">= v1.24.8"
fail_on_hook_fail: true

use_dns_when_possible: true

# Environment variables available in the web container
web_environment:
  - COMPOSER_ALLOW_SUPERUSER=1
  - NODE_ENV=development

# Hooks run automatically after `ddev start`
hooks:
  post-start:
    # Always select the DDEV database and URL configuration.
    - exec: "cp /var/www/html/.ddev/Config.ddev.php /var/www/html/src/Include/Config.php"
    # DDEV maps the project owner into the web container; world-writable permissions are unnecessary.
    - exec: "mkdir -p /var/www/html/src/logs"
    # Install PHP (Composer) dependencies if not already present
    - exec: "[ -f /var/www/html/src/vendor/autoload.php ] || (cd /var/www/html/src && composer install --no-interaction --prefer-dist)"
    # Import demo database on first start (when the database has no tables yet)
    - exec: "mysql -udb -pdb -hdb db -e 'SHOW TABLES' | grep -q . && echo 'Database already populated.' || (echo 'Importing ChurchCRM demo database...' && mysql -udb -pdb -hdb db < /var/www/html/cypress/data/seed.sql && echo 'Demo database imported.')"
