# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Single review system for ChurchCRM/CRM.
# Hard blockers fail a pre-merge check (reviews.pre_merge_checks, mode: error),
# and request_changes_workflow turns that into a blocking review. Humans merge.
# request_changes_workflow also lets CodeRabbit approve once it is clean, so
# branch protection must still require a human (CODEOWNERS) approval.
#
# Disable the Docker AI Factory reviewer separately (GitHub App / webhook at
# ai-factory.docker.team). It is not a workflow in this repo. It posts as
# DawoudIO with the "pr-reviewer bot" banner and a link to ai-factory.docker.team.

language: en-US
early_access: false

tone_instructions: >-
  Concise. Hard blocks only: security, authz, data leak, upgrade breakage,
  missing tests, unwrapped strings, Query View work, date/money contract. No nits.
  Never post nitpick or trivial-severity comments.

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    If the PR adds or changes user-visible behavior (a new or changed screen,
    setting, menu item, report, or workflow), end the summary with a short,
    non-blocking "Docs and screenshots after merge" note. It says the docs PR
    (ChurchCRM/docs.churchcrm.io, held for the release) and the screenshots or
    video for docs, blog and marketing still need a follow-up PR, and lists which
    of those this PR already carries and which still need a tracking issue.
    Skip the note for bug-fix, security, CI, locale, dependency, and
    refactor-only PRs. Never treat it as a hard block.
  poem: false
  sequence_diagrams: false
  collapse_walkthrough: true
  # No "reviewing…" fortune, progress check, or skipped-review chatter.
  in_progress_fortune: false
  review_progress: false
  review_status: false
  review_details: true
  commit_status: true
  fail_commit_status: true
  changed_files_summary: true
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  related_issues: true
  related_prs: true
  assess_linked_issues: true
  enable_prompt_for_ai_agents: true
  pre_merge_checks:
    override_requested_reviewers_only: true
    title:
      mode: warning
      requirements: Imperative subject under 72 characters.
    issue_assessment:
      mode: warning
    docstrings:
      mode: "off"
    custom_checks:
      - name: Authorization and data exposure
        mode: error
        instructions: |
          Fail if a new or changed PHP route, API endpoint, controller, or query
          returns or mutates person, family, finance, or admin data without an
          explicit authorization check (role middleware or permission test), or if a
          non-Finance user can read finance fields. Pass if no such PHP code changed.
          A web-server config (Caddyfile, nginx, Apache) that only forwards an
          existing URL prefix to an existing front controller is not a new route.
          Do not fail it for authorization the PHP app already applies, and do not
          ask for new role middleware on that app.
      - name: UI validation recorded
        mode: error
        instructions: |
          Applies only when the PR changes UI: files under src/skin/, webpack/, or
          a Twig or PHP view that renders HTML. Fail if the PR description does not
          state that the changed pages were checked in light and dark themes at
          desktop, tablet (about 820px) and phone width. Pass for PRs that change
          no UI. Read the description only; do not post this as an inline comment.
      - name: Schema upgrade safety
        mode: error
        instructions: |
          Fail if the Propel schema or src/mysql/install SQL changes without a
          matching script in src/mysql/upgrade/ and an upgrade.json entry, or if a
          new column is NOT NULL without a default. Pass if no schema changed.
      - name: Tests for behavior changes
        mode: error
        instructions: |
          Fail if the PR fixes a bug or changes user-visible behavior under src/ or
          webpack/ without adding or updating a spec in cypress/. Pass when the PR
          description names an existing spec that already exercises the changed
          path, and that spec exists in the repository. Pass for CI, docs,
          tooling, locale, dependency, and refactor-only PRs.
          Pass when every application change is the unsupported FrankenPHP example:
          docker/examples/frankenphp/**, docker/Dockerfile.churchcrm-frankenphp,
          and tests or package.json scripts that only check that example. No image
          is published and Cypress runs on Apache, so it cannot execute the
          Caddyfile. A Node (or other) test of the Caddyfile routes, static
          fallback, and denial order is enough. Do not ask for a Cypress spec.
      - name: No Query View expansion
        mode: error
        instructions: |
          Fail if the PR modifies QueryView.php or QueryList.php, or adds query_qry
          rows. New reports belong in src/v2/ or a plugin.
      - name: Injection and escaping
        mode: error
        instructions: |
          Fail if the PR adds RunQuery() or raw SQL in application code, concatenates
          request input into a query, or prints request or database values into HTML
          or script without InputUtils escaping. SQL under src/mysql/ (install and
          upgrade scripts) and cypress/ (seed data and cy.dbQuery test fixtures) does
          not count.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    base_branches:
      - ".*"
    # Locale sync PRs only. Dependabot bumps are reviewed (#10330 was skipped).
    ignore_usernames:
      - "github-actions[bot]"
    labels:
      - "!Localization"

  # Excludes must not be the only files in a real PR. Lockfiles, vendored skin
  # libs, and Playwright specs are the diff on dependency and test PRs.
  path_filters:
    - "!locale/**"
    - "!**/messages.po"
    - "!**/vendor/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/*.min.js"
    - "!playwright/**/*.png"
    - "!**/*.png"
    - "!**/*.jpg"

  path_instructions:
    - path: "**/*"
      instructions: |
        Report only hard blocks. Do not post nitpicks, trivial or optional suggestions,
        or "add more cases" comments on a test that already exercises the behavior.
        If a finding is not a hard block, omit it. That includes findings you would
        label Minor, Quick win or preventive. Do not ask to broaden a lint rule,
        validator or regex beyond a case that exists in the repository.
        Apply maintainer-review-gates.md and docs/contributing/issue-readiness.md. Review issue/PR scope and linked work by evidence; hard blocks only.
        Do not ask for locale:build or messages.po.
        Do not post the light/dark and tablet/phone UI pass as an inline comment; the
        "UI validation recorded" pre-merge check reads the PR description for it.
    - path: "**/*.{lock,json}"
      instructions: |
        Dependency bump. Read release notes for breaking changes, security fixes,
        and behavior ChurchCRM tests. Do not nitpick lockfile formatting.
    - path: "src/**/*.php"
      instructions: |
        PHP 8.4. Propel ORM only — flag new RunQuery() or raw SQL.
        Escape with InputUtils. Redirect with RedirectUtils, not header().
        API errors use SlimUtils::renderErrorJSON(). Authz on protected routes.
        Services hold business logic. No new Query View features
        (QueryView.php, QueryList.php, query_qry).
        Schema changes need src/mysql/upgrade/ plus upgrade.json; new columns nullable or defaulted.
        User-visible strings in gettext(). Do not ask for locale:build.
        Dates stored as ISO or naive sTimeZone wall-clock, never parsed with sDateFormat.
    - path: "src/skin/**/*.{js,php}"
      instructions: |
        Tabler + Bootstrap 5 (ms-/me-, data-bs-*, btn-close). No Bootstrap 4 leftovers.
        No alert()/confirm() — window.CRM.notify() or a Bootstrap modal.
        Page logic belongs in a webpack/ entry, not a new inline script block.
        Asset paths use SystemURLs::getRootPath(). UI strings in gettext() or i18next.t().
    - path: "webpack/**/*.{js,ts,tsx}"
      instructions: |
        Web bundle. Match biome.json. No console.log, var, or any.
        UI strings via i18next.t(). No inline PHP in generated output.
    - path: "**/*.{js,ts,tsx,css,scss}"
      instructions: |
        Web only. Bootstrap 5 / Tabler utilities. No new jQuery where a webpack entry exists.
        Do not flag Bootstrap 5 class names.
    - path: "cypress/**/*.{js,ts}"
      instructions: |
        No .only or .skip. Do not put optional demo values in Cypress seed.
        A feature or bug fix needs a spec when that is the project pattern.
    - path: "cypress/data/seed.sql"
      instructions: |
        Test data only; the schema comes from src/mysql/install/Install.sql. Do not ask
        for CREATE TABLE here. Inserts name their columns. The ALTER TABLE ... AUTO_INCREMENT
        lines are deliberate: family_custom and person_custom hold rows past the last id.
    - path: "cypress/e2e/**/*.{js,ts}"
      instructions: |
        A spec deletes what it creates, in after(), through the API. No literal ids of
        seeded people or families where a name lookup works. A deposit that was closed
        must be reopened before it can be deleted.
    - path: "docker/examples/frankenphp/**"
      instructions: |
        Unsupported example. No published image and no CI job runs FrankenPHP.
        Do not ask for Cypress, a Docker test stack, or new PHP authorization
        on an existing front controller. A committed check of the Caddyfile
        (routes, static fallback, denial order) is the required test.
    - path: "docker/Dockerfile.churchcrm-frankenphp"
      instructions: |
        Unsupported example. No published image and no CI job runs FrankenPHP.
        Do not ask for Cypress or a Docker test stack.
    - path: ".github/workflows/**"
      instructions: |
        Pin actions to a commit SHA. No model/LLM calls from Actions.
        pull_request_target must not checkout or execute the PR head.
        Untrusted context (head_ref, titles, bodies, branch names) goes through env:,
        never into a run: script. A changed job graph, ref, or failure path needs an
        assertion in scripts/*.test.js; scripts/validate-pr-gates.js checks the first
        locally.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false

  tools:
    # Web: repo lints with Biome (biome.json). No ESLint config.
    biome:
      enabled: true
    eslint:
      enabled: false
    # PHP: no phpstan.neon with paths:, so PHPStan cannot run. PHPMD needs no config.
    phpstan:
      enabled: false
    phpmd:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - files: ".agents/skills/churchcrm/maintainer-review-gates.md"
        applyTo: "**/*"
      - files: ".agents/skills/churchcrm/pr-review.md"
        applyTo: "**/*"
      - files: ".agents/skills/churchcrm/code-standards.md"
        applyTo: "**/*.{php,js,ts}"
      - files: ".agents/skills/churchcrm/security-best-practices.md"
        applyTo: "**/*.{php,js}"
      - files: ".agents/skills/churchcrm/authorization-security.md"
        applyTo: "**/*.php"
      - files: ".agents/skills/churchcrm/frontend-development.md"
        applyTo: "**/*.{js,php,css,scss}"
      - files: ".agents/skills/churchcrm/webpack-typescript.md"
        applyTo: "webpack/**/*.{js,ts,tsx}"
      - files: ".agents/skills/churchcrm/i18n-localization.md"
        applyTo: "**/*.{php,js,ts}"
      - files: ".agents/skills/churchcrm/timezone-handling.md"
        applyTo: "**/*.{php,js,ts}"
      - files: ".agents/skills/churchcrm/cypress-testing.md"
        applyTo: "cypress/**/*.{js,ts}"
      - files: ".agents/skills/churchcrm/ci-test-infrastructure.md"
        applyTo: "{cypress/data/**,cypress/configs/**,scripts/**,.github/workflows/**,docker/**}"
      - files: ".agents/skills/churchcrm/db-schema-migration.md"
        applyTo: "{orm/**,src/mysql/**,cypress/data/**}"
      - files: "CLAUDE.md"
        applyTo: "**/*"

chat:
  auto_reply: true
