  '/ministries/schedules/{scheduleId}/generate':
    post:
      tags:
        - Volunteer
      summary: "Materialise this schedule's occurrences up to a date"
      description: "Idempotent. Attaches one occurrence to each active event the schedule follows (by type, class, ministry or the one event) inside the window, from today up to the scheduling horizon (D31; a Staff this event schedule is not capped by it). No calendar event is ever created or changed. `requirements[].defaults` (D32, D35) is saved on the schedule's staffing needs first — per position, the whole list in the order they are assigned, an empty list clearing it, a position left out keeping its own; the counts are not changed — and then every saved default is assigned, in that order, on the occurrences THIS run creates (never on ones an earlier run made), while its person holds an active qualification; with accepted=true they are recorded as having accepted and are not asked to respond. Without `requirements` the saved ones are assigned unchanged. The old `defaults` key is refused (400)."
      operationId: generateVolunteerOccurrences
      parameters:
        -
          name: scheduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                through:
                  description: "Defaults to, and may not go past, today plus the scheduling horizon (iVolunteerSchedulingHorizonWeeks); the schedule's last date caps it too"
                  type: string
                  format: date
                  nullable: true
                requirements:
                  type: array
                  items: { required: [positionId], properties: { positionId: { description: "A position this schedule's staffing needs ask for", type: integer }, defaults: { description: "The position's default volunteers in the order they are assigned; at most its Max (its Min when Max is blank), and never more than 50", type: array, items: { required: [personId], properties: { personId: { type: integer }, accepted: { description: 'Left out: the stored flag, false for a new default', type: boolean } }, type: object } } }, type: object }
              type: object
      responses:
        '400':
          description: "Malformed date, the run would exceed the occurrence cap, the old defaults key, a position this schedule's staffing needs do not ask for, a person named twice, or more defaults than the position's Max"
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this schedule, a new default is not qualified, or V2 is not enabled'
        '404':
          description: 'No such schedule, or a default names an unknown person'
        '409':
          description: 'The schedule is inactive: reactivate it first'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  created: { type: integer }
                  existing: { type: integer }
                  from: { description: 'First date looked at: the later of today and the window start; after through when the window has ended or not started', type: string, format: date }
                  through: { type: string, format: date }
                  assigned: { description: 'Default assignments written', type: integer }
                  skipped: { description: 'Default assignments the assignment rules refused on one occurrence (over, cancelled, no room)', type: integer }
                  unqualified: { description: 'Default assignments left open because the default no longer holds an active qualification (D32)', type: integer }
                  noEvents: { description: 'No event at all was found between from and through (D30)', type: boolean }
                  searched: { description: 'What the schedule looks for, with names (D30)', properties: { linkMode: { type: string, enum: [event_type, class, ministry, event] }, groupId: { type: integer, nullable: true }, groupName: { type: string, nullable: true }, eventTypeId: { type: integer, nullable: true }, eventTypeName: { type: string, nullable: true }, titleFilter: { type: string, nullable: true }, ministryId: { type: integer }, ministryName: { type: string, nullable: true }, eventId: { type: integer, nullable: true }, eventTitle: { type: string, nullable: true } }, type: object }
                type: object
      security:
        -
          ApiKeyAuth: []
