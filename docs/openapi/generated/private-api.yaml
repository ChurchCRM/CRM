        '400':
          description: 'Refused — core plugin or invalid id'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
        '500':
          description: 'Failed to uninstall'
      security:
        -
          ApiKeyAuth: []
  '/plugins/api/plugins/{pluginId}/enable':
    post:
      tags:
        - Plugins
      summary: 'Enable a plugin'
      operationId: enablePlugin
      parameters:
        -
          name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Plugin enabled'
        '400':
          description: 'Plugin cannot be enabled (dependency or version issue)'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
        '500':
          description: 'Error enabling plugin'
      security:
        -
          ApiKeyAuth: []
  '/plugins/api/plugins/{pluginId}/disable':
    post:
      tags:
        - Plugins
      summary: 'Disable a plugin'
      operationId: disablePlugin
      parameters:
        -
          name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Plugin disabled'
        '400':
          description: 'Plugin cannot be disabled (other plugins depend on it)'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
        '500':
          description: 'Error disabling plugin'
      security:
        -
          ApiKeyAuth: []
  '/plugins/api/plugins/{pluginId}/settings':
    post:
      tags:
        - Plugins
      summary: 'Update plugin settings'
      operationId: updatePluginSettings
      parameters:
        -
          name: pluginId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                settings:
                  description: 'Key-value map of settings to update'
                  type: object
              type: object
      responses:
        '200':
          description: 'Settings updated'
        '400':
          description: 'No settings provided or plugin not found'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
        '404':
          description: 'Plugin not found'
      security:
        -
          ApiKeyAuth: []
  '/plugins/api/plugins/{pluginId}/test':
    post:
      tags:
        - Plugins
      summary: 'Test plugin connection with provided settings'
      description: 'Password fields may be omitted — the plugin falls back to its saved value.'
      operationId: testPluginConnection
      parameters:
        -
          name: pluginId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                settings:
                  description: 'Settings to test with (partial override)'
                  type: object
              type: object
      responses:
        '200':
          description: 'Connection successful'
        '400':
          description: 'Connection test failed'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
        '404':
          description: 'Plugin not found or not active'
      security:
        -
          ApiKeyAuth: []
  '/plugins/api/plugins/{pluginId}/reset':
    post:
      tags:
        - Plugins
      summary: 'Reset all settings for a plugin'
      operationId: resetPluginSettings
      parameters:
        -
          name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Settings reset'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
        '404':
          description: 'Plugin not found'
      security:
        -
          ApiKeyAuth: []
  /plugins/api/approved:
    get:
      tags:
        - Plugins
      summary: 'List community plugins approved for URL install'
      description: 'Returns the entries from src/plugins/approved-plugins.json. Only plugins in this list can be installed by URL.'
      operationId: listApprovedPlugins
      responses:
        '200':
          description: 'Approved plugin list'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
      security:
        -
          ApiKeyAuth: []
  /plugins/api/plugins/install:
    post:
      tags:
        - Plugins
      summary: 'Install a community plugin from an approved download URL'
      description: 'Downloads the zip, verifies its SHA-256 against approved-plugins.json, validates the archive, and extracts it into src/plugins/community/{id}. The plugin is NOT enabled automatically — admins must review and click Enable.'
      operationId: installPluginFromUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                downloadUrl:
                  description: 'HTTPS URL to the plugin zip. Must match an approved entry exactly.'
                  type: string
              type: object
      responses:
        '200':
          description: 'Plugin installed (not yet enabled)'
        '400':
          description: 'Validation failure (unknown URL, checksum mismatch, unsafe zip)'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
        '409':
          description: 'Plugin already installed'
        '500':
          description: 'Install failed'
      security:
        -
          ApiKeyAuth: []
  /plugins/api/plugins/install-url:
    post:
      tags:
        - Plugins
      summary: 'Install a community plugin from an arbitrary URL (unverified)'
      description: 'Installs a plugin from a URL that is NOT on the approved list. The admin must supply the expected SHA-256 themselves. The plugin is flagged as unverified and the admin UI shows a warning banner before it can be enabled. Intended for plugin developers testing their own builds and for admins running experimental plugins.'
      operationId: installPluginFromUnverifiedUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                downloadUrl:
                  description: 'HTTPS URL to the plugin zip'
                  type: string
                sha256:
                  description: '64-hex SHA-256 of the zip bytes'
                  type: string
                pluginId:
                  description: 'Expected plugin id (kebab-case, must match top-level directory)'
                  type: string
              type: object
      responses:
        '200':
          description: 'Plugin installed (unverified, not yet enabled)'
        '400':
          description: 'Validation failure'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
        '409':
          description: 'Plugin already installed'
      security:
        -
          ApiKeyAuth: []
  '/plugins/api/plugins/{pluginId}/quarantine':
    delete:
      tags:
        - Plugins
      summary: "Clear a plugin's quarantine flag"
      description: 'Removes the quarantine flag from a plugin so it can be enabled again. Use after the underlying issue (crash, revoked registry entry, etc.) has been resolved.'
      operationId: clearPluginQuarantine
      parameters:
        -
          name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Quarantine cleared'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
      security:
        -
          ApiKeyAuth: []
  /plugins/api/registry/refresh:
    post:
      tags:
        - Plugins
      summary: 'Re-fetch the remote approved-plugin registry'
      description: 'Pulls the latest approved-plugins.json from the remote source and updates the session cache. Returns the merged list immediately so the UI can refresh without a page reload.'
      operationId: refreshPluginRegistry
      responses:
        '200':
          description: 'Registry refreshed — returns current approved list'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden — Admin role required'
        '500':
          description: 'Refresh failed'
      security:
        -
          ApiKeyAuth: []
components:
  schemas:
    PortalCalendarSubscription:
      properties:
        title:
          description: 'The name a calendar app shows for the feed'
          type: string
          example: 'Main St. Cathedral Calendar'
        url:
          type: string
          example: 'https://church.example/api/public/portal-calendar/ab12…/calendar.ics'
          nullable: true
        webcalUrl:
          type: string
          example: 'webcal://church.example/api/public/portal-calendar/ab12…/calendar.ics'
          nullable: true
        choices:
          type: array
          items:
            properties:
              id:
                type: string
                example: 'calendar:3'
              name:
                type: string
                example: 'Public Calendar'
              color:
                type: string
                example: '#2c3e50'
              selected:
                type: boolean
            type: object
      type: object
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: 'API key obtained from Profile → API Key in ChurchCRM, or via POST /public/user/login'
      name: x-api-key
      in: header
