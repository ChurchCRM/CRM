        '404':
          description: 'No such occurrence'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  '/ministries/requirements/{requirementId}':
    delete:
      tags:
        - Volunteer
      summary: 'Remove a staffing requirement'
      operationId: deleteVolunteerRequirement
      parameters:
        -
          name: requirementId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: "Not authorized for this requirement's schedule, or V2 is not enabled"
        '404':
          description: 'No such requirement'
        '200':
          description: Deleted
      security:
        -
          ApiKeyAuth: []
  /ministries/occurrences:
    get:
      tags:
        - Volunteer
      summary: 'List occurrences inside a date window, scoped to the caller'
      description: '`from` and `to` are mandatory (design M9: no pagination protocol is invented for one module) and the result set is hard-capped.'
      operationId: listVolunteerOccurrences
      parameters:
        -
          name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: ministryId
          in: query
          required: false
          schema:
            type: integer
        -
          name: teamId
          in: query
          description: 'Only the occurrences whose schedule belongs to this team.'
          required: false
          schema:
            type: integer
        -
          name: text
          in: query
          description: "Case-insensitive substring of the occurrence's schedule name or of its anchored event's title. The narrowing happens in the query; % and _ are escaped so they are matched literally rather than as LIKE wildcards."
          required: false
          schema:
            type: string
            maxLength: 100
        -
          name: hasGaps
          in: query
          description: 'Return only occurrences that are short of at least one required volunteer (#9709). The filter is applied AFTER the counts are derived, because a gap is derived and there is nothing in the occurrence table to filter on.'
          required: false
          schema:
            type: boolean
        -
          name: scheduleId
          in: query
          required: false
          schema:
            type: integer
        -
          name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - scheduled
              - cancelled
      responses:
        '400':
          description: 'Missing, malformed or inverted window'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Volunteer coordinator access is required, or V2 is not enabled'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  occurrences: { type: array, items: { properties: { requiredCount: { description: 'The summed minimums', type: integer }, requirementCount: { description: 'How many positions can take someone; 0 = no staffing needs set', type: integer }, liveCount: { type: integer }, gapCount: { description: 'The summed shortfall below each minimum', type: integer }, openCount: { description: 'The summed room left below each maximum', type: integer }, capacity: { description: 'D34: the summed maximums; a NULL MaxCount counts as its MinCount', type: integer }, pendingCount: { type: integer } }, type: object } }
                  limit: { type: integer }
                  capped: { type: boolean }
                type: object
      security:
        -
          ApiKeyAuth: []
  '/ministries/occurrences/{occurrenceId}':
    get:
      tags:
        - Volunteer
      summary: 'Read one occurrence with its effective times and effective requirements'
      description: "The reported start and end are the anchored calendar event's, moved by the schedule's offsets (null once the event was deleted); the requirements are the occurrence's own overrides merged over the schedule's templates."
      operationId: getVolunteerOccurrence
      parameters:
        -
          name: occurrenceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this occurrence, or V2 is not enabled'
        '404':
          description: 'No such occurrence'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  occurrence: { type: object }
                  requirements: { type: array, items: { type: object } }
                type: object
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Volunteer
      summary: 'Delete one occurrence and everything under it'
      description: "The Occurrences tab's Delete for dates that should not have been generated. Requirement overrides, assignments and their responses, swaps and queued notifications go with it. Scoped like every occurrence route: a coordinator of the ministry or a leader of the schedule's team. A deleted occurrence can be regenerated from its event; cancel it instead to keep the row. Deleting the only occurrence of a Staff this event schedule deletes that hidden schedule too."
      operationId: deleteVolunteerOccurrence
      parameters:
        -
          name: occurrenceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not in scope, or V2 is not enabled'
        '404':
          description: 'No such occurrence'
        '200':
          description: Deleted
      security:
        -
          ApiKeyAuth: []
  '/ministries/occurrences/{occurrenceId}/status':
    post:
      tags:
        - Volunteer
      summary: 'Cancel or restore one occurrence without touching its schedule'
      description: 'Cancelling is not deleting: the row survives so a later generation run does not recreate it.'
      operationId: setVolunteerOccurrenceStatus
      parameters:
        -
          name: occurrenceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [scheduled, cancelled]
              type: object
      responses:
        '400':
          description: 'Unknown status'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this occurrence, or V2 is not enabled'
        '404':
          description: 'No such occurrence'
        '200':
          description: Updated
      security:
        -
          ApiKeyAuth: []
  /ministries/event-series:
    get:
      tags:
        - Volunteer
      summary: 'The event titles a schedule may be narrowed to'
      description: 'The distinct titles of the active events of one event type (event_type mode) or owned by one ministry (ministry mode) from a date (default today) onward, with the next date and how many there are. The schedule dialog offers these so a schedule follows ONE series rather than every event of a type.'
      operationId: listVolunteerEventSeries
      parameters:
        -
          name: eventTypeId
          in: query
          description: 'One of eventTypeId and ministryId is required'
          required: false
          schema:
            type: integer
        -
          name: ministryId
          in: query
          required: false
          schema:
            type: integer
        -
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '400':
          description: 'Neither eventTypeId nor ministryId given'
        '401':
          description: 'Not authenticated'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  series: { type: array, items: { properties: { title: { type: string }, nextStart: { type: string }, count: { type: integer } }, type: object } }
                type: object
      security:
        -
          ApiKeyAuth: []
  /ministries/event-types:
    get:
      tags:
        - Volunteer
      summary: 'The active calendar event types a schedule may follow'
      description: "Served on the ministries surface because a portal team leader (a self-service login) cannot reach /api/events/types. defaultEventTypeId is the type a ministry's new event starts with (D31): the one Admin → Ministry Settings names, else the type named Other, else null."
      operationId: listVolunteerEventTypes
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'No ministry or team to manage, or V2 is not enabled'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  eventTypes: { type: array, items: { properties: { id: { type: integer }, name: { type: string } }, type: object } }
                  defaultEventTypeId: { type: integer, nullable: true }
                type: object
      security:
        -
          ApiKeyAuth: []
  /ministries/classes:
    get:
      tags:
        - Volunteer
      summary: 'The groups a class schedule may follow'
      description: "Every active Sunday School class (group type 4), and any other group that has an upcoming active event linked to it, alphabetically, with how many upcoming events are linked and the next one's start."
      operationId: listVolunteerClasses
      parameters:
        -
          name: from
          in: query
          description: 'Counts events from this date; default today'
          required: false
          schema:
            type: string
            format: date
      responses:
        '401':
          description: 'Not authenticated'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  classes: { type: array, items: { properties: { groupId: { type: integer }, name: { type: string }, sundaySchool: { type: boolean }, upcomingCount: { type: integer }, nextStart: { type: string, nullable: true } }, type: object } }
                type: object
      security:
        -
          ApiKeyAuth: []
  /ministries/upcoming-events:
    get:
      tags:
        - Volunteer
      summary: 'Search upcoming calendar events to staff'
      description: "The Staff an event dialog's picker: active events from `from` (default today) up to `to`, whose title contains `q` (case-insensitive, % and _ literal), soonest first, at most 50. With `teamId`, each row says whether that team already has an occurrence anchored to the event."
      operationId: listVolunteerUpcomingEvents
      parameters:
        -
          name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        -
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: teamId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '400':
          description: 'A malformed date, or to before from'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'teamId names a team the caller does not manage, or V2 is not enabled'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  events: { type: array, items: { properties: { id: { type: integer }, title: { type: string }, start: { type: string }, end: { type: string }, eventTypeId: { type: integer }, eventTypeName: { type: string, nullable: true }, staffedByTeam: { type: boolean } }, type: object } }
                type: object
      security:
        -
          ApiKeyAuth: []
  /ministries/dashboard:
    get:
      tags:
        - Volunteer
      summary: 'Everything the coordinator dashboard needs, in one call'
      description: 'The S1 aggregate (design section 5.2): upcoming occurrences, the gaps that need filling, assignments still awaiting a reply, proposed substitutions, and the number of notifications that failed terminally. Scoped to the caller in the query (section 4.4) — a global manager sees every ministry, a coordinator their ministries, a team leader their teams. The scope block additionally names the ministries and teams the caller may navigate to, which is what gives a team-scope-only user an entry point.'
      operationId: getVolunteerDashboard
      parameters:
        -
          name: days
          in: query
          description: 'Window length in days, 1-365, default 28'
          required: false
          schema:
            type: integer
            maximum: 365
            minimum: 1
      responses:
        '400':
          description: 'The days parameter is not a number in the supported range'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not a volunteer coordinator, or V2 is not enabled'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  days: { type: integer }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  upcoming: { type: array, items: { type: object } }
                  gaps: { type: array, items: { type: object } }
                  pendingResponses: { type: array, items: { type: object } }
                  proposedSwaps: { type: array, items: { type: object } }
                  failedNotifications: { type: integer }
                  scope: { type: object }
                  capped: { type: boolean }
                type: object
      security:
        -
          ApiKeyAuth: []
  /ministries/me/assignments:
    get:
      tags:
        - Volunteer
      summary: 'My own volunteer commitments'
      description: 'The acting person comes from the session (AuthenticationManager::getCurrentUser()->getId(), which IS the person id). There is deliberately NO personId parameter - a personId in the query string is ignored, which is what makes substitution structurally impossible (design section 3.3.3). Upcoming only by default; includePast=1 adds what has already happened.'
      operationId: listMyVolunteerAssignments
      parameters:
        -
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: includePast
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'V2 is not enabled'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  '/ministries/me/assignments/{assignmentId}/respond':
    post:
      tags:
        - Volunteer
      summary: 'Accept or decline my own assignment'
      description: 'Idempotent (design section 2.12): responding with the status the assignment already has returns 200 with no second response row, so a double tap on a phone is harmless. A decline reopens the gap and enqueues a decline_alert for the coordinators (section 3.6) - which a coordinator-recorded decline on the other surface deliberately does not. Answering for someone else is 403, never 404.'
      operationId: respondToMyVolunteerAssignment
      parameters:
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - response
              properties:
                response:
                  type: string
                  enum: [accepted, declined]
                comment:
                  type: string
                  nullable: true
              type: object
      responses:
        '400':
          description: 'Not a valid response'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not my assignment, or V2 is not enabled'
        '404':
          description: 'No such assignment'
        '409':
          description: 'This assignment can no longer be answered'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  '/ministries/me/assignments/{assignmentId}/propose-substitute':
    post:
      tags:
        - Volunteer
      summary: 'Propose a substitute who has already agreed'
      description: 'The core of D13/UC2. personId here is the SUBSTITUTE, never the actor - the actor is the session. Eligibility is re-checked server-side whatever the UI offered: the substitute must hold an active qualification for the position (I2 applies to the replacement too) and must not already hold that position on that occurrence (I1). At most one proposal may be pending per assignment; a second is 409. The original assignment is not changed - only a substitute_proposed response row is appended.'
      operationId: proposeMyVolunteerSubstitute
      parameters:
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - personId
              properties:
                personId:
                  description: 'The substitute'
                  type: integer
                comment:
                  type: string
                  nullable: true
              type: object
      responses:
        '400':
          description: 'Proposing yourself'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not my assignment, the substitute is not qualified or already holds the position, or V2 is not enabled'
        '404':
          description: 'No such assignment or person'
        '409':
          description: 'A substitute is already proposed, or the assignment is no longer active'
        '201':
          description: Proposed
      security:
        -
          ApiKeyAuth: []
  '/ministries/me/swaps/{swapId}/withdraw':
    post:
      tags:
        - Volunteer
      summary: 'Withdraw my own pending substitution request'
      description: "Proposer only (design section 2.13) - a coordinator approves or rejects, never withdraws on someone's behalf, so even a coordinator gets 403 here. Appends a substitute_withdrawn response row and changes nothing else: the original assignment stays exactly as it was. 409 unless the request is still proposed."
      operationId: withdrawMyVolunteerSwap
      parameters:
        -
          name: swapId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                comment:
                  type: string
                  nullable: true
              type: object
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not the proposer, or V2 is not enabled'
        '404':
          description: 'No such substitution request'
        '409':
          description: 'Already decided'
        '200':
          description: Withdrawn
      security:
        -
          ApiKeyAuth: []
  /ministries/me/opportunities:
    get:
      tags:
        - Volunteer
      summary: 'Open slots I am qualified for and could sign up to right now'
      description: "Server-side eligibility, never the client's idea of it: the list is filtered to positions the SESSION person holds an active qualification for, on occurrences that are scheduled, not over, with capacity left. Pool membership is NOT tested - design D19 makes qualification the whole eligibility rule on this surface, and POST /me/signup applies exactly the same rule. Every row it returns is a row POST /me/signup would accept. There is no personId parameter (design section 3.3.3); one in the query string is ignored. Defaults to the next 90 days."
      operationId: listMyVolunteerOpportunities
      parameters:
        -
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '400':
          description: 'The window ends before it starts'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'V2 is not enabled'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  /ministries/me/signup:
    post:
      tags:
        - Volunteer
      summary: 'Put myself on an open slot'
      description: 'Creates an assignment for the SESSION person with status accepted and source self_signup - a volunteer who volunteered has already answered. Qualification AND capacity are re-validated server-side at signup time whatever the list offered: 403 when unqualified (I2), 409 when the requirement is already at MaxCount, when the occurrence is cancelled or past (I5), or when the person already holds that position (I1). A personId in the body names nobody: the actor is the session.'
      operationId: signUpForMyVolunteerOpportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - occurrenceId
                - positionId
              properties:
                occurrenceId:
                  type: integer
                positionId:
                  type: integer
              type: object
      responses:
        '400':
          description: 'Missing or mismatched ids'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not qualified, or V2 is not enabled'
        '404':
          description: 'No such occurrence or position'
        '409':
          description: 'Already full, already mine, cancelled or past'
        '201':
          description: 'Signed up'
      security:
        -
          ApiKeyAuth: []
  /ministries/me/qualifications:
    get:
      tags:
        - Volunteer
      summary: 'What I am qualified to do'
      description: 'Read-only, and read-only on purpose: volunteers cannot grant themselves anything, so there is no write counterpart on this surface. Scoped to the SESSION person - a personId in the query string is ignored (design section 3.3.3).'
      operationId: listMyVolunteerQualifications
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'V2 is not enabled'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  '/ministries/me/assignments/{assignmentId}/substitutes':
    get:
      tags:
        - Volunteer
      summary: 'Who I may offer as my substitute'
      description: "The picker behind section 5.6's Find a sub. Deliberately narrower than the coordinator's /eligible: it excludes the caller and anyone already holding this position on this occurrence - the exact two cases propose-substitute refuses - so the picker can never offer a name the server will then reject. 403, never 404, for someone else's assignment."
      operationId: listMyVolunteerSubstituteCandidates
      parameters:
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: integer
        -
          name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not my assignment, or V2 is not enabled'
        '404':
          description: 'No such assignment'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  /ministries/me/help-wanted:
    get:
      tags:
        - Volunteer
      summary: 'Ministries that are asking for help'
      description: "Every ACTIVE ministry that is advertising, alphabetically. A ministry advertises in either of two ways (design D19 as amended in round four): its own Help wanted switch is on, or it has at least one ACTIVE position with Recruit Volunteers on - either is enough. helpWantedText is the coordinator's own prose and may be empty; recruitingPositions names the positions being recruited for, ordered by team name and then by the position's own order, and is an empty array when there are none. Not filtered by qualification or by pool membership - the whole point of the section is to reach people the ministry does not know yet. inPool says whether the caller is already one of its volunteers, so the page can word the button's result correctly."
      operationId: listMyVolunteerHelpWanted
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'V2 is not enabled'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  ministries: { type: array, items: { type: object } }
                type: object
      security:
        -
          ApiKeyAuth: []
  '/ministries/me/help-wanted/{ministryId}':
    post:
      tags:
        - Volunteer
      summary: 'Tell a ministry you would like to help'
      description: "The acting person comes from the session; there is deliberately NO personId parameter (design section 3.3.3), so nobody can volunteer somebody else. Adds the caller to the ministry's volunteer pool Group if they are not already in it, then enqueues one help_offer message per coordinator per day - a second tap the same day sends nothing. Answers 403 only when the ministry is advertising in NEITHER way - no Help wanted switch and no active recruiting position - so a pool cannot be joined by guessing an id, while every ministry the help-wanted listing returns accepts the offer its rendered button makes."
      operationId: offerToHelpVolunteerMinistry
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'That ministry is not asking for help in either way, or V2 is not enabled'
        '404':
          description: 'No such ministry, or it has no pool group'
        '200':
          description: 'Thank you'
          content:
            application/json:
              schema:
                properties:
                  joinedPool: { description: 'true when this tap is what put them in the pool', type: boolean }
                  notified: { type: integer }
                type: object
      security:
        -
          ApiKeyAuth: []
  '/ministries/occurrences/{occurrenceId}/staffing':
    get:
      tags:
        - Volunteer
      summary: 'Requirements, live/gap counts and assignment rows for one occurrence'
      description: 'The workhorse coordinator read (design section 5.5). Requirements come from VolunteerScheduleService::getEffectiveRequirements(); the counts come from VolunteerAssignmentService::getGaps(), the single gap implementation. Assignments for a position that has no requirement are returned under otherAssignments rather than being hidden.'
      operationId: getVolunteerOccurrenceStaffing
      parameters:
        -
          name: occurrenceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this occurrence, or V2 is not enabled'
        '404':
          description: 'No such occurrence'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  '/ministries/occurrences/{occurrenceId}/eligible':
    get:
      tags:
        - Volunteer
      summary: 'Who may be assigned to a position on this occurrence'
      description: 'Actively qualified people, ordered by last served date ascending with never-served first - the rotation (design section 2.17). inPool reports pool membership rather than filtering on it, because an out-of-pool qualified person is assignable with the allowOutsidePool override. conflictPositionId names another position the person already holds on this occurrence (I7/D16) and is an annotation, never a filter.'
      operationId: listVolunteerEligiblePeople
      parameters:
        -
          name: occurrenceId
          in: path
          required: true
          schema:
            type: integer
        -
          name: positionId
          in: query
          required: true
          schema:
            type: integer
        -
          name: q
          in: query
          description: 'Case-insensitive name filter'
          required: false
          schema:
            type: string
      responses:
        '400':
          description: "positionId is missing or names a position outside this occurrence's ministry"
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this occurrence, or V2 is not enabled'
        '404':
          description: 'No such occurrence'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  '/ministries/occurrences/{occurrenceId}/assignments':
    post:
      tags:
        - Volunteer
      summary: 'Assign a qualified person to a position on this occurrence'
      description: "Enforces design section 2.11.2: I4 the position belongs to this schedule's ministry (400), I5 the occurrence is neither cancelled nor past (409), I2 an active qualification (403), I3 membership of the ministry's volunteer pool Group unless allowOutsidePool is passed (409) - NOT applied to self sign-up, which tests qualification only (design D19), I1 one row per person per position per occurrence (409). I8 re-uses a declined or cancelled row rather than inserting a second one. I7/D16 - a person already holding ANOTHER position on this occurrence - is allowed unconditionally and returns 201."
      operationId: createVolunteerAssignment
      parameters:
        -
          name: occurrenceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - positionId
                - personId
              properties:
                positionId:
                  type: integer
                personId:
                  type: integer
                requirementId:
                  type: integer
                  nullable: true
                allowOutsidePool:
                  type: boolean
                notes:
                  type: string
                  nullable: true
              type: object
      responses:
        '400':
          description: "The position does not belong to this occurrence's schedule"
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not qualified, or not authorized, or V2 is not enabled'
        '404':
          description: 'No such occurrence, position or person'
        '409':
          description: 'Already assigned, outside the pool without the override, or the occurrence is cancelled or past'
        '201':
          description: Assigned
      security:
        -
          ApiKeyAuth: []
  '/ministries/assignments/{assignmentId}':
    get:
      tags:
        - Volunteer
      summary: 'One assignment with its full response history'
      description: 'The history is returned because it is the only way to prove the idempotency rule of design section 2.12 from outside - accepting twice must leave exactly one response row (section 6.6). Swap rows are included for the same reason.'
      operationId: getVolunteerAssignment
      parameters:
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this assignment, or V2 is not enabled'
        '404':
          description: 'No such assignment'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Volunteer
      summary: 'Cancel an assignment (hard-deletes only a pending row with no history)'
      description: 'Design section 3.3.2: cancel, never hard-delete once responded. A pending row that carries no response, no swap and is not itself a substitution is a mis-click with nothing to preserve and is removed outright along with its pending outbox rows; everything else is cancelled and kept, because the audit trail is what issue 9709 promises.'
      operationId: deleteVolunteerAssignment
      parameters:
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this assignment, or V2 is not enabled'
        '404':
          description: 'No such assignment'
        '409':
          description: 'The occurrence has already happened'
        '200':
          description: 'Cancelled or deleted'
      security:
        -
          ApiKeyAuth: []
  '/ministries/assignments/{assignmentId}/status':
    post:
      tags:
        - Volunteer
      summary: "Change an assignment's status, or record a response on the volunteer's behalf"
      description: "accepted and declined write a response row with channel 'coordinator' and the COORDINATOR as vrsp_per_ID, so the audit trail shows who actually recorded it (design section 2.11.1). A coordinator-recorded decline deliberately enqueues no decline_alert - the coordinators already know (section 3.6). cancelled is a coordinator act. An illegal transition is a 409 whose body carries currentStatus."
      operationId: setVolunteerAssignmentStatus
      parameters:
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [accepted, declined, cancelled]
                comment:
                  type: string
                  nullable: true
              type: object
      responses:
        '400':
          description: 'Not a status a coordinator may set directly'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this assignment, or V2 is not enabled'
        '404':
          description: 'No such assignment'
        '409':
          description: 'Illegal transition; the body carries currentStatus'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  '/ministries/assignments/{assignmentId}/notify':
    post:
      tags:
        - Volunteer
      summary: 'Re-enqueue the assignment message for this volunteer'
      description: "Idempotent through the dedupe key (design section 2.14): the row assign() already created is returned with created=false and nothing is duplicated. ?force=1 re-arms that SAME row to pending so the next drain sends it again - it never inserts a second one. Nothing is sent here; delivery is issue 9710's."
      operationId: notifyVolunteerAssignment
      parameters:
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: integer
        -
          name: force
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this assignment, or V2 is not enabled'
        '404':
          description: 'No such assignment'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  '/ministries/assignments/{assignmentId}/notifications':
    get:
      tags:
        - Volunteer
      summary: 'The notification outbox rows for one assignment'
      description: "Design section 6.6: the only way to prove from outside that a retried operation produced no second message. Newest first. Coordinator surface - the volunteer's own view of what they were sent is not this endpoint."
      operationId: listVolunteerAssignmentNotifications
      parameters:
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this assignment, or V2 is not enabled'
        '404':
          description: 'No such assignment'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  /ministries/gaps:
    get:
      tags:
        - Volunteer
      summary: "Unfilled staffing requirements across the caller's scope"
      description: 'from and to are required, matching GET /ministries/occurrences. Every count comes from VolunteerAssignmentService::getGaps() - there is no gap table (design section 2.11.3).'
      operationId: listVolunteerGaps
      parameters:
        -
          name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: ministryId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '400':
          description: 'from or to missing or malformed'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not a coordinator, or V2 is not enabled'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  /ministries/swaps:
    get:
      tags:
        - Volunteer
      summary: "The substitution queue for the caller's scope"
      operationId: listVolunteerSwaps
      parameters:
        -
          name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - proposed
              - approved
              - rejected
              - withdrawn
        -
          name: ministryId
          in: query
          required: false
          schema:
            type: integer
        -
          name: occurrenceId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not a coordinator, or V2 is not enabled'
        '200':
          description: OK
      security:
        -
          ApiKeyAuth: []
  '/ministries/swaps/{swapId}/approve':
    post:
      tags:
        - Volunteer
      summary: 'Approve a proposed substitution'
      description: "ONE transaction (design section 2.13): the original goes accepted to substituted, a new row is inserted for the substitute with source='substitute', status='accepted' and vasg_Replaces_vasg_ID pointing at the original, a response row is appended to both, and both parties get a swap_resolved outbox row. The original is never edited beyond its status, so the audit trail survives."
      operationId: approveVolunteerSwap
      parameters:
        -
          name: swapId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                comment:
                  type: string
                  nullable: true
              type: object
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized, the substitute is no longer qualified, or V2 is not enabled'
        '404':
          description: 'No such substitution request'
        '409':
          description: 'Already decided, the occurrence is cancelled or past, or the substitute already holds the position'
        '200':
          description: Approved
      security:
        -
          ApiKeyAuth: []
  '/ministries/swaps/{swapId}/reject':
    post:
      tags:
        - Volunteer
      summary: 'Reject a proposed substitution'
      description: 'The original assignment stays accepted and both parties are told (design section 2.13). The coordinator may then cancel it and assign someone else, which is the ordinary gap loop.'
      operationId: rejectVolunteerSwap
      parameters:
        -
          name: swapId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                comment:
                  type: string
                  nullable: true
              type: object
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized, or V2 is not enabled'
        '404':
          description: 'No such substitution request'
        '409':
          description: 'Already decided'
        '200':
          description: Rejected
      security:
        -
          ApiKeyAuth: []
  /ministries/scopes:
    get:
      tags:
        - Volunteer
      summary: 'List volunteer coordinator and team-leader scope grants'
      operationId: listVolunteerScopes
      parameters:
        -
          name: personId
          in: query
          description: 'Only grants held by this person'
          required: false
          schema:
            type: integer
        -
          name: ministryId
          in: query
          description: 'Only ministry-scope grants on this ministry'
          required: false
          schema:
            type: integer
        -
          name: teamId
          in: query
          description: 'Only team-scope grants on this team'
          required: false
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Ministry management access is required, or V2 is not enabled'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  scopes: { type: array, items: { type: object } }
                type: object
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Volunteer
      summary: 'Grant ministry-coordinator or team-leader authority to a person'
      operationId: createVolunteerScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - personId
                - scopeType
                - scopeId
              properties:
                personId:
                  type: integer
                scopeType:
                  type: string
                  enum: [ministry, team]
                scopeId:
                  description: 'Ministry id or team id'
                  type: integer
              type: object
      responses:
        '400':
          description: 'Missing or invalid field'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Ministry management access is required, or V2 is not enabled'
        '404':
          description: 'The person or the scope target does not exist'
        '200':
          description: "The grant already existed; the same row is returned. joinedPool says whether this call added the person to the ministry's volunteer pool (a grant always makes them a pool member; revoking never removes them)"
        '201':
          description: "Granted, and the person is in the ministry's volunteer pool"
      security:
        -
          ApiKeyAuth: []
  '/ministries/scopes/{scopeId}':
    delete:
      tags:
        - Volunteer
      summary: 'Revoke a volunteer coordinator or team-leader scope grant'
      operationId: deleteVolunteerScope
      parameters:
        -
          name: scopeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Ministry management access is required, or V2 is not enabled'
        '404':
          description: 'No such grant'
        '200':
          description: Revoked
      security:
        -
          ApiKeyAuth: []
  /ministries/me/permissions:
