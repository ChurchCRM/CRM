  /admin/api/map/geocode-all:
    post:
      tags:
        - Map
      summary: 'Geocode all active families missing coordinates'
      description: "Iterates active families that have a street address but no usable coordinates, geocoding each via the configured geocoding services (Map Settings) at ~1 request/second. Families are taken in ID order; up to 50 per call. Pass 'skip' = the number of families that failed in earlier calls so those are not re-queried, and repeat while 'remaining' > 'skip'. Admin-only."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                skip:
                  description: 'Families (in ID order) to skip before the batch — the running count of failures from previous calls'
                  type: integer
                  default: 0
                  minimum: 0
              type: object
      responses:
        '200':
          description: 'Geocoding batch summary'
          content:
            application/json:
              schema:
                properties:
                  total: { description: 'Total families missing coordinates before this run', type: integer }
                  skip: { description: 'Offset applied to this batch (echoed back)', type: integer }
                  processed: { description: 'Families examined in this batch (0 when skip >= total)', type: integer }
                  geocoded: { description: 'Families successfully geocoded in this batch', type: integer }
                  failed: { description: 'Families that could not be geocoded', type: integer }
