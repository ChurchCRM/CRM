        '403':
          description: 'Volunteer Management V2 is not enabled'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  isAdmin: { type: boolean }
                  isGlobalManager: { type: boolean }
                  isCoordinator: { type: boolean }
                  isTeamLeader: { type: boolean }
                  managedMinistryIds: { type: array, items: { type: integer } }
                  managedTeamIds: { type: array, items: { type: integer } }
                type: object
      security:
        -
          ApiKeyAuth: []
  /ministries/ministries:
    get:
      tags:
        - Volunteer
      summary: 'List the volunteer ministries the caller may administer'
      operationId: listVolunteerMinistries
      parameters:
        -
          name: active
          in: query
          description: 'Only active (1) or only inactive (0) ministries; omit for both'
          required: false
          schema:
            type: boolean
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Volunteer coordinator access is required, or V2 is not enabled'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  ministries: { type: array, items: { type: object } }
                type: object
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Volunteer
      summary: 'Create a volunteer ministry'
      description: 'Global volunteer managers and administrators only (design §4.6).'
      operationId: createVolunteerMinistry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  maxLength: 255
                sundaySchool:
                  description: 'D29: the ministry may provide teachers for Sunday School (link teams to classes, schedule class meetings, give its events a class)'
                  type: boolean
                  default: false
              type: object
      responses:
        '400':
          description: 'The name is missing or empty, or sundaySchool is not a boolean'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Ministry management access is required, or V2 is not enabled'
        '409':
          description: 'A ministry with that name already exists'
        '201':
          description: Created
      security:
        -
          ApiKeyAuth: []
  '/ministries/ministries/{ministryId}':
    get:
      tags:
        - Volunteer
      summary: 'One ministry with its teams and positions'
      operationId: getVolunteerMinistry
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this ministry, or V2 is not enabled'
        '404':
          description: 'No such ministry'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  ministry: { type: object }
                  summary: { description: "The three numbers the overview strip shows, computed with the caller's scope", properties: { teamCount: { type: integer }, volunteerCount: { description: "Members of the ministry's pool Group", type: integer }, unfilledPositionCount: { description: 'Open slots across every future scheduled occurrence the caller may see', type: integer } }, type: object }
                  teams: { type: array, items: { type: object } }
                  positions: { type: array, items: { type: object } }
                type: object
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Volunteer
      summary: "Update a ministry's name, description or active flag"
      operationId: updateVolunteerMinistry
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  maxLength: 255
                active:
                  type: boolean
                helpWanted:
                  description: 'Advertise this ministry on the Open Opportunities page (design D19)'
                  type: boolean
                helpWantedText:
                  description: 'What the ministry wants to say there; rendered escaped with line breaks preserved'
                  type: string
                sundaySchool:
                  description: 'D29: the ministry may provide teachers for Sunday School. Only a global volunteer manager or an administrator may change it; a coordinator may send the current value'
                  type: boolean
              type: object
      responses:
        '400':
          description: 'The name was sent empty, or sundaySchool is not a boolean'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this ministry, a coordinator changing sundaySchool, or V2 is not enabled'
        '404':
          description: 'No such ministry'
        '409':
          description: 'A ministry with that name already exists, or sundaySchool was turned off while teams of the ministry are linked to a class (the message and `teams` name them)'
        '200':
          description: Updated
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Volunteer
      summary: 'Delete a deactivated ministry and everything under it'
      description: "Global volunteer managers and administrators only, and only for a ministry whose active flag is off - an active ministry is refused with 409 (deactivate it first, through POST with active:false). The delete then removes the ministry's teams, positions, qualifications, schedules, occurrences and assignments, service history included, together with its scope grants, pool Group and calendar (design §4.6, §5.4 as amended 2026-09-17)."
      operationId: deleteVolunteerMinistry
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Ministry management access is required, or V2 is not enabled'
        '404':
          description: 'No such ministry'
        '409':
          description: 'The ministry is still active'
        '200':
          description: Deleted
      security:
        -
          ApiKeyAuth: []
  '/ministries/ministries/{ministryId}/summary':
    get:
      tags:
        - Volunteer
      summary: 'The three counts the ministry overview shows'
      description: "teamCount, volunteerCount (members of the ministry's pool Group) and unfilledPositionCount - the sum of the open slots (required minus live, per effective requirement) across every future, scheduled occurrence the CALLER may see. A ministry coordinator, a global manager and an administrator are counted over the whole ministry; a team leader only over the occurrences whose schedule belongs to a team they lead, unioned across every such team. The same block is embedded in GET /ministries/{ministryId}, which is what the ministry page reads; this route exists for a caller who may see only part of the ministry and is therefore refused that one."
      operationId: getVolunteerMinistrySummary
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Neither a coordinator of this ministry nor a leader of a team in it, or V2 is not enabled'
        '404':
          description: 'No such ministry'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  ministryId: { type: integer }
                  summary: { properties: { teamCount: { type: integer }, volunteerCount: { type: integer }, unfilledPositionCount: { type: integer }, occurrenceCount: { description: 'All-time, unscoped - for the Delete confirmation', type: integer }, assignmentCount: { description: 'All-time, unscoped - for the Delete confirmation', type: integer } }, type: object }
                type: object
      security:
        -
          ApiKeyAuth: []
  '/ministries/ministries/{ministryId}/teams':
