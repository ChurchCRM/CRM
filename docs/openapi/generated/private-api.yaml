            schema:
              required:
                - eventTypeId
                - startDate
                - endDate
              properties:
                eventTypeId:
                  type: integer
                  example: 5
                startDate:
                  type: string
                  format: date
                  example: '2026-04-05'
                endDate:
                  type: string
                  format: date
                  example: '2026-06-28'
                skipExisting:
                  description: 'Skip dates that already have an event of this type'
                  type: boolean
                  example: true
                pinnedCalendars:
                  description: 'Calendar IDs to pin generated events to'
                  type: array
                  items: { type: integer }
                  example: [1]
              type: object
      responses:
        '200':
          description: 'Events generated'
          content:
            application/json:
              schema:
                properties:
                  created: { type: integer, example: 12 }
                  skipped: { type: integer, example: 1 }
