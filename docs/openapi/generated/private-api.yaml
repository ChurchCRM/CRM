  '/ministries/ministries/{ministryId}/pool/{personId}':
    post:
      tags:
        - Volunteer
      summary: "Put a person in this ministry's volunteer pool"
      description: "Writes a person2group2role_p2g2r row on the ministry's own Group with the group's default role, firing the same GROUP_MEMBER_ADDED plugin hook the Groups module fires. A ministry coordinator may do this WITHOUT the global Manage Groups permission (design D19) - the Propel hooks allow it because the group carries this ministry's id. Idempotent: somebody already in the pool is 200, not 409."
      operationId: addVolunteerPoolMember
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
        -
          name: personId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this ministry, or V2 is not enabled'
        '404':
          description: 'No such ministry, person, or pool group'
        '200':
          description: 'They were already in the pool'
        '201':
          description: Added
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Volunteer
      summary: "Take a person out of this ministry's volunteer pool"
      description: 'Deletes the membership row and fires GROUP_MEMBER_REMOVED. Their qualifications are NOT revoked (design D19): the two are independent, and a qualified non-member is still assignable.'
      operationId: removeVolunteerPoolMember
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
        -
          name: personId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this ministry, or V2 is not enabled'
        '404':
          description: 'No such ministry, or that person is not in the pool'
        '200':
          description: Removed
      security:
        -
          ApiKeyAuth: []
  '/ministries/ministries/{ministryId}/pool/from-cart':
    post:
      tags:
        - Volunteer
      summary: "Put everyone in the session cart into this ministry's volunteer pool"
      description: 'The V2 Cart sink for the pool (design P5/P6, D19): the route reads Cart::getCartPeople() and hands the ids to VolunteerMinistryService::addPoolMembers(), which writes one person2group2role_p2g2r row per person through the managed-write context so the GROUP_MEMBER_ADDED plugin hook fires exactly as it does for the single-person route. Idempotent per person: somebody already in the pool is counted in alreadyMembers rather than failing the batch, so pressing the button twice is safe. No qualification is granted - being in the pool is candidacy, the tick on the grid is eligibility (design section 2.5). The cart is NOT emptied. Takes no request body.'
      operationId: addVolunteerPoolMembersFromCart
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '400':
          description: 'The cart is empty'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this ministry, or V2 is not enabled'
        '404':
          description: 'No such ministry, or it has no pool group'
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  added: { description: 'How many people were newly put in the pool', type: integer }
                  alreadyMembers: { description: 'How many were in it already', type: integer }
                type: object
      security:
        -
          ApiKeyAuth: []
  '/ministries/ministries/{ministryId}/volunteers/{personId}':
    delete:
      tags:
        - Volunteer
      summary: 'Take one person out of a ministry entirely'
      description: "In one transaction: revokes every active qualification they hold for a position of this ministry (revocation is deactivation, design section 2.7), cancels every live assignment of theirs on a still-to-come occurrence of the ministry through the ordinary cancel path so the outbox rows are cancelled and the response trail is appended, removes them from the ministry's pool Group through the managed-write context, and clears every schedule default of this ministry that names them (D32; revoking one qualification keeps the default). Past assignments are service history and are left alone. Ministry-level authority: a team leader gets 403."
      operationId: removeVolunteerFromMinistry
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
        -
          name: personId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized for this ministry, or V2 is not enabled'
        '404':
          description: 'No such ministry or person'
        '200':
          description: Removed
          content:
            application/json:
              schema:
                properties:
                  personId: { type: integer }
                  qualifications: { description: 'Qualifications revoked', type: integer }
                  assignments: { description: 'Upcoming assignments cancelled', type: integer }
                  removedFromPool: { type: boolean }
                  defaults: { description: 'Schedule default volunteer entries cleared', type: integer }
                type: object
      security:
        -
          ApiKeyAuth: []
