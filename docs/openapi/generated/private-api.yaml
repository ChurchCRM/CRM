openapi: 3.0.0
info:
  title: 'ChurchCRM Private API'
  description: 'Authenticated REST API for ChurchCRM. All endpoints require an API key passed via the x-api-key header. Obtain your API key from Profile → API Key inside the application, or via POST /public/user/login. Many endpoints require specific role permissions beyond basic authentication.'
  contact:
    name: ChurchCRM
    url: 'https://churchcrm.io'
    email: info@churchcrm.io
  license:
    name: MIT
    url: 'https://opensource.org/licenses/MIT'
  version: 7.0.1
servers:
  -
    url: '{scheme}://{host}/api'
    description: 'Self-hosted ChurchCRM API (/api)'
    variables:
      scheme:
        enum:
          - https
          - http
        default: https
        description: 'Protocol (https for production, http for local)'
      host:
        default: your-server.com
        description: 'Your ChurchCRM server hostname'
  -
    url: '{scheme}://{host}/admin'
    description: 'Self-hosted ChurchCRM Admin (/admin)'
    variables:
      scheme:
        enum:
          - https
          - http
        default: https
        description: 'Protocol (https for production, http for local)'
      host:
        default: your-server.com
        description: 'Your ChurchCRM server hostname'
  -
    url: '{scheme}://{host}'
    description: 'Self-hosted ChurchCRM root (for /kiosk and /plugins)'
    variables:
      scheme:
        enum:
          - https
          - http
        default: https
        description: 'Protocol (https for production, http for local)'
      host:
        default: your-server.com
        description: 'Your ChurchCRM server hostname'
  -
    url: 'http://localhost/churchcrm/api'
    description: 'Local development — API (/api)'
  -
    url: 'http://localhost/churchcrm/admin'
    description: 'Local development — Admin (/admin)'
  -
    url: 'http://localhost/churchcrm'
    description: 'Local development — root (for /kiosk and /plugins)'
paths:
  /geocoder/address:
    post:
      tags:
        - Map
      summary: 'Geocode an address — returns latitude and longitude'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                address:
                  description: 'Full address string to geocode'
                  type: string
              type: object
      responses:
        '200':
          description: 'Latitude and longitude for the provided address'
          content:
            application/json:
              schema:
                properties:
                  Latitude: { type: number, format: float }
                  Longitude: { type: number, format: float }
                type: object
        '400':
          description: 'Empty or invalid request body'
      security:
        -
          ApiKeyAuth: []
  /map/families:
    get:
      tags:
        - Map
      summary: 'Get geocoded map items — families, group members, or cart persons'
      parameters:
        -
          name: groupId
          in: query
          description: 'When omitted or null: all active geocoded families. When 0: persons in the session cart. When > 0: members of that group.'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'Array of map items'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { id: { type: integer }, type: { type: string, enum: [family, person] }, name: { type: string }, salutation: { type: string }, address: { type: string }, latitude: { type: number, format: float }, longitude: { type: number, format: float }, classificationId: { type: integer }, profileUrl: { type: string }, directionsUrl: { type: string }, phone: { type: string } }
                  type: object
      security:
        -
          ApiKeyAuth: []
  '/map/neighbors/{familyId}':
    get:
      tags:
        - Map
      summary: 'Get nearest neighbor families for a given familyId'
      parameters:
        -
          name: familyId
          in: path
          required: true
          schema:
            type: integer
        -
          name: maxNeighbors
          in: query
          required: false
          schema:
            type: integer
        -
          name: maxDistance
          in: query
          required: false
          schema:
            type: number
            format: float
        -
          name: classificationIds
          in: query
          description: 'Comma-separated classification option IDs to filter listed people by'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 'Array of neighbor families'
      security:
        -
          ApiKeyAuth: []
  /map/geocode-all:
    post:
      tags:
        - Map
      summary: 'Geocode all active families missing coordinates'
      description: "Iterates active families that have a street address but no usable coordinates, geocoding each via Nominatim at ~1 request/second. Processes up to 50 families per call; repeat if 'remaining' > 0. Admin-only."
      responses:
        '200':
          description: 'Geocoding batch summary'
          content:
            application/json:
              schema:
                properties:
                  total: { description: 'Total families missing coordinates before this run', type: integer }
                  geocoded: { description: 'Families successfully geocoded in this batch', type: integer }
                  failed: { description: 'Families that could not be geocoded', type: integer }
                  remaining: { description: 'Families still missing coordinates after this batch (run again if > 0)', type: integer }
                  failures: { description: 'Per-family failure details (capped at 20 entries). Empty array when all families were geocoded.', type: array, items: { properties: { id: { description: 'Family ID', type: integer }, name: { description: 'Family name', type: string }, address: { description: 'Full street address', type: string }, editUrl: { description: 'URL to the family editor page', type: string }, reason: { description: "Machine code: 'incomplete_address' | 'no_result' | 'error'", type: string } }, type: object } }
                  failuresTruncated: { description: 'True when failed > 20 and some failures are omitted from the array', type: boolean }
                type: object
        '401':
          description: Unauthorized
        '403':
          description: 'Admin role required'
      security:
        -
          ApiKeyAuth: []
  '/search/{query}':
    get:
      tags:
        - Search
      summary: 'Search persons, families, groups, deposits, payments, and calendar events'
      parameters:
        -
          name: query
          in: path
          description: 'Search term to match against all supported entity types'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Array of search result provider groups, each containing a type label and matched results'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { results: { type: array, items: { type: object } } }
                  type: object
      security:
        -
          ApiKeyAuth: []
  /background/timerjobs:
    post:
      tags:
        - System
      summary: 'Trigger background timer jobs (page-load fallback scheduler)'
      description: 'Fallback trigger fired from the page footer on every authenticated page load, for installs that cannot run cron. The jobs are rate limited server-side by iTimerJobsMinIntervalMinutes, so a call inside that window returns ran=false without doing any work. The supported scheduler is the command-line runner (cli/timerjobs.php) driven by cron.'
      responses:
        '200':
          description: 'Timer jobs executed, or skipped by the rate limit'
          content:
            application/json:
              schema:
                properties:
                  ran: { description: 'False when the rate limit skipped this call', type: boolean, example: true }
                  lastRun: { description: 'When the jobs last completed', type: string, example: '2026-09-11 08:15:00', nullable: true }
                  minIntervalMinutes: { type: integer, example: 15 }
                type: object
      security:
        -
          ApiKeyAuth: []
  '/user/{userId}/apikey/regen':
    post:
      tags:
        - Users
      summary: 'Regenerate the API key for a user'
      parameters:
        -
          name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'New API key'
          content:
            application/json:
              schema:
                properties:
                  apiKey: { type: string }
                type: object
      security:
        -
          ApiKeyAuth: []
  '/user/{userId}/config/{key}':
    post:
      tags:
        - Users
      summary: 'Update a named config string for a user'
      parameters:
        -
          name: userId
          in: path
          required: true
          schema:
            type: integer
        -
          name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                value:
                  type: string
              type: object
      responses:
        '200':
          description: 'Updated config key/value pair'
      security:
        -
          ApiKeyAuth: []
  '/user/{userId}/setting/{settingName}':
    get:
      tags:
        - Users
      summary: 'Get a named setting value for a user'
      parameters:
        -
          name: userId
          in: path
          required: true
          schema:
            type: integer
        -
          name: settingName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Setting value'
          content:
            application/json:
              schema:
                properties:
                  value: { type: string }
                type: object
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Users
      summary: 'Set a named setting value for a user'
      parameters:
        -
          name: userId
          in: path
          required: true
          schema:
            type: integer
        -
          name: settingName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                value:
                  type: string
              type: object
      responses:
        '200':
          description: 'Updated setting value'
          content:
            application/json:
              schema:
                properties:
                  value: { type: string }
                type: object
      security:
        -
          ApiKeyAuth: []
  /user/current/refresh2fasecret:
    post:
      tags:
        - 2FA
      summary: 'Begin 2FA enrollment — provision a new TOTP secret and return a QR code data URI'
      responses:
        '200':
          description: 'QR code data URI for TOTP enrollment'
          content:
            application/json:
              schema:
                properties:
                  TwoFAQRCodeDataUri: { type: string }
                type: object
      security:
        -
          ApiKeyAuth: []
  /user/current/refresh2farecoverycodes:
    post:
      tags:
        - 2FA
      summary: 'Generate new 2FA recovery codes for the current user'
      responses:
        '200':
          description: 'Array of new recovery codes'
          content:
            application/json:
              schema:
                properties:
                  TwoFARecoveryCodes: { type: array, items: { type: string } }
                type: object
      security:
        -
          ApiKeyAuth: []
  /user/current/remove2fasecret:
    post:
      tags:
        - 2FA
      summary: 'Remove the 2FA secret from the current user (disables 2FA)'
      responses:
        '200':
          description: '2FA secret removed'
      security:
        -
          ApiKeyAuth: []
  /user/current/get2faqrcode:
    get:
      tags:
        - 2FA
      summary: "Get the current user's 2FA QR code as a PNG image"
      responses:
        '200':
          description: 'PNG image of the 2FA QR code'
          content:
            image/png: {  }
      security:
        -
          ApiKeyAuth: []
  /user/current/test2FAEnrollmentCode:
    post:
      tags:
        - 2FA
      summary: 'Validate a TOTP enrollment code to complete 2FA setup'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                enrollmentCode:
                  type: string
              type: object
      responses:
        '200':
          description: 'Whether the enrollment code is valid'
          content:
            application/json:
              schema:
                properties:
                  IsEnrollmentCodeValid: { type: boolean }
                type: object
      security:
        -
          ApiKeyAuth: []
  /user/current/2fa-status:
    get:
      tags:
        - 2FA
      summary: 'Get the 2FA enabled status for the current user'
      responses:
        '200':
          description: '2FA enabled status'
          content:
            application/json:
              schema:
                properties:
                  IsEnabled: { type: boolean }
                type: object
      security:
        -
          ApiKeyAuth: []
  /systemcalendars:
    get:
      tags:
        - Calendar
      summary: 'List all system calendars'
      description: 'Returns built-in system calendars (birthdays, anniversaries, events).'
      operationId: getSystemCalendars
      responses:
        '200':
          description: 'Array of system calendar objects'
        '401':
          description: Unauthorized
      security:
        -
          ApiKeyAuth: []
  '/systemcalendars/{id}/events':
    get:
      tags:
        - Calendar
      summary: 'Get events from a system calendar'
      operationId: getSystemCalendarEvents
      parameters:
        -
          name: id
          in: path
          description: 'System calendar ID'
          required: true
          schema:
            type: integer
            example: 1
        -
          name: start
          in: query
          description: 'Filter start date (ISO 8601)'
          required: false
          schema:
            type: string
            format: date
        -
          name: end
          in: query
          description: 'Filter end date (ISO 8601)'
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 'Array of event objects'
        '401':
          description: Unauthorized
        '404':
          description: 'System calendar not found'
      security:
        -
          ApiKeyAuth: []
  '/systemcalendars/{id}/events/{eventid}':
    get:
      tags:
        - Calendar
      summary: 'Get a single event from a system calendar'
      operationId: getSystemCalendarEventById
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
        -
          name: eventid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Event object'
        '401':
          description: Unauthorized
        '404':
          description: 'Calendar or event not found'
      security:
        -
          ApiKeyAuth: []
  '/systemcalendars/{id}/fullcalendar':
    get:
      tags:
        - Calendar
      summary: 'Get system calendar events in FullCalendar format'
      operationId: getSystemCalendarFullCalendarEvents
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
        -
          name: start
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: end
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 'FullCalendar-compatible event array'
        '401':
          description: Unauthorized
        '404':
          description: 'Calendar or events not found'
      security:
        -
          ApiKeyAuth: []
  /calendars:
    get:
      tags:
        - Calendar
      summary: 'List user-created calendars'
      description: 'Returns all user calendars. Optionally filter by ID using GET /calendars/{id}.'
      operationId: getUserCalendars
      responses:
        '200':
          description: 'Array of calendar objects'
        '401':
          description: Unauthorized
        '404':
          description: 'No calendars found'
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Calendar
      summary: 'Create a new calendar'
      operationId: newCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - Name
                - ForegroundColor
                - BackgroundColor
              properties:
                Name:
                  type: string
                  example: 'Youth Group'
                ForegroundColor:
                  type: string
                  example: '#ffffff'
                BackgroundColor:
                  type: string
                  example: '#3788d8'
              type: object
      responses:
        '200':
          description: 'New calendar object'
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
      security:
        -
          ApiKeyAuth: []
  '/calendars/{id}':
    get:
      tags:
        - Calendar
      summary: 'Get a specific user calendar'
      operationId: getUserCalendarById
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Calendar object'
        '401':
          description: Unauthorized
        '404':
          description: 'Calendar not found'
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Calendar
      summary: 'Delete a user calendar'
      operationId: deleteUserCalendar
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Calendar deleted'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                type: object
        '400':
          description: 'Missing or invalid calendar ID'
        '401':
          description: Unauthorized
        '409':
          description: 'Calendar still has events assigned; remove them first'
      security:
        -
          ApiKeyAuth: []
  '/calendars/{id}/fullcalendar':
    get:
      tags:
        - Calendar
      summary: 'Get user calendar events in FullCalendar format'
      operationId: getUserCalendarFullCalendarEvents
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
        -
          name: start
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: end
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 'FullCalendar-compatible event array'
        '401':
          description: Unauthorized
        '404':
          description: 'Calendar or events not found'
      security:
        -
          ApiKeyAuth: []
  '/calendars/{id}/events':
    get:
      tags:
        - Calendar
      summary: 'Get events for a user calendar'
      operationId: getUserCalendarEvents
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
        -
          name: start
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: end
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 'Array of event objects'
        '401':
          description: Unauthorized
        '404':
          description: 'Calendar not found'
      security:
        -
          ApiKeyAuth: []
  '/calendars/{id}/NewAccessToken':
    post:
      tags:
        - Calendar
      summary: 'Generate a new public access token for a calendar'
      operationId: newCalendarAccessToken
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Calendar object with new access token'
        '400':
          description: 'Missing or invalid calendar ID'
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
      security:
        -
          ApiKeyAuth: []
  '/calendars/{id}/AccessToken':
    delete:
      tags:
        - Calendar
      summary: 'Remove the public access token from a calendar'
      operationId: deleteCalendarAccessToken
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Calendar object with access token cleared'
        '400':
          description: 'Missing or invalid calendar ID'
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
      security:
        -
          ApiKeyAuth: []
  /calendar/events-counters:
    get:
      tags:
        - Calendar
      summary: "Get today's event counters for the dashboard menu badges"
      description: 'Returns counts of upcoming birthdays, anniversaries, and events used to populate navigation badge counts.'
      operationId: getEventsCounters
      responses:
        '200':
          description: 'Counter object'
          content:
            application/json:
              schema:
                properties:
                  birthdays: { type: integer, example: 2 }
                  anniversaries: { type: integer, example: 1 }
                  events: { type: integer, example: 3 }
                type: object
        '401':
          description: Unauthorized
      security:
        -
          ApiKeyAuth: []
  /events:
    get:
      tags:
        - Calendar
      summary: 'List all events'
      description: 'Returns all calendar events with their linked group associations.'
      operationId: getAllEvents
      responses:
        '200':
          description: 'List of events'
          content:
            application/json:
              schema:
                properties:
                  Events: { type: array, items: { properties: { Id: { type: integer, example: 1 }, Title: { type: string, example: 'Sunday Service' }, Desc: { type: string, nullable: true }, Start: { type: string, format: date-time }, End: { type: string, format: date-time }, Groups: { type: array, items: { properties: { Id: { type: integer }, Name: { type: string } }, type: object } } }, type: object } }
                type: object
        '401':
          description: Unauthorized
        '404':
          description: 'No events found'
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Calendar
      summary: 'Create a new event'
      operationId: newEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - Title
                - Type
                - Start
                - End
                - PinnedCalendars
              properties:
                Title:
                  type: string
                  example: 'Easter Service'
                Type:
                  description: 'Event type ID from GET /events/types'
                  type: integer
                  example: 1
                Desc:
                  type: string
                  nullable: true
                Start:
                  type: string
                  format: date-time
                  example: '2026-04-05T09:00:00'
                End:
                  type: string
                  format: date-time
                  example: '2026-04-05T11:00:00'
                Text:
                  description: 'Rich text body (HTML allowed)'
                  type: string
                  nullable: true
                PinnedCalendars:
                  type: array
                  items: { type: integer }
                  example: [1]
              type: object
      responses:
        '200':
          description: 'Event created'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                type: object
        '400':
          description: 'Invalid event type or calendar ID'
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
      security:
        -
          ApiKeyAuth: []
  /events/types:
    get:
      tags:
        - Calendar
      summary: 'List all event types'
      operationId: getEventTypes
      responses:
        '200':
          description: 'Ordered list of event types'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { Id: { type: integer, example: 1 }, Name: { type: string, example: 'Worship Service' } }
                  type: object
        '401':
          description: Unauthorized
        '404':
          description: 'No event types found'
      security:
        -
          ApiKeyAuth: []
  '/events/{id}':
    get:
      tags:
        - Calendar
      summary: 'Get an event by ID'
      operationId: getEvent
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 'Event object'
          content:
            application/json:
              schema:
                properties:
                  Id: { type: integer }
                  Title: { type: string }
                  Start: { type: string, format: date-time }
                  End: { type: string, format: date-time }
                type: object
        '401':
          description: Unauthorized
        '404':
          description: 'Event not found'
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Calendar
      summary: 'Update an existing event'
      operationId: updateEvent
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                Title:
                  type: string
                Desc:
                  type: string
                  nullable: true
                Start:
                  type: string
                  format: date-time
                End:
                  type: string
                  format: date-time
                Text:
                  type: string
                  nullable: true
                PinnedCalendars:
                  type: array
                  items: { type: integer }
              type: object
      responses:
        '200':
          description: 'Event updated'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                type: object
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
        '404':
          description: 'Event not found'
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Calendar
      summary: 'Delete an event'
      operationId: deleteEvent
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 'Event deleted'
          content:
            application/json:
