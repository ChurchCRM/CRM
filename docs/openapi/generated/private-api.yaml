  /email/send:
    post:
      tags:
        - Email
      summary: 'Send a composer email, one message per recipient, through the configured SMTP server'
      description: 'Recipients are given as person and family ids, never as addresses: the server resolves each id to its current email address, applies the do-not-email property, skips deceased people, inactive families and ids without an address, deduplicates addresses, and reports every skipped recipient by name. Each recipient receives their own message.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - subject
                - body
              properties:
                personIds:
                  description: 'Person ids to email at their primary address (falls back to the family address)'
                  type: array
                  items: { type: integer }
                familyIds:
                  description: 'Family ids to email at the family address'
                  type: array
                  items: { type: integer }
                subject:
                  description: 'Subject line (plain text)'
                  type: string
                  maxLength: 255
                body:
                  description: 'Plain-text body; newlines are preserved'
                  type: string
              type: object
      responses:
        '200':
          description: 'Per-recipient outcome'
          content:
            application/json:
              schema:
                properties:
                  sent: { description: 'Recipients whose message the SMTP server accepted (acceptance is not delivery)', type: array, items: { properties: { personId: { type: integer, nullable: true }, familyId: { type: integer, nullable: true }, name: { type: string }, email: { type: string } }, type: object } }
                  skipped: { description: 'Requested recipients that were not emailed', type: array, items: { properties: { personId: { type: integer, nullable: true }, familyId: { type: integer, nullable: true }, name: { type: string }, reason: { type: string, enum: [not-found, no-email, do-not-email, deceased, inactive, duplicate-address] } }, type: object } }
                  failed: { description: 'Recipients the SMTP server rejected', type: array, items: { properties: { personId: { type: integer, nullable: true }, familyId: { type: integer, nullable: true }, name: { type: string }, email: { type: string }, error: { type: string } }, type: object } }
                  counts: { properties: { sent: { type: integer }, skipped: { type: integer }, failed: { type: integer } }, type: object }
                type: object
        '400':
          description: 'Invalid request: raw addresses, no ids, bad ids, more than 500 ids, or empty subject/body'
        '401':
          description: Unauthorized
        '403':
          description: 'Email permission required'
        '422':
          description: 'Email sending is disabled or SMTP is not configured'
      security:
        -
          ApiKeyAuth: []
  /email/preview:
    post:
      tags:
        - Email
      summary: 'Render a composer message for its first recipient without sending it'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - subject
                - body
              properties:
                personIds:
                  type: array
                  items: { type: integer }
                familyIds:
                  type: array
                  items: { type: integer }
                subject:
                  type: string
                body:
                  type: string
              type: object
      responses:
        '200':
          description: 'The rendered HTML and who it is addressed to'
          content:
            application/json:
              schema:
                properties:
                  html: { type: string }
                  recipient: { properties: { name: { type: string }, email: { type: string } }, type: object }
                  recipientCount: { description: 'How many recipients the send would reach', type: integer }
                type: object
        '400':
          description: 'No resolvable recipient, or empty subject/body'
        '401':
          description: Unauthorized
        '403':
          description: 'Email permission required'
      security:
        -
          ApiKeyAuth: []
  '/ministries/ministries/{ministryId}/events':
    get:
      tags:
        - Volunteer
      summary: 'The events a ministry owns, with their staffing and headcount (D24, D26)'
      description: 'Events whose event_ministry_id is this ministry, inactive ones included. Upcoming by default (from today, a year ahead, soonest first); past=1 lists the year before today, newest first. from/to override either bound. Each event carries its type, pinned calendars, Linked Groups, headcount total and, per team of this ministry, the staffing of its scheduled occurrences anchored to the event, from the same gap derivation as the occurrence list.'
      operationId: listVolunteerMinistryEvents
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
        -
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: past
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  events: { type: array, items: { properties: { id: { type: integer }, title: { type: string }, start: { type: string }, end: { type: string }, eventTypeId: { type: integer }, eventTypeName: { type: string, nullable: true }, inactive: { type: boolean }, calendars: { type: array, items: { type: object } }, linkedGroups: { type: array, items: { type: object } }, headcount: { properties: { recorded: { type: boolean }, total: { type: integer } }, type: object }, otherStaffing: { description: 'D28: other ministries with an occurrence on the event and how many of their volunteers are assigned (pending or accepted)', type: array, items: { properties: { ministryId: { type: integer }, ministryName: { type: string }, assigned: { type: integer } }, type: object } }, staffing: { type: array, items: { properties: { teamId: { type: integer }, teamName: { type: string }, occurrenceIds: { type: array, items: { type: integer } }, needed: { type: integer }, filled: { type: integer }, pending: { type: integer }, gap: { type: integer }, openCount: { description: "D34: room left, summed over the team's positions (each position's max minus its live assignments, never below 0)", type: integer }, capacity: { description: 'D34: the summed maximums; a position with no maximum counts its minimum (a NULL MaxCount means the same as MinCount)', type: integer }, requirementCount: { type: integer }, status: { type: string, enum: [unplanned, gap, pending, filled] } }, type: object } } }, type: object } }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  past: { type: boolean }
                  limit: { type: integer }
                  capped: { type: boolean }
                type: object
        '400':
          description: 'A malformed or inverted window'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not a coordinator of this ministry, or V2 is not enabled'
        '404':
          description: 'No such ministry'
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Volunteer
      summary: "Create a ministry's event or event series through core (D24)"
      description: "One event (date, startTime, endTime) through the same code as POST /events, or a series (recurrence, rangeStart, rangeEnd, startTime, endTime) through the repeat engine, capped at 366 events; rangeEnd is required. Every event carries this ministry's id and the Linked Group when given, and is pinned to calendarIds (default: the ministry's own calendar), each of which must be the ministry's own calendar or a church calendar opened to it unless the caller holds Add Events (D25). Nothing is written when any part is refused. Staffing is a separate step (D33): a staff key is refused; a series is staffed with POST /ministries/ministries/{ministryId}/events/staff, one event with Staff this event. Fires event.created for each event after the commit."
      operationId: createVolunteerMinistryEvents
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - title
                - eventTypeId
                - startTime
                - endTime
              properties:
                title:
                  type: string
                  example: Workday
                eventTypeId:
                  type: integer
                  example: 1
                description:
                  type: string
                  nullable: true
                linkedGroupId:
                  description: 'The Linked Group, usually a Sunday School class'
                  type: integer
                  nullable: true
                calendarIds:
                  description: "Omit for the ministry's own calendar"
                  type: array
                  items: { type: integer }
                date:
                  description: 'One event'
                  type: string
                  format: date
                startTime:
                  type: string
                  example: '09:00'
                endTime:
                  type: string
                  example: '12:00'
                recurrence:
                  description: 'A series instead of one event'
                  properties: { type: { type: string, enum: [weekly, monthly, yearly] }, dow: { type: string, example: Sunday }, dom: { type: integer, example: 15 }, doy: { type: string, example: 04-12 } }
                  type: object
                rangeStart:
                  type: string
                  format: date
                rangeEnd:
                  description: 'Required for a series'
                  type: string
                  format: date
              type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                properties:
                  events: { type: array, items: { properties: { id: { type: integer }, title: { type: string }, start: { type: string }, end: { type: string } }, type: object } }
                type: object
        '400':
          description: 'A missing or malformed field, a staff key (D33), an unknown type, class or calendar, or a recurrence with no date in the range or over the cap'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not a coordinator of this ministry (team leaders and self-service logins included), a calendar the ministry may not pin to, or V2 is not enabled'
        '404':
          description: 'No such ministry'
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Volunteer
      summary: 'Delete events this ministry owns (D28)'
      description: "The Calendar tab's Delete events. Every id must be an event whose event_ministry_id is this ministry, and each is deleted through core's event delete in one transaction - all or none. Refused while another ministry has volunteers assigned (pending or accepted) on any of them unless the caller holds Add Events, and whenever core refuses one (people checked in, a kiosk assigned)."
      operationId: deleteVolunteerMinistryEvents
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - eventIds
              properties:
                eventIds:
                  type: array
                  items: { type: integer }
              type: object
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                properties:
                  deleted: { type: integer }
                type: object
        '400':
          description: 'eventIds is missing, empty or not a list of ids'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not a coordinator of this ministry, an event another ministry or nobody owns, a self-service login, or V2 is not enabled'
        '404':
          description: 'No such ministry or event'
        '409':
          description: 'Another ministry has volunteers on one of the events (`ministries` names them), or core refused one (the reason and `eventId`); nothing is deleted'
      security:
        -
          ApiKeyAuth: []
  '/ministries/ministries/{ministryId}/events/staff':
    post:
      tags:
        - Volunteer
      summary: "Staff new events on the ministry's schedules that already follow them (D33)"
      description: "The Staff them answer after a series was created. The events must be this ministry's and one series (one title, type and class). Every active schedule of the ministry that is not a Staff this event schedule and follows them - class mode on their class, ministry mode with exactly their title, or event_type mode with their type and exactly their title, titles ignoring case - takes them: its window is widened to cover them (the first date moved back, a set last date moved on, an open end left open), it is generated through the last event but never past the scheduling horizon, and its saved default volunteers are assigned on the occurrences that run created. An empty list means no schedule follows them: nothing was made. Matching is by class and title because core events carry no series id."
      operationId: staffVolunteerMinistryEvents
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
