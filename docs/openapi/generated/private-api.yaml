openapi: 3.0.0
info:
  title: 'ChurchCRM Private API'
  description: 'Authenticated REST API for ChurchCRM. All endpoints require an API key passed via the x-api-key header. Obtain your API key from Profile → API Key inside the application, or via POST /public/user/login. Many endpoints require specific role permissions beyond basic authentication.'
  contact:
    name: ChurchCRM
    url: 'https://churchcrm.io'
    email: info@churchcrm.io
  license:
    name: MIT
    url: 'https://opensource.org/licenses/MIT'
  version: 7.8.0
servers:
  -
    url: '{scheme}://{host}/api'
    description: 'Self-hosted ChurchCRM API (/api)'
    variables:
      scheme:
        enum:
          - https
          - http
        default: https
        description: 'Protocol (https for production, http for local)'
      host:
        default: your-server.com
        description: 'Your ChurchCRM server hostname'
  -
    url: '{scheme}://{host}/admin'
    description: 'Self-hosted ChurchCRM Admin (/admin)'
    variables:
      scheme:
        enum:
          - https
          - http
        default: https
        description: 'Protocol (https for production, http for local)'
      host:
        default: your-server.com
        description: 'Your ChurchCRM server hostname'
  -
    url: '{scheme}://{host}'
    description: 'Self-hosted ChurchCRM root (for /kiosk and /plugins)'
    variables:
      scheme:
        enum:
          - https
          - http
        default: https
        description: 'Protocol (https for production, http for local)'
      host:
        default: your-server.com
        description: 'Your ChurchCRM server hostname'
  -
    url: 'http://localhost/churchcrm/api'
    description: 'Local development — API (/api)'
  -
    url: 'http://localhost/churchcrm/admin'
    description: 'Local development — Admin (/admin)'
  -
    url: 'http://localhost/churchcrm'
    description: 'Local development — root (for /kiosk and /plugins)'
paths:
  '/search/{query}':
    get:
      tags:
        - Search
      summary: 'Search persons, families, groups, deposits, payments, and calendar events'
      parameters:
        -
          name: query
          in: path
          description: 'Search term to match against all supported entity types'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Array of search result provider groups, each containing a type label and matched results'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { results: { type: array, items: { type: object } } }
                  type: object
      security:
        -
          ApiKeyAuth: []
  /user/current/refresh2fasecret:
    post:
      tags:
        - 2FA
      summary: 'Begin 2FA enrollment — provision a new TOTP secret and return a QR code data URI'
      responses:
        '200':
          description: 'QR code data URI for TOTP enrollment'
          content:
            application/json:
              schema:
                properties:
                  TwoFAQRCodeDataUri: { type: string }
                type: object
      security:
        -
          ApiKeyAuth: []
  /user/current/refresh2farecoverycodes:
    post:
      tags:
        - 2FA
      summary: 'Generate new 2FA recovery codes for the current user'
      responses:
        '200':
          description: 'Array of new recovery codes'
          content:
            application/json:
              schema:
                properties:
                  TwoFARecoveryCodes: { type: array, items: { type: string } }
                type: object
      security:
        -
          ApiKeyAuth: []
  /user/current/remove2fasecret:
    post:
      tags:
        - 2FA
      summary: 'Remove the 2FA secret from the current user (disables 2FA)'
      responses:
        '200':
          description: '2FA secret removed'
      security:
        -
          ApiKeyAuth: []
  /user/current/get2faqrcode:
    get:
      tags:
        - 2FA
      summary: "Get the current user's 2FA QR code as a PNG image"
      responses:
        '200':
          description: 'PNG image of the 2FA QR code'
          content:
            image/png: {  }
      security:
        -
          ApiKeyAuth: []
  /user/current/test2FAEnrollmentCode:
    post:
      tags:
        - 2FA
      summary: 'Validate a TOTP enrollment code to complete 2FA setup'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                enrollmentCode:
                  type: string
              type: object
      responses:
        '200':
          description: 'Whether the enrollment code is valid'
          content:
            application/json:
              schema:
                properties:
                  IsEnrollmentCodeValid: { type: boolean }
                type: object
      security:
        -
          ApiKeyAuth: []
  /user/current/2fa-status:
    get:
      tags:
        - 2FA
      summary: 'Get the 2FA enabled status for the current user'
      responses:
        '200':
          description: '2FA enabled status'
          content:
            application/json:
              schema:
                properties:
                  IsEnabled: { type: boolean }
                type: object
      security:
        -
          ApiKeyAuth: []
  '/user/{userId}/apikey/regen':
    post:
      tags:
        - Users
      summary: 'Regenerate the API key for a user'
      parameters:
        -
          name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'New API key'
          content:
            application/json:
              schema:
                properties:
                  apiKey: { type: string }
                type: object
      security:
        -
          ApiKeyAuth: []
  '/user/{userId}/config/{key}':
    post:
      tags:
        - Users
      summary: 'Update a named config string for a user'
      parameters:
        -
          name: userId
          in: path
          required: true
          schema:
            type: integer
        -
          name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                value:
                  type: string
              type: object
      responses:
        '200':
          description: 'Updated config key/value pair'
      security:
        -
          ApiKeyAuth: []
  '/user/{userId}/setting/{settingName}':
    get:
      tags:
        - Users
      summary: 'Get a named setting value for a user'
      parameters:
        -
          name: userId
          in: path
          required: true
          schema:
            type: integer
        -
          name: settingName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Setting value'
          content:
            application/json:
              schema:
                properties:
                  value: { type: string }
                type: object
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Users
      summary: 'Set a named setting value for a user'
      parameters:
        -
          name: userId
          in: path
          required: true
          schema:
            type: integer
        -
          name: settingName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                value:
                  type: string
              type: object
      responses:
        '200':
          description: 'Updated setting value'
          content:
            application/json:
              schema:
                properties:
                  value: { type: string }
                type: object
      security:
        -
          ApiKeyAuth: []
  /events:
    get:
      tags:
        - Calendar
      summary: 'List all events'
      description: 'Returns all calendar events with their linked group associations.'
      operationId: getAllEvents
      responses:
        '200':
          description: 'List of events'
          content:
            application/json:
              schema:
                properties:
                  Events: { type: array, items: { properties: { Id: { type: integer, example: 1 }, Title: { type: string, example: 'Sunday Service' }, Desc: { type: string, nullable: true }, Start: { type: string, format: date-time }, End: { type: string, format: date-time }, Groups: { type: array, items: { properties: { Id: { type: integer }, Name: { type: string } }, type: object } } }, type: object } }
                type: object
        '401':
          description: Unauthorized
        '404':
          description: 'No events found'
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Calendar
      summary: 'Create a new event'
      operationId: newEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - Title
                - Type
                - Start
                - End
                - PinnedCalendars
              properties:
                Title:
                  type: string
                  example: 'Easter Service'
                Type:
                  description: 'Event type ID from GET /events/types'
                  type: integer
                  example: 1
                Desc:
                  type: string
                  nullable: true
                Start:
                  type: string
                  format: date-time
                  example: '2026-04-05T09:00:00'
                End:
                  type: string
                  format: date-time
                  example: '2026-04-05T11:00:00'
                Text:
                  description: 'Rich text body (HTML allowed)'
                  type: string
                  nullable: true
                PinnedCalendars:
                  description: "Without the global AddEvent right: only the event ministry's own calendar and the church calendars opened to that ministry (GET /calendars/pinnable)"
                  type: array
                  items: { type: integer }
                  example: [1]
                MinistryId:
                  description: 'Volunteer v2: owning volunteer ministry. Only an administrator, a global volunteer manager or a coordinator of that ministry may set it. A volunteer coordinator without the global AddEvent right MUST supply one they manage.'
                  type: integer
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Event created'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                type: object
        '400':
          description: 'Invalid event type, calendar ID or volunteer ministry'
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required, or the caller may not assign the event to that volunteer ministry or pin it to one of those calendars'
      security:
        -
          ApiKeyAuth: []
  /events/types:
    get:
      tags:
        - Calendar
      summary: 'List all event types'
      operationId: getEventTypes
      responses:
        '200':
          description: 'Ordered list of event types'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { Id: { type: integer, example: 1 }, Name: { type: string, example: 'Worship Service' } }
                  type: object
        '401':
          description: Unauthorized
        '404':
          description: 'No event types found'
      security:
        -
          ApiKeyAuth: []
  '/events/{id}':
    get:
      tags:
        - Calendar
      summary: 'Get an event by ID'
      operationId: getEvent
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 'Event object'
          content:
            application/json:
              schema:
                properties:
                  Id: { type: integer }
                  Title: { type: string }
                  Start: { type: string, format: date-time }
                  End: { type: string, format: date-time }
                  MinistryId: { description: 'Owning volunteer ministry (Volunteer v2), or null', type: integer, nullable: true }
                  MinistryName: { description: 'Name of the owning volunteer ministry, or null', type: string, nullable: true }
                type: object
        '401':
          description: Unauthorized
        '404':
          description: 'Event not found'
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Calendar
      summary: 'Update an existing event'
      operationId: updateEvent
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                Title:
                  type: string
                Desc:
                  type: string
                  nullable: true
                Start:
                  type: string
                  format: date-time
                End:
                  type: string
                  format: date-time
                Text:
                  type: string
                  nullable: true
                PinnedCalendars:
                  description: 'Replaces the pins. Omit the key to leave them unchanged. Without the global AddEvent right, only pins that change are checked, against the same calendars POST /events allows'
                  type: array
                  items: { type: integer }
                MinistryId:
                  description: 'Volunteer v2: owning volunteer ministry. Omit the key to leave it unchanged; null or 0 clears it (global AddEvent right required to clear).'
                  type: integer
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Event updated'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                type: object
        '400':
          description: 'Unknown volunteer ministry'
        '401':
          description: Unauthorized
        '403':
          description: "AddEvents role required, the event belongs to a volunteer ministry the caller does not manage, or a pin it adds or removes is not the caller's to change"
        '404':
          description: 'Event not found'
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Calendar
      summary: 'Delete an event'
      operationId: deleteEvent
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 'Event deleted'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                type: object
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
        '404':
          description: 'Event not found'
      security:
        -
          ApiKeyAuth: []
  '/events/{id}/primarycontact':
    get:
      tags:
        - Calendar
      summary: "Get an event's primary contact person"
      operationId: getEventPrimaryContact
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 'Person object'
        '401':
          description: Unauthorized
        '404':
          description: 'Event or primary contact not found'
      security:
        -
          ApiKeyAuth: []
  '/events/{id}/secondarycontact':
    get:
      tags:
        - Calendar
      summary: "Get an event's secondary contact person"
      operationId: getEventSecondaryContact
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 'Person object'
        '401':
          description: Unauthorized
        '404':
          description: 'Event or secondary contact not found'
      security:
        -
          ApiKeyAuth: []
  '/events/{id}/location':
    get:
      tags:
        - Calendar
      summary: "Get an event's location"
      operationId: getEventLocation
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 'Location object'
        '401':
          description: Unauthorized
        '404':
          description: 'Event or location not found'
      security:
        -
          ApiKeyAuth: []
  '/events/{id}/audience':
    get:
      tags:
        - Calendar
      summary: "Get an event's audience (linked groups)"
      operationId: getEventAudience
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 'Array of audience/group objects'
        '401':
          description: Unauthorized
        '404':
          description: 'Event or audience not found'
      security:
        -
          ApiKeyAuth: []
  /events/repeat:
    post:
      tags:
        - Calendar
      summary: 'Create a series of repeat events'
      description: 'Generates individual event records for each occurrence of a recurring event within a date range. Each created event is independently editable. Shares one recurrence engine with POST /events/generate-recurring: the same recurrence and date range produce the same occurrence dates on both endpoints, and a single call creates at most 366 events.'
      operationId: createRepeatEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - Title
                - Type
                - StartTime
                - EndTime
                - RecurType
                - RangeStart
                - RangeEnd
              properties:
                Title:
                  type: string
                  example: 'Sunday Worship Service'
                Type:
                  description: 'Event type ID from GET /events/types'
                  type: integer
                  example: 1
                Desc:
                  type: string
                  nullable: true
                Text:
                  description: 'Rich text body (HTML allowed)'
                  type: string
                  nullable: true
                StartTime:
                  description: 'Event start time in HH:MM format'
                  type: string
                  example: '09:00'
                EndTime:
                  description: 'Event end time in HH:MM format'
                  type: string
                  example: '10:30'
                RecurType:
                  type: string
                  example: weekly
                  enum: [weekly, monthly, yearly]
                RecurDOW:
                  description: 'Day of week for weekly recurrence (e.g. Sunday)'
                  type: string
                  example: Sunday
                RecurDOM:
                  description: 'Day of month (1-31) for monthly recurrence'
                  type: integer
                  example: 1
                RecurDOY:
                  description: 'Month-day in MM-DD format for yearly recurrence'
                  type: string
                  example: 04-12
                RangeStart:
                  description: 'First date of the repetition range (inclusive)'
                  type: string
                  format: date
                  example: '2026-01-01'
                RangeEnd:
                  description: 'Last date of the repetition range (inclusive)'
                  type: string
                  format: date
                  example: '2026-12-31'
                PinnedCalendars:
                  type: array
                  items: { type: integer }
                  nullable: true
                LinkedGroupId:
                  type: integer
                  nullable: true
                Inactive:
                  type: integer
                  nullable: true
                  enum: [0, 1]
                SkipExisting:
                  description: 'Skip occurrence dates that already have an active event of this type, making the call idempotent. Same semantics as POST /events/generate-recurring.'
                  type: boolean
                  default: false
              type: object
      responses:
        '200':
          description: 'Repeat events created'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer, example: 52 }
                  skipped: { description: 'Occurrences skipped because an event of this type already existed on that date (only non-zero when SkipExisting is true)', type: integer, example: 0 }
                  eventIds: { type: array, items: { type: integer } }
                type: object
        '400':
          description: 'Invalid input (bad event type, invalid dates, unknown recurrence type, or more than 366 occurrences)'
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
      security:
        -
          ApiKeyAuth: []
  '/events/{id}/time':
    post:
      tags:
        - Calendar
      summary: "Update an event's start and end times"
      operationId: setEventTime
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - startTime
                - endTime
              properties:
                startTime:
                  type: string
                  format: date-time
                  example: '2026-04-05T09:00:00'
                endTime:
                  type: string
                  format: date-time
                  example: '2026-04-05T11:00:00'
              type: object
      responses:
        '200':
          description: 'Time updated'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                type: object
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
        '404':
          description: 'Event not found'
      security:
        -
          ApiKeyAuth: []
  '/events/{id}/status':
    post:
      tags:
        - Calendar
      summary: 'Activate or deactivate an event'
      operationId: setEventStatus
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - active
              properties:
                active:
                  description: 'true to activate, false to deactivate'
                  type: boolean
                  example: true
              type: object
      responses:
        '200':
          description: 'Event status updated'
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
        '404':
          description: 'Event not found'
      security:
        -
          ApiKeyAuth: []
  /events/quick-create:
    post:
      tags:
        - Calendar
      summary: 'Quick-create an event from EventType defaults'
      description: "Creates an event with minimal input, using EventType defaults for title, time, and group. **At least one of eventTypeId or groupId is required.** If only groupId is provided, the event type is auto-detected from the group's linked EventType. If an event of the same type already exists for the given date, returns the existing event instead."
      operationId: quickCreateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                eventTypeId:
                  description: 'Event type ID. Either eventTypeId OR groupId is required.'
                  type: integer
                  example: 5
                groupId:
                  description: "Group ID — when provided without eventTypeId, the event type is auto-detected from the group's linked EventType."
                  type: integer
                  example: 12
                date:
                  description: 'Event date (defaults to today)'
                  type: string
                  format: date
                  example: '2026-04-05'
              type: object
      responses:
        '200':
          description: 'Event created or existing event found'
          content:
            application/json:
              schema:
                properties:
                  eventId: { type: integer, example: 42 }
                  created: { type: boolean, example: true }
                  title: { type: string, example: 'Youth Sunday School — Apr 5, 2026' }
                type: object
        '400':
          description: 'Invalid event type ID, or a date that is not a valid YYYY-MM-DD'
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
      security:
        -
          ApiKeyAuth: []
  /events/today:
    get:
      tags:
        - Calendar
      summary: "Get today's events with attendance stats"
      operationId: getTodaysEvents
      responses:
        '200':
          description: "Today's events"
          content:
            application/json:
              schema:
                properties:
                  events: { type: array, items: { properties: { id: { type: integer }, title: { type: string }, typeName: { type: string }, start: { type: string, format: date-time }, end: { type: string, format: date-time }, checkedIn: { type: integer }, totalAttendees: { type: integer } }, type: object } }
                type: object
        '401':
          description: Unauthorized
      security:
        -
          ApiKeyAuth: []
  '/events/{id}/roster':
    get:
      tags:
        - Calendar
      summary: 'Get group members with attendance status for an event'
      description: 'Returns all members of groups linked to this event, along with their check-in/check-out status.'
      operationId: getEventRoster
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Roster with attendance status'
        '401':
          description: Unauthorized
        '404':
          description: 'Event not found'
      security:
        -
          ApiKeyAuth: []
  '/events/{id}/checkin':
    post:
      tags:
        - Calendar
      summary: 'Check in a person to an event via AJAX'
      operationId: checkinPerson
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - personId
              properties:
                personId:
                  type: integer
                  example: 101
                checkedInById:
                  description: 'Person ID of whoever is checking this person in (e.g., parent dropping off child)'
                  type: integer
                  example: 55
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Person checked in'
        '400':
          description: 'Invalid person ID'
        '401':
          description: Unauthorized
        '404':
          description: 'Event not found'
      security:
        -
          ApiKeyAuth: []
  '/events/{id}/checkout':
    post:
      tags:
        - Calendar
      summary: 'Check out a person from an event via AJAX'
      operationId: checkoutPerson
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - personId
              properties:
                personId:
                  type: integer
                  example: 101
                checkedOutById:
                  description: 'Person ID of whoever is checking this person out (e.g., parent picking up child)'
                  type: integer
                  example: 55
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Person checked out'
        '400':
          description: 'Invalid person ID'
        '401':
          description: Unauthorized
        '404':
          description: 'Event not found'
      security:
        -
