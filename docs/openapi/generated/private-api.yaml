                  nullable: true
                importPositionName:
                  description: 'D23: instead of importPositionId, create a position of this name in the team and qualify the teachers for it'
                  type: string
                  nullable: true
                classEvents:
                  description: 'D28: when classGroupId changes, what happens to the events this ministry owns whose Linked Group is the old class - kept, the class removed from them, or moved to the new class (move needs a new class). GET /ministries/teams/{teamId}/class-events counts them'
                  type: string
                  default: keep
                  enum: [keep, remove, move]
              type: object
      responses:
        '400':
          description: 'The name was sent empty; the ministry does not provide teachers for Sunday School (D29); the class is not a Sunday School class or has no Teacher role; the class has teachers and no position of this team to import them into was given; or classEvents is unknown, or move without a new class'
        '401':
          description: 'Not authenticated'
        '403':
          description: "Not authorized for this team (a team leader may not edit it) or for one of the class's events, or V2 is not enabled"
        '404':
          description: 'No such team'
        '409':
          description: 'A team with that name already exists in this ministry, or the class is linked to another team'
        '200':
          description: Updated
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Volunteer
      summary: 'Delete a team and everything under it'
      description: "Removes the team's positions with their qualifications and staffing requirements, its schedules and occurrences, every assignment on them (service history included) and its team-leader grants, in one transaction. Deactivate the team instead to keep its history. Returns 409 when this is the ministry's ONLY team - a ministry always has at least one, so the answer is to rename it. For a team linked to a class, classEvents (D28) says what happens to the events this ministry owns whose Linked Group is that class: kept, the class removed from them, or deleted through core's event delete in the same transaction."
      operationId: deleteVolunteerTeam
      parameters:
        -
          name: teamId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                classEvents:
                  type: string
                  default: keep
                  enum: [keep, remove, delete]
              type: object
      responses:
        '400':
          description: 'classEvents is unknown'
        '401':
          description: 'Not authenticated'
        '403':
          description: "Not authorized for this team or for one of the class's events, or V2 is not enabled"
        '404':
          description: 'No such team'
        '409':
          description: "This is the ministry's only team; or classEvents delete while another ministry has volunteers assigned on one of the events (unless the caller holds Add Events), or core refuses to delete one (people checked in, a kiosk) - nothing is deleted"
        '200':
          description: Deleted
      security:
        -
          ApiKeyAuth: []
