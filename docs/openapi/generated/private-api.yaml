        '403':
          description: 'Not authorized for this position, or V2 is not enabled'
        '404':
          description: 'No such position or person'
        '409':
          description: "The position's team is linked to a Sunday School class and the person is in that class under another role, a Student above all (D23). A grant on a linked team otherwise also gives the class's Teacher role"
