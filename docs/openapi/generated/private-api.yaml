                  summary: { properties: { totalEvents: { type: integer, example: 5 }, lastAttendanceDate: { type: string, format: date-time, example: '2017-06-06 09:30:00', nullable: true }, streaks: { type: array, items: { properties: { typeId: { type: integer, example: 2, nullable: true }, typeName: { type: string, example: 'Sunday School' }, length: { type: integer, example: 3 } }, type: object } } }, type: object }
