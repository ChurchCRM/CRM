      parameters:
        -
          name: groupKey
          in: path
          description: 'The pledge group key (plg_GroupKey)'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Pledge group details'
          content:
            application/json:
              schema:
                properties:
                  groupKey: { type: string, example: abc123 }
                  familyId: { description: 'Family ID; 0 or null for anonymous donations', type: integer, example: 42, nullable: true }
                  familyName: { description: 'Family display name; empty string for anonymous donations', type: string, example: 'Smith Family' }
                  date: { type: string, format: date, example: '2025-01-15' }
                  fyId: { type: integer, example: 29 }
                  method: { type: string, example: CHECK }
                  checkNo: { type: string, example: '1234', nullable: true }
                  depositId: { type: integer, example: 5, nullable: true }
                  pledgeOrPayment: { type: string, example: Payment, enum: [Pledge, Payment] }
                  schedule: { type: string, example: Monthly, nullable: true }
                  total: { type: number, format: float, example: 250 }
                  total_formatted: { type: string, example: $250.00 }
                  funds: { type: array, items: { properties: { fundId: { type: integer, example: 1 }, fundName: { type: string, example: 'General Fund' }, amount: { type: number, format: float, example: 200 }, amount_formatted: { type: string, example: $200.00 }, nonDeductible: { type: number, format: float, example: 0 }, nonDeductible_formatted: { type: string, example: $0.00 }, comment: { type: string, example: 'Annual pledge' } }, type: object } }
                type: object
        '400':
          description: 'Invalid group key'
        '401':
          description: Unauthorized
        '403':
          description: 'Finance role required'
        '404':
          description: 'Pledge group not found'
      security:
        -
          ApiKeyAuth: []
  '/payments/{groupKey}':
    put:
      tags:
        - Finance
      summary: 'Update an existing pledge or payment group (Finance role required)'
      description: 'Replaces the fund rows for the given GroupKey with the submitted FundSplit. Supports the same multi-fund split fields as POST /payments/pledges.'
      parameters:
        -
          name: groupKey
          in: path
          description: 'The pledge group key (plg_GroupKey)'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - Date
                - FYID
                - type
                - FundSplit
                - iMethod
              properties:
                FamilyID:
                  description: 'Family ID — omit or pass null for anonymous/cash donations with no associated family'
                  type: integer
                  example: 42
                  nullable: true
                Date:
                  description: 'Pledge/payment date'
                  type: string
                  format: date
                  example: '2025-01-15'
                FYID:
                  description: 'Fiscal year ID'
                  type: integer
                  example: 29
                type:
                  description: 'Record type'
                  type: string
                  example: Payment
                  enum: [Pledge, Payment]
                iMethod:
                  description: 'Payment method'
                  type: string
                  example: CHECK
                  enum: [CHECK, CASH, CREDITCARD, BANKDRAFT]
                FundSplit:
                  description: 'JSON-encoded array of fund allocations'
                  type: string
              type: object
      responses:
        '200':
          description: 'Updated pledge/payment group key and details'
          content:
            application/json:
              schema:
                properties:
                  groupKey: { type: string, example: abc123 }
                  payment: { description: 'Pledge details object', type: object }
                type: object
        '400':
          description: 'Validation error (invalid date, fund, check number, etc.)'
        '401':
          description: Unauthorized
        '403':
          description: 'Finance role required'
        '404':
          description: 'Pledge group not found'
        '409':
          description: 'Deposit is closed — payment cannot be edited'
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Finance
      summary: 'Delete a payment by group key (Finance role required)'
      description: 'Deletes the pledge or payment group and all associated fund allocations.'
      parameters:
        -
          name: groupKey
          in: path
          description: 'The pledge group key (plg_GroupKey)'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Pledge group deleted successfully'
        '400':
          description: 'Invalid or missing group key'
        '401':
          description: Unauthorized
        '403':
          description: 'Finance role required'
        '404':
          description: 'Pledge group not found'
      security:
        -
          ApiKeyAuth: []
