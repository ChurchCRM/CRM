      operationId: getChurchLogo
      responses:
        '200':
          description: 'Church logo status'
          content:
            application/json:
              schema:
                properties:
                  hasCustomLogo: { type: boolean, example: true }
                  url: { type: string, example: '/Images/church-logo.png?v=3f2a9c1e8b7d6a54' }
                type: object
        '401':
          description: Unauthorized
        '403':
          description: 'Admin role required'
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Admin
      summary: 'Upload the church logo (base64 encoded)'
      description: 'Accepts a base64 data URI (JPEG, PNG, GIF or WebP), downscales it to fit 1200x400 and stores it as Images/church-logo.png.'
      operationId: uploadChurchLogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                imgBase64:
                  type: string
                  example: 'data:image/png;base64,iVBORw0KGgo...'
              type: object
      responses:
        '200':
          description: 'Logo stored'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                  hasCustomLogo: { type: boolean, example: true }
                  url: { type: string, example: '/Images/church-logo.png?v=3f2a9c1e8b7d6a54' }
                type: object
        '400':
          description: 'Missing or unsupported image data'
        '401':
          description: Unauthorized
        '403':
          description: 'Admin role required'
        '413':
          description: 'Image exceeds the server upload limit or the source image size limit'
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - Admin
      summary: 'Remove the uploaded church logo'
      description: 'Deletes Images/church-logo.png. Idempotent — succeeds even when no logo is stored.'
      operationId: deleteChurchLogo
      responses:
        '200':
          description: 'Logo removed'
