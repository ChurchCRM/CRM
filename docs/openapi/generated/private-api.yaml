  /events/repeat:
    post:
      tags:
        - Calendar
      summary: 'Create a series of repeat events'
      description: 'Generates individual event records for each occurrence of a recurring event within a date range. Each created event is independently editable. Shares one recurrence engine with POST /events/generate-recurring: the same recurrence and date range produce the same occurrence dates on both endpoints, and a single call creates at most 366 events.'
      operationId: createRepeatEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - Title
                - Type
                - StartTime
                - EndTime
                - RecurType
                - RangeStart
                - RangeEnd
              properties:
                Title:
                  type: string
                  example: 'Sunday Worship Service'
                Type:
                  description: 'Event type ID from GET /events/types'
                  type: integer
                  example: 1
                Desc:
                  type: string
                  nullable: true
                Text:
                  description: 'Rich text body (HTML allowed)'
                  type: string
                  nullable: true
                StartTime:
                  description: 'Event start time in HH:MM format'
                  type: string
                  example: '09:00'
                EndTime:
                  description: 'Event end time in HH:MM format'
                  type: string
                  example: '10:30'
                RecurType:
                  type: string
                  example: weekly
                  enum: [weekly, monthly, yearly]
                RecurDOW:
                  description: 'Day of week for weekly recurrence (e.g. Sunday)'
                  type: string
                  example: Sunday
                RecurDOM:
                  description: 'Day of month (1-31) for monthly recurrence'
                  type: integer
                  example: 1
                RecurDOY:
                  description: 'Month-day in MM-DD format for yearly recurrence'
                  type: string
                  example: 04-12
                RangeStart:
                  description: 'First date of the repetition range (inclusive)'
                  type: string
                  format: date
                  example: '2026-01-01'
                RangeEnd:
                  description: 'Last date of the repetition range (inclusive)'
                  type: string
                  format: date
                  example: '2026-12-31'
                PinnedCalendars:
                  type: array
                  items: { type: integer }
                  nullable: true
                LinkedGroupId:
                  type: integer
                  nullable: true
                Inactive:
                  type: integer
                  nullable: true
                  enum: [0, 1]
                SkipExisting:
                  description: 'Skip occurrence dates that already have an active event of this type, making the call idempotent. Same semantics as POST /events/generate-recurring.'
                  type: boolean
                  default: false
              type: object
      responses:
        '200':
          description: 'Repeat events created'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer, example: 52 }
                  skipped: { description: 'Occurrences skipped because an event of this type already existed on that date (only non-zero when SkipExisting is true)', type: integer, example: 0 }
                  eventIds: { type: array, items: { type: integer } }
                type: object
        '400':
          description: 'Invalid input (bad event type, invalid dates, unknown recurrence type, or more than 366 occurrences)'
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
      security:
        -
          ApiKeyAuth: []
