    get:
      tags:
        - 'Member Portal'
      summary: "One email from the signed-in member's own history, with its body"
      description: "The row is returned only when it was addressed to the acting member. Somebody else's row and an id that does not exist are the same 404, so a member cannot learn that an email exists by asking for it. The body is null for the email classes that never store one (account emails carrying a password or a one-time link)."
      operationId: getPortalMyEmail
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'The row, with its stored body'
        '401':
          description: 'No signed-in session'
        '403':
          description: 'API-key caller, or an account with no person record'
        '404':
          description: "No such email in this member's history"
  /portal/calendar/subscription:
    get:
      tags:
        - 'Member Portal'
      summary: "The signed-in member's calendar subscription"
      description: 'Returns the calendars the church shares with members, which of them this member has subscribed to, and the address their calendar app should use. `url` and `webcalUrl` are null until the member saves a selection for the first time — the token is minted then. Session only; API keys are refused.'
      operationId: getPortalCalendarSubscription
      responses:
        '200':
          description: "The member's subscription"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalCalendarSubscription'
        '403':
          description: 'Not a signed-in member, or an API key was used'
    put:
      tags:
        - 'Member Portal'
      summary: "Choose which shared calendars the member's feed carries"
      description: "Stores the member's selection and mints their feed token the first time. Every id must name a calendar the administrator currently shares with members; anything else is a 400, with the same message whether the calendar does not exist or is simply not shared. At least one calendar is required — a feed of nothing is not a useful thing to hand a calendar app."
      operationId: putPortalCalendarSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                calendars:
                  description: 'Calendar ids, as GET returns them'
                  type: array
                  items: { type: string, example: 'calendar:3' }
              type: object
      responses:
        '200':
          description: 'The saved subscription'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalCalendarSubscription'
        '400':
          description: 'Empty selection, or a calendar that is not shared with members'
        '403':
          description: 'Not a signed-in member, an API key was used, or the CSRF token was missing'
  /portal/calendar/subscription/reset:
    post:
      tags:
        - 'Member Portal'
      summary: 'Issue the member a new feed address'
      description: "Rotates the member's feed token, keeping their calendar selection. The previous address stops answering immediately — this is what a member does when they have shared the old one by accident."
      operationId: resetPortalCalendarSubscription
      responses:
        '200':
          description: 'The subscription, at its new address'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalCalendarSubscription'
        '403':
          description: 'Not a signed-in member, an API key was used, or the CSRF token was missing'
  /portal/me:
    get:
      tags:
        - 'Member Portal'
      summary: "The signed-in member's own profile"
      description: "Returns the acting member's person record as the Member Portal renders it. The member is taken from the session; there is no person id to pass. Session only — API keys are refused."
      operationId: getPortalMe
      responses:
        '200':
          description: "The member's profile"
          content:
            application/json:
              schema:
                properties:
                  profile: { properties: { id: { type: integer, example: 100 }, firstName: { type: string, example: Lena }, lastName: { type: string, example: Black }, email: { type: string, example: lena@example.com }, cellPhone: { type: string, example: '(206) 555-0100' }, birthday: { description: 'ISO date, empty when unknown', type: string, example: '1971-12-24' }, photoUrl: { type: string }, canEditBirthday: { description: 'Mirrors bPortalAllowBirthdayEdit', type: boolean } }, type: object }
                type: object
        '401':
          description: 'No signed-in session'
        '403':
          description: 'API-key caller, or an account with no person record'
    post:
      tags:
        - 'Member Portal'
      summary: "Update the signed-in member's own profile"
      description: "Applies the allow-listed fields present in the body to the member's own person record and writes a timeline note naming what changed. Anything else in the body is ignored. Birthday is accepted only when bPortalAllowBirthdayEdit is on."
      operationId: updatePortalMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                firstName:
                  type: string
                middleName:
                  type: string
                lastName:
                  type: string
                title:
                  type: string
                suffix:
                  type: string
                email:
                  type: string
                workEmail:
                  type: string
                homePhone:
                  type: string
                cellPhone:
                  type: string
                workPhone:
                  type: string
                birthday:
                  type: string
                  example: '1971-12-24'
              type: object
      responses:
        '200':
          description: 'The saved profile'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                  profile: { type: object }
                  updated: { description: 'The fields that actually changed', type: array, items: { type: string } }
                type: object
        '400':
          description: 'Validation error'
        '403':
          description: 'API-key caller, or an invalid CSRF token'
  /portal/me/photo:
    get:
      tags:
        - 'Member Portal'
      summary: "The signed-in member's own photo (binary image)"
      description: "Returns the member's uploaded photo bytes. The portal serves its own copy because AuthMiddleware confines a self-service session to /portal and /api/portal, so /api/person/{id}/photo — which the profile used to point at — answers those sessions with 403 and every avatar renders broken. The member is taken from the session; there is no person id to pass. Cached privately for two hours, the same window the person endpoint uses; the URLs the portal hands out carry a ?v=<mtime> cache-buster so a fresh upload is visible at once."
      operationId: getPortalMyPhoto
      responses:
        '200':
          description: 'The photo'
          content:
            'image/*':
              schema:
                type: string
                format: binary
        '401':
          description: 'No signed-in session'
        '403':
          description: 'API-key caller, or an account with no person record'
        '404':
          description: 'This member has not uploaded a photo'
    post:
      tags:
        - 'Member Portal'
      summary: "Replace the signed-in member's own photo"
      description: "The /api/person/{id}/photo upload route is behind the EditRecords role, which a self-service login never has, so the portal has its own endpoint for the member's own photo. It calls the same model method and writes the same 'photo' timeline note."
      operationId: updatePortalMyPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - imgBase64
              properties:
                imgBase64:
                  description: 'Base64-encoded image with its data URI prefix'
                  type: string
              type: object
      responses:
        '200':
          description: 'Photo stored'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                  profile: { type: object }
                type: object
        '400':
          description: 'Missing or unusable image data'
        '413':
          description: 'Image larger than the server allows'
  /portal/family:
    get:
      tags:
        - 'Member Portal'
      summary: "The signed-in member's own family"
      description: "Returns the acting member's family, its members, and whether this member is one of the adults who may change it. The family is the member's own; there is no family id to pass."
      operationId: getPortalFamily
      responses:
        '200':
          description: "The member's family"
          content:
            application/json:
              schema:
                properties:
                  family: { type: object, nullable: true }
                  members: { type: array, items: { type: object } }
                  canEdit: { description: "True for the family's head or spouse", type: boolean }
                type: object
        '403':
          description: 'API-key caller'
    post:
      tags:
        - 'Member Portal'
      summary: "Update the signed-in member's own family"
      description: "Applies the allow-listed fields present in the body to the member's own family and writes a timeline note naming what changed. Only an adult of the family (head or spouse, per sDirRoleHead / sDirRoleSpouse) may call it; every other member gets 403."
      operationId: updatePortalFamily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                address1:
                  type: string
                address2:
                  type: string
                city:
                  type: string
                state:
                  type: string
                zip:
                  type: string
                country:
                  type: string
                homePhone:
                  type: string
                email:
                  type: string
                weddingDate:
                  type: string
                  example: '2004-06-12'
              type: object
      responses:
        '200':
          description: 'The saved family'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                  family: { type: object }
                  updated: { type: array, items: { type: string } }
                type: object
        '400':
          description: 'Validation error'
        '403':
          description: 'Not an adult of this family, an API-key caller, or an invalid CSRF token'
        '404':
          description: 'The member has no family record'
  /portal/family/confirm:
    post:
      tags:
        - 'Member Portal'
      summary: "Confirm the member's family details are current"
      description: "Writes exactly the note the emailed verify link writes — type 'verify', entered by SELF_VERIFY, the text 'No Changes' or the member's comment — so a portal confirmation reaches the People → Verify dashboard the same way a token-link one does."
      operationId: confirmPortalFamily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - result
              properties:
                result:
                  type: string
                  enum: [no-change, change-needed]
                comment:
                  description: 'Required when result is change-needed'
                  type: string
              type: object
      responses:
        '200':
          description: 'Confirmation recorded'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                type: object
        '400':
          description: 'No choice made, or a change requested with no comment'
        '404':
          description: 'The member has no family record'
  '/portal/family/members/{personId}/photo':
    get:
      tags:
        - 'Member Portal'
      summary: "The photo of somebody in the signed-in member's own family (binary image)"
      description: "The read side of the portal's own photo serving, for the faces on the My Family page. The id is checked against the members of the acting member's family — the same enumeration GET /portal/family renders — and anything else is 404, never 403: a 403 would confirm that the id names a real person, which a member outside that family must not learn (design P12). This is the only portal route that takes a person id, and it never names the actor."
      operationId: getPortalFamilyMemberPhoto
      parameters:
        -
          name: personId
          in: path
          description: "A person in the acting member's own family"
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'The photo'
          content:
            'image/*':
              schema:
                type: string
                format: binary
        '401':
          description: 'No signed-in session'
        '403':
          description: 'API-key caller, or an account with no person record'
        '404':
          description: 'Not a member of this family, or that member has no photo'
  /portal/family/members:
    post:
      tags:
        - 'Member Portal'
      summary: "Propose a new member of the signed-in member's family"
      description: "Creates a person in the member's family marked SELF_REGISTER, exactly as the public registration form does, so the entry waits on People → Self Registrations for staff to review. It is never a live member. Only an adult of the family may call it."
      operationId: addPortalFamilyMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - firstName
                - lastName
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  description: 'A family-role option id; falls back to the configured child role'
                  type: string
                birthday:
                  type: string
                  example: '2015-03-08'
              type: object
      responses:
        '200':
          description: 'Pending entry created'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                  personId: { type: integer, example: 1234 }
                type: object
        '400':
          description: 'Validation error'
        '403':
          description: 'Not an adult of this family'
        '404':
          description: 'The member has no family record'
