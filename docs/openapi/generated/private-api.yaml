  '/person/{personId}/photo':
    get:
      tags:
        - People
      summary: "Get a person's uploaded photo"
      description: 'Returns the binary photo image. Returns 404 if no photo has been uploaded (use avatar endpoint for fallback).'
      operationId: getPersonPhoto
      parameters:
        -
          name: personId
          in: path
          required: true
          schema:
            type: integer
            example: 42
      responses:
        '200':
          description: 'Photo image'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '404':
          description: 'No uploaded photo for this person'
      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - People
      summary: "Upload a person's photo (base64 encoded)"
      description: 'Upload a base64-encoded image file for a person. Supported formats: PNG, JPEG, JPG, GIF, WEBP. Maximum size: 10MB.'
      operationId: uploadPersonPhoto
      parameters:
        -
          name: personId
          in: path
          required: true
          schema:
            type: integer
            example: 42
      requestBody:
        description: 'Base64 encoded image data'
        required: true
        content:
          application/json:
            schema:
              required:
                - imgBase64
              properties:
                imgBase64:
                  description: 'Base64-encoded image data with data URI prefix'
                  type: string
                  example: 'data:image/jpeg;base64,/9j/4AAQSkZJRg...'
              type: object
      responses:
        '200':
          description: 'Photo uploaded successfully'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                  hasPhoto: { type: boolean, example: true }
                type: object
        '400':
          description: 'Invalid image data or upload failed'
        '401':
          description: Unauthorized
        '403':
          description: 'EditRecords role required'
        '404':
          description: 'Person not found'
        '413':
          description: 'PHP discarded the request body because it exceeded the server upload limit'
      security:
        -
          ApiKeyAuth: []
    delete:
      tags:
        - People
      summary: "Delete a person's uploaded photo"
      description: 'Remove the uploaded photo for a person. This operation is idempotent and will return success even if no photo exists.'
      operationId: deletePersonPhoto
      parameters:
        -
          name: personId
          in: path
          required: true
          schema:
            type: integer
            example: 42
      responses:
        '200':
          description: 'Photo deleted successfully'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                type: object
        '401':
          description: Unauthorized
        '403':
          description: 'DeleteRecords role required'
      security:
        -
          ApiKeyAuth: []
