    post:
      tags:
        - Volunteer
      summary: 'Create a volunteer schedule: which calendar events a team staffs'
      description: 'Every occurrence is anchored to a calendar event (D20); the link mode says how the events are found (D22). A schedule follows events that already exist (D31): it is refused unless at least one upcoming active event matches. A new schedule generates its occurrences at once, up to the scheduling horizon, and assigns the default volunteers its staffing needs carry on them (D33, D32); `generated` is that run, shaped as POST /ministries/schedules/{scheduleId}/generate answers, and null for a schedule saved inactive, which makes none. A single event is staffed through POST /ministries/ministries/{ministryId}/staffed-events instead. The removed fields (recurType, recurDow, recurDom, startTime, endTime, generateAheadDays) are refused with 400.'
      operationId: createVolunteerSchedule
      parameters:
        -
          name: ministryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - linkMode
                - teamId
                - windowStart
              properties:
                name:
                  type: string
                linkMode:
                  description: 'event_type: events of a type with exactly the title titleFilter. class: events whose Linked Group is groupId. ministry: events this ministry owns with exactly the title titleFilter.'
                  type: string
                  enum: [event_type, class, ministry]
                teamId:
                  description: "Required: a schedule always belongs to one of the ministry's teams. A team leader may only name a team they lead (design section 4.6)."
                  type: integer
                eventTypeId:
                  description: 'Required when linkMode is event_type'
                  type: integer
                  nullable: true
                titleFilter:
                  description: "Required in the event_type and ministry modes: the events' exact title, compared ignoring case (D31)"
                  type: string
                  nullable: true
                groupId:
                  description: 'Required when linkMode is class: an existing group'
                  type: integer
                  nullable: true
                startOffsetMinutes:
                  description: "Added to the event's start to give the volunteers' start; within +/-720. Default 0."
                  type: integer
                  example: -45
                endOffsetMinutes:
                  description: "Added to the event's end to give the volunteers' end; within +/-720. Default 0."
                  type: integer
                  example: 15
                windowStart:
                  type: string
                  format: date
                windowEnd:
                  type: string
                  format: date
                  nullable: true
                requirements:
                  description: "The schedule's whole staffing plan, set in one request. Omit the field to leave the plan alone; send an empty array to clear it. Positions not listed are removed. The schedule row and its plan are written in one transaction."
                  type: array
                  items: { required: [positionId, minCount], properties: { positionId: { type: integer }, minCount: { type: integer, example: 1 }, maxCount: { type: integer, example: 1, nullable: true }, notes: { type: string, nullable: true }, defaults: { description: "D32/D35: the position's default volunteers in the order they are assigned. Absent keeps the stored ones, an empty list clears them. At most the position's Max (its Min when Max is blank), never more than 50, each person once; a new one must hold an active qualification, a stored one named again is kept even when it no longer does. The removed defaultPersonId and defaultAccepted fields are refused (400).", type: array, items: { required: [personId], properties: { personId: { type: integer }, accepted: { description: 'Recorded as accepted instead of being asked to respond. Left out: the stored flag, false for a new default', type: boolean } }, type: object } } }, type: object }
                  nullable: true
              type: object
      responses:
        '400':
          description: 'A design section 2.8 invariant was violated: a missing or unknown event type or group, a missing title, no upcoming event that matches (D31), an offset outside +/-720, an eventId, or a removed field; or a staffing need with more default volunteers than its Max, or one person twice'
        '401':
          description: 'Not authenticated'
        '403':
          description: 'Not authorized: you neither administer this ministry nor lead the team named by teamId (design section 4.6), a new default volunteer is not qualified, or V2 is not enabled'
        '404':
          description: 'No such ministry, or a default volunteer names an unknown person'
        '201':
          description: 'Created, with its occurrences generated'
          content:
            application/json:
              schema:
                properties:
                  schedule: { type: object }
                  generated: { description: 'The run Save made (D33): created, existing, from, through, assigned, skipped, unqualified, noEvents, searched; null when saved inactive', type: object, nullable: true }
                type: object
      security:
        -
          ApiKeyAuth: []
