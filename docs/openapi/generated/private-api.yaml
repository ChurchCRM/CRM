  /events/generate-recurring:
    post:
      tags:
        - Calendar
      summary: "Generate recurring events from an EventType's recurrence settings"
      description: "Creates multiple events between startDate and endDate based on the EventType's recurrence pattern (weekly, monthly, or yearly). Optionally skips dates where an event of the same type already exists. Shares one recurrence engine with POST /events/repeat: the same recurrence and date range produce the same occurrence dates on both endpoints, and a single call creates at most 366 events."
      operationId: generateRecurringEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - eventTypeId
                - startDate
                - endDate
              properties:
                eventTypeId:
                  type: integer
                  example: 5
                startDate:
                  type: string
                  format: date
                  example: '2026-04-05'
                endDate:
                  type: string
                  format: date
                  example: '2026-06-28'
                skipExisting:
                  description: 'Skip dates that already have an event of this type'
                  type: boolean
                  example: true
                pinnedCalendars:
                  description: 'Calendar IDs to pin generated events to'
                  type: array
                  items: { type: integer }
                  example: [1]
              type: object
      responses:
        '200':
          description: 'Events generated'
          content:
            application/json:
              schema:
                properties:
                  created: { type: integer, example: 12 }
                  skipped: { type: integer, example: 1 }
                  events: { type: array, items: { properties: { id: { type: integer }, title: { type: string }, date: { type: string, format: date } }, type: object } }
                type: object
        '400':
          description: 'Invalid input (bad event type, invalid dates, event type with no recurrence configured, or more than 366 occurrences)'
        '401':
          description: Unauthorized
        '403':
          description: 'AddEvents role required'
      security:
        -
          ApiKeyAuth: []
